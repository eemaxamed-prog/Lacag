<style>
/* Layout: one-column phone app — sticky top bar, scrolling view, fixed bottom tab bar; widens to a centered 720px column on desktop */
:root{
  /* Bloomberg-terminal look, single dark theme. Amber/blue/white for everything; green and red only mean up and down. */
  --bg:#000000; --surface:#0E0F11; --surface2:#1A1B1F; --line:#2B2D33;
  --fg:#F2F2F2; --muted:#A3A3A8; --amber:#FFA028; --accent:#FFA028; --accent-ink:#000000; --badge-ink:#000000;
  --up:#2CC38B; --down:#FF6A5C; --btc:#FFA028;
  --c1:#FFA028; --c2:#4AA3FF; --c3:#FFE08A; --c4:#9CC9FF; --c5:#D9D9DE; --c6:#C77A12; --c7:#2A6FD6; --c8:#8C8C93;
  --f-display:"IBM Plex Sans","Schibsted Grotesk",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-body:"IBM Plex Sans","Schibsted Grotesk",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
/* optional colour-blind up/down from Bloomberg's CVD research: blue for up, red for down */
:root[data-updown="cvd"]{--up:#3D9BFF; --down:#FF4D4D}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.live .dot{background:var(--up)}
.chip.warn .dot{background:var(--btc)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.primary{background:var(--accent);color:var(--accent-ink)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

h2.sec{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:26px 0 10px;text-wrap:balance}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}

/* hero */
.hero{padding:14px 0 6px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,10vw,46px);letter-spacing:-.03em;line-height:1.05;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.hero-chg{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:600}
.hero-chg .when{color:var(--muted);font-weight:400;font-size:13px}

.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.chart{position:relative;height:230px;margin:10px -4px 4px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.ranges{display:flex;justify-content:space-between;gap:2px;margin:4px 0 4px;overflow-x:auto;scrollbar-width:none}
.ranges::-webkit-scrollbar{display:none}
.ranges button{flex:1 0 auto;border:0;background:none;padding:7px 8px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);font-family:var(--f-num)}
.ranges button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);line-height:1.3}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}

.banner{background:color-mix(in srgb,var(--amber) 13%,var(--surface));border-radius:var(--r);padding:12px 14px;margin-top:10px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.banner b{display:block;font-size:14px}
.banner .btn{margin-top:8px}

/* list rows */
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.badge{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:11.5px;letter-spacing:-.01em;color:var(--badge-ink)}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;flex:0 0 auto}
.item .end .t1{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.item .end .t2{font-family:var(--f-num)}
.pill{display:inline-block;font-family:var(--f-num);font-size:12px;padding:1px 6px;border-radius:6px}
.pill.up{background:color-mix(in srgb,var(--up) 14%,transparent)}
.pill.down{background:color-mix(in srgb,var(--down) 14%,transparent)}
.pill.flat{background:var(--surface2)}
.month-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:18px 2px 6px}

.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.sumgrid .k{font-size:12px;color:var(--muted)}
.sumgrid .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px;margin-top:2px}

/* donut */
.alloc{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:380px){.alloc{grid-template-columns:1fr}}
.alloc svg{width:150px;height:150px;justify-self:center}
.legend{display:flex;flex-direction:column;gap:7px;min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .pc{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted)}

/* heatmap */
.hm-wrap{overflow-x:auto;margin:0 -4px}
table.hm{border-collapse:separate;border-spacing:3px;font-family:var(--f-num);font-size:11px;font-variant-numeric:tabular-nums;min-width:560px;width:100%}
table.hm th{font-weight:500;color:var(--muted);font-size:10.5px;padding:2px;text-align:center}
table.hm th.y{text-align:left;color:var(--fg);font-size:12px}
table.hm td{text-align:center;padding:7px 2px;border-radius:5px;background:var(--surface2)}
table.hm td.tot{font-weight:600;outline:1px solid var(--line)}
table.hm td.na{background:transparent;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar-row .track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar-row .fill{height:100%;border-radius:5px;background:var(--accent)}
.bar-row .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;min-width:86px}

.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);margin:10px 0 8px}

/* buttons & forms */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14.5px;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:color-mix(in srgb,var(--down) 14%,var(--surface));color:var(--down)}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;font-size:16px;min-width:0}
.field textarea{font-family:var(--f-num);font-size:12px;min-height:110px}
.field .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.total-box{background:var(--surface2);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.err{color:var(--down);font-size:13px;min-height:1em}
.presets{display:flex;gap:6px;flex-wrap:wrap}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:rgb(5 8 15 / .45)}
.sheet .panel{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;overscroll-behavior:contain}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:20px;max-height:86%}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h3{font-family:var(--f-display);font-size:20px;margin:0;letter-spacing:-.02em}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.note{font-size:13.5px;color:var(--muted);line-height:1.5}
.note b{color:var(--fg)}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.55}
ol.steps li{margin:3px 0}
code{font-family:var(--f-num);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:5px}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
.empty-state b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px;font-family:var(--f-display)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Lacag additions ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pf-btn{border:0;background:var(--surface2);border-radius:11px;padding:6px 8px 6px 11px;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;max-width:42vw;min-width:0}
.pf-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-btn svg{width:16px;height:16px;flex:0 0 auto;color:var(--muted)}
.brand{margin-right:0}
.spacer{flex:1}
.ccy-sel select{border:0;background:var(--surface2);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px;font-family:var(--f-num)}
.legend-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.lk{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--accent);vertical-align:middle}
.lk.solid{background:var(--up)}
.lk.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.tog[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:4px}
.plan-card,.goal{display:block;width:100%;text-align:left;border:0;color:inherit}
.reps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rep{background:var(--surface);border-radius:var(--r);padding:12px 14px;min-width:0}
.rep-h{font-weight:700;font-size:13.5px}
.rep-v{font-family:var(--f-num);font-size:20px;margin-top:6px}
.rep-g{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-top:8px}
.rep-g .num{text-align:right;font-family:var(--f-num)}
.big2{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.sw-row{display:flex;align-items:center}
.sw-row input{width:22px;height:22px;accent-color:var(--accent)}
.linkish{border:0;background:none;text-align:left;padding:0;color:inherit}
.switch{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.switch input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--accent);margin-top:1px}
.dotk{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.bar-row.wide{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto}
.bar-row .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5}
.bar-row .track{position:relative;overflow:visible}
.bar-row .fill{border-radius:5px}
.ask-out{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.ask-out:empty{display:none}
select.mini{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:14px}
.tot-in{width:44%;text-align:right;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);font-size:16px}
table.hm.narrow{min-width:0}
label.item{cursor:pointer}
details summary{cursor:pointer}
.kpi .v{font-size:16px}
@media (max-width:360px){.reps{grid-template-columns:1fr}}
.brand-name{display:none}
@media (min-width:480px){.brand-name{display:inline}}
.item .t1.wrap,.item .t2.wrap{white-space:normal}
.seg button{white-space:nowrap}
.bar-row.wide .val{min-width:118px}

/* ---- terminal styling ---- */
.eyebrow,h2.sec,.kpi .k,.sumgrid .k,.month-h,.field label,.field .lbl,.rep-h{color:var(--amber)}
h2.sec{text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.card,.kpi,.list,.rep{border:1px solid var(--line)}
.top{background:color-mix(in srgb,#000 88%,transparent)}
.tabs{background:color-mix(in srgb,#0B0B0D 94%,transparent)}
.ranges button[aria-pressed="true"]{background:var(--amber);color:#000}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--amber);box-shadow:inset 0 0 0 1px var(--line)}
.tog[aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
/* up/down never rely on colour alone */
.up::before{content:"\25B2";font-size:.62em;margin-right:.3em;vertical-align:.12em}
.down::before{content:"\25BC";font-size:.62em;margin-right:.3em;vertical-align:.12em}
.lk.solid::before,.prog .up::before{content:none}
/* chart value box */
.chart .ct{display:none}
.ctip{position:absolute;top:0;left:0;z-index:3;pointer-events:none;min-width:150px;max-width:78%;padding:8px 10px;border-radius:10px;
  background:color-mix(in srgb,#141519 72%,transparent);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
  backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(8px) saturate(1.2);box-shadow:0 6px 18px rgb(0 0 0 / .45);font-size:12px}
.ctip .th{color:var(--amber);font-weight:600;margin-bottom:4px;font-family:var(--f-num);font-size:11.5px}
.ctip .tr{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:6px;align-items:center;line-height:1.5}
.ctip .tr.sub{opacity:.85}
.ctip .sw{width:8px;height:8px;border-radius:2px}
.ctip .tl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctip .tv{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--fg);text-align:right;white-space:nowrap}
.ctip .tv.up{color:var(--up)} .ctip .tv.down{color:var(--down)}

.hero-val{display:flex;align-items:center;gap:10px}
.eye-btn{border:0;background:var(--surface2);color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.eye-btn svg{width:20px;height:20px}
.eye-btn[aria-pressed="true"]{color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}

/* budget */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}
.mn-label{font-family:var(--f-num);font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center;color:var(--amber)}
.stackbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface2);gap:2px}
.stackbar span{display:block;height:100%;min-width:2px}
.stackbar .left{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 7px);opacity:.6}
.bgroup .bg-h{display:grid;grid-template-columns:10px minmax(0,1fr) auto 58px;gap:8px;align-items:center;padding:11px 14px;background:var(--surface2)}
.bgroup .bg-h .sw{width:10px;height:10px;border-radius:2px}
.bgroup .bg-name{font-weight:700;color:var(--amber);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgroup .bg-h .num{font-family:var(--f-num);text-align:right}
.bgroup .bg-p{font-size:12px}
.bgroup .item{border-top:1px solid var(--line)}
.bgroup .item.off .t1,.bgroup .item.off .t2{opacity:.6}
.bgroup .item.add .t2{color:var(--amber)}
.prog.thin{height:4px;margin:6px 0 0}
table.ytab{width:100%;border-collapse:collapse;font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums;min-width:320px}
table.ytab th,table.ytab td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.ytab th:first-child{text-align:left;color:var(--amber);font-weight:500}
table.ytab thead th{color:var(--muted);font-weight:500;font-size:11px}
table.ytab tbody tr{cursor:pointer}
table.ytab tr.cur{background:color-mix(in srgb,var(--amber) 12%,transparent)}
table.ytab tr.tot th,table.ytab tr.tot td{font-weight:600;border-bottom:0}
.grid-months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}

/* overview / positions / returns v3 */
.amber-v{color:var(--amber);font-family:var(--f-num)}
.bm-chips{margin-top:8px}
.sub-h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--amber);font-weight:600;margin:18px 2px 8px}
table.rtab{width:100%;border-collapse:collapse;font-family:var(--f-num);font-size:12px;font-variant-numeric:tabular-nums;min-width:360px}
table.rtab th,table.rtab td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.rtab thead th{color:var(--muted);font-weight:500;font-size:11px}
table.rtab tbody th{text-align:left;font-family:var(--f-body);font-weight:600;color:var(--fg);max-width:130px;overflow:hidden;text-overflow:ellipsis}
table.rtab tr.bm th{font-weight:500;color:var(--muted)}
table.rtab th .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
table.rtab td.na{color:var(--muted)}
.ptable{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px}
.prow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 22px;gap:6px;align-items:center;padding:11px 8px 11px 12px;border-top:1px solid var(--line);cursor:pointer}
.prow:first-child{border-top:0}
.prow.phead{cursor:default;padding-top:9px;padding-bottom:9px;background:var(--surface2)}
.prow.ptot{cursor:default;background:var(--surface2);font-family:var(--f-num);font-size:12px}
.ph{border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;text-align:right;padding:0;white-space:nowrap}
.ph.pt{text-align:left}.ph.on{color:var(--amber)}
.pt{min-width:0}
.pn{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qb{display:inline-block;background:var(--surface2);border-radius:4px;padding:0 4px;font-family:var(--f-num);color:var(--fg);font-size:10.5px}
.pv{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px;min-width:0}
.pv>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pu{color:var(--muted);font-size:10.5px;margin-top:2px}
.pv .up::before,.pv .down::before{font-size:.55em}
.pm{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 0;text-align:center}
.rb-wrap{overflow-x:auto;padding-bottom:4px}
.rb-wrap svg{display:block}
.rb-wrap rect{cursor:pointer}
.rb-read{font-family:var(--f-num);font-size:13px;margin-bottom:8px;color:var(--amber)}
@media (max-width:400px){.prow{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 18px;gap:4px;padding-left:10px}.pv{font-size:11px}.pn{font-size:12px}}

table.rtab{min-width:0;font-size:11.5px}
table.rtab th,table.rtab td{padding:9px 4px}
table.rtab tbody th{max-width:92px}
.rep-g .num{white-space:nowrap}
.ps{white-space:normal}
.ret-ctl{margin:20px 2px 8px}
table.rtab td.why{text-align:left;font-family:var(--f-body);font-size:11.5px}
table.rtab{font-size:11px}
table.rtab th,table.rtab td{padding:9px 3px}
table.rtab tbody th{max-width:84px;font-size:12px}

/* ---- appearance settings ---- */
:root{--card-alpha:100}
:root[data-look="day"]{--bg:#F1F2F4;--surface:#FFFFFF;--surface2:#E7E9ED;--line:#D3D7DE;--fg:#111317;--muted:#5D6370;--btc:#C77700;

/* ================= model ================= */
function fxPoints(cur,today){
  const m=new Map();let mode='lin';const h=C.fx&&C.fx[cur];
  if(h&&h.length){mode='step';for(const [d,v] of h)m.set(dn(d),v);}
  else{for(const t of S.txs){if(t.type!=='buy'&&t.type!=='sell')continue;const a=assetById(t.assetId);if(a&&a.currency===cur&&t.fx>0)m.set(dn(t.date),t.fx);}}
  const live=C.fxLive&&C.fxLive.date===localToday()?C.fxLive[cur]:null;
  const fallback=h&&h.length?h[h.length-1][1]:S.fx[cur];
  if(live||fallback)m.set(today,live||fallback);
  return {pts:[...m.entries()].sort((a,b)=>a[0]-b[0]),mode};
}
function dense(points,d0,N,mode){
  const out=new Float64Array(N);if(!points.length){out.fill(NaN);return out;}
  let j=0;
  for(let i=0;i<N;i++){const day=d0+i;
    while(j<points.length-1&&points[j+1][0]<=day)j++;
    if(day<=points[0][0])out[i]=points[0][1];
    else if(j>=points.length-1||mode==='step')out[i]=points[j][1];
    else{const [a,va]=points[j],[b,vb]=points[j+1];out[i]=va+(vb-va)*(day-a)/(b-a);}}
  return out;
}
const histKey=a=>(a.cls==='crypto'?'bin:':'td:')+(a.dataSymbol||a.symbol).toUpperCase();
const TYPE_ORDER={deposit:0,transfer:1,balance:2,split:2.5,buy:3,sell:4,dividend:5,interest:6,withdraw:7};

/* product of split ratios after a date: turns an old per-share price into today's share terms */
function splitAfter(assetId,date){let f=1;for(const t of S.txs)if(t.type==='split'&&t.assetId===assetId&&t.date>date&&t.ratio>0)f*=t.ratio;return f;}
/* shared market data (independent of portfolio) */
function market(){
  if(MEMO.mkt&&MEMO.mkt.v===VERSION)return MEMO.mkt;
  const today=dn(localToday());
  let first=today;for(const t of S.txs){const d=dn(t.date);if(d<first)first=d;}
  const d0=first;const N=today-d0+1;
  const fxD={};for(const cur of CCYS){if(cur==='NOK')continue;const {pts,mode}=fxPoints(cur,today);fxD[cur]=pts.length?dense(pts,d0,N,mode):null;}
  const fxAt=(cur,i)=>{if(cur==='NOK')return 1;const a=fxD[cur];if(!a)return S.fx[cur]||NaN;return a[Math.max(0,Math.min(N-1,i))];};
  const priceCur={},src={};
  for(const a of S.assets){
    const m=new Map();let mode='lin';const h=C.hist[histKey(a)];

/* ================= overview ================= */
function portfolioSeries(M,Z,key,st){
  if(key==='1D'){
    const L=M.N-1;const tNow=Date.now();const t0=tNow-24*3600e3;const times=new Set();const live=M.holdings.filter(h=>h.qty>0);
    for(const h of live){const it=C.intra[h.a.id];if(it&&tNow-it.t<6*3600e3)for(const [t] of it.s)if(t>=t0)times.add(t);}
    const k=UI.ccy==='NOK'?1:M.fxAt(UI.ccy,L);
    if(times.size<3)return {time:false,pts:[{x:M.today-1,v:M.N>1?Z.V[L-1]:Z.V[L]},{x:M.today,v:Z.V[L]}]};
    const pts=[];for(const t of [...times].sort((a,b)=>a-b)){let v=0;for(const h of live){const it=C.intra[h.a.id];let p=null;
        if(it&&tNow-it.t<6*3600e3){for(const [tt,pp] of it.s){if(tt<=t)p=pp;else break;}if(p!=null&&it.q&&it.q!==h.a.currency)p=p*M.fxAt(it.q,L)/M.fxAt(h.a.currency,L);}
        if(p==null)p=h.priceNow;v+=h.qty*p*h.fxNow;}pts.push({x:t,v:v/k});}
    return {time:true,pts};}
  const idxs=[];for(let i=st.startI;i<=st.ei;i++)idxs.push(i);const base=st.bi>=0?Z.IDX[st.bi]:1;
  return {time:false,idx:downsample(idxs)};
}
function moversBlock(M){const hs=M.holdings.filter(h=>h.qty>0).sort((a,b)=>Math.abs(b.dayPct)-Math.abs(a.dayPct)).slice(0,5);
  if(!hs.length)return '<div class="card muted">No investments held right now.</div>';
  return `<div class="list">${hs.map(h=>`<button class="item" data-asset="${h.a.id}">${badge(h.a)}<div class="mid"><div class="t1">${esc(h.a.name||h.a.symbol)}</div><div class="t2">${money(h.priceNow,h.a.currency)}</div></div><div class="end"><div class="t1 ${cl(h.dayChg)}">${F(conv(M,h.dayChg),{sign:true})}</div><div class="t2"><span class="pill ${cl(h.dayPct)}">${pct(h.dayPct)}</span></div></div></button>`).join('')}</div>`;}

function periodStart(day,freq){const d=new Date(day*DAY);const y=d.getUTCFullYear(),m=d.getUTCMonth();const sm=freq==='month'?m:Math.floor(m/3)*3;return Math.floor(Date.UTC(y,sm,1)/DAY);}
function nextPeriod(start,freq){return addMonths(start,freq==='month'?1:3);}
function periodLabel(start,freq){const d=new Date(start*DAY);return freq==='month'?MON[d.getUTCMonth()]+' '+d.getUTCFullYear():'Q'+(Math.floor(d.getUTCMonth()/3)+1)+' '+d.getUTCFullYear();}
function contributions(M,from,to){let s=0;for(let day=Math.max(from,M.d0);day<to&&day<=M.today;day++){const c=M.CF[day-M.d0];if(c>0)s+=c;}return s;}
function buyPlanCard(M){const bp=S.buyPlan;if(!bp||!bp.amount)return '';
  const st=periodStart(M.today,bp.freq);const nx=nextPeriod(st,bp.freq);const done=contributions(M,st,nx);const p=Math.min(1,done/bp.amount);const daysLeft=nx-M.today;
  return `<h2 class="sec">Buying plan</h2><button class="card plan-card" data-tab="plan" data-psub="buy"><div class="row-between"><div><div class="small muted">${periodLabel(st,bp.freq)} · ${bp.freq==='month'?'monthly':'quarterly'} target ${kr(bp.amount)}</div><div class="num" style="font-size:18px;margin-top:2px">${kr(done)} <span class="muted small">added</span></div></div><span class="pill ${done>=bp.amount?'up':'flat'}">${done>=bp.amount?'Done':daysLeft+' days left'}</span></div><div class="prog"><span style="width:${p*100}%"></span></div></button>`;}

/* ================= breakdowns ================= */
const CLASS_COLOR={crypto:'var(--btc)',etf:'var(--c2)',stock:'var(--c1)',cash:'var(--c7)'};
function breakdown(M,by){
  const g=new Map();const add=(k,name,color,v)=>{if(!(v>0))return;const e=g.get(k)||{name,color,v:0};e.v+=v;g.set(k,e);};
  const list=by==='sector'?SECTORS:by==='region'?REGIONS:null;const pcol=k=>`var(${PALETTE[Math.max(0,list?list.indexOf(k):0)%PALETTE.length]})`;
  for(const h of M.holdings){if(!(h.qty>0)||!(h.value>0))continue;const a=h.a;
    if(by==='class')add(a.cls,CLASS_LABEL[a.cls],CLASS_COLOR[a.cls],h.value);
    else if(by==='holding')add(a.id,a.name||a.symbol,colorVar(a),h.value);
    else if(by==='currency')add(a.currency,a.currency,{USD:'var(--c1)',EUR:'var(--c3)',NOK:'var(--c2)'}[a.currency]||'var(--c5)',h.value);
    else if(by==='account'){const tot=Object.values(h.byAcc||{}).reduce((s,x)=>s+x,0)||1;for(const [aid,q] of Object.entries(h.byAcc||{})){const acc=accById(aid);if(acc&&q>0)add(aid,acc.name,accColor(acc),h.value*q/tot);}}
    else{const look=a.look&&a.look[by];
      if(look&&Object.keys(look).length){const sum=Object.values(look).reduce((s,x)=>s+(+x||0),0)||1;for(const [k,w] of Object.entries(look))add(k,k,pcol(k),h.value*(+w||0)/sum);}
      else{const k=by==='sector'?(a.sector||(a.cls==='crypto'?'Crypto':'Other')):(a.region||'Other');add(k,k,by==='sector'&&k==='Crypto'?'var(--btc)':pcol(k),h.value);}}}
  for(const c of M.cashRows){if(!(c.value>0))continue;const acc=c.acc;
    if(by==='class')add('cash','Cash',CLASS_COLOR.cash,c.value);
    else if(by==='holding')add('cash:'+acc.id,'Cash · '+acc.name,accColor(acc),c.value);
    else if(by==='currency')add(acc.currency,acc.currency,{USD:'var(--c1)',EUR:'var(--c3)',NOK:'var(--c2)'}[acc.currency]||'var(--c5)',c.value);
    else if(by==='account')add(acc.id,acc.name,accColor(acc),c.value);
    else if(by==='sector')add('Cash','Cash',pcol('Cash'),c.value);
    else add(acc.currency==='NOK'?'Norway':'Other',acc.currency==='NOK'?'Norway':'Other',pcol(acc.currency==='NOK'?'Norway':'Other'),c.value);}
  const items=[...g.values()].sort((a,b)=>b.v-a.v);const tot=items.reduce((s,x)=>s+x.v,0);return {tot,items};
}
/* tap a % to switch the whole table/card to money (and back). Always starts as %. */
const PMS={};
function pmv(g,p,m){return `<span class="pmv" data-pmg="${g}" data-p="${esc(p)}" data-m="${esc(m)}" role="button" tabindex="0">${PMS[g]?m:p}</span>`;}
document.addEventListener('click',e=>{const el=e.target.closest('.pmv');if(!el)return;e.stopPropagation();const g=el.dataset.pmg;PMS[g]=!PMS[g];
  document.querySelectorAll(`.pmv[data-pmg="${g}"]`).forEach(n=>{n.textContent=PMS[g]?n.dataset.m:n.dataset.p;n.classList.toggle('as-m',!!PMS[g]);});},true);
function breakdownBlock(M,by,name,opts){const {tot,items}=breakdown(M,by);
  if(!tot)return `${seg(name,opts,by)}<div class="muted" style="margin-top:12px">Nothing held right now.</div>`;
  const word={class:'types',account:'accounts',currency:'currencies',sector:'sectors',region:'regions',holding:'holdings'}[by];
  return `<div style="margin-bottom:12px;overflow-x:auto">${seg(name,opts,by)}</div>
  <div class="alloc">${donut(items,tot,items.length+' '+word,cShort(conv(M,tot),UI.ccy))}

function txTitle(t){const a=t.assetId&&assetById(t.assetId);const acc=accById(t.accountId);
  switch(t.type){case 'buy':return 'Buy · '+a.symbol;case 'sell':return 'Sell · '+a.symbol;case 'split':return 'Split · '+a.symbol;case 'dividend':return (t.amount<0?'Withholding tax · ':'Dividend · ')+(a?a.symbol:'');case 'deposit':return 'Deposit · '+acc.name;case 'withdraw':return 'Withdrawal · '+acc.name;case 'interest':return (t.amount<0?'Fee · ':'Interest · ')+acc.name;case 'balance':return 'Balance update · '+acc.name;case 'transfer':return 'Transfer → '+((accById(t.toAccountId)||{}).name||'?');}return t.type;}
function txLine(t){const a=t.assetId&&assetById(t.assetId);const acc=accById(t.accountId);if(!acc||(t.assetId&&!a))return '';
  let sub='',amt='';const accCur=acc.currency;
  if(t.type==='buy'||t.type==='sell'){const fx=a.currency==='NOK'?1:t.fx;const nok=t.qty*t.price*fx+(t.type==='buy'?(t.fee||0):-(t.fee||0));
    sub=`${qtyFmt(t.qty)} × ${money(t.price,a.currency)}${a.currency!=='NOK'?` · ${nf2.format(fx)}`:''} · ${esc(acc.name)}`;amt=`${t.type==='buy'?'−':'+'}${kr(nok,{dec:true})}`;}
  else if(t.type==='split'){sub=esc(acc.name);amt=nf2.format(t.ratio).replace(/,00$/,'')+' for 1';}
  else if(t.type==='dividend'){sub=esc(acc.name);amt=kr(t.amount,{sign:true,dec:true});}
  else if(t.type==='balance'){sub='Set to';amt=money(t.amount,accCur);}
  else if(t.type==='transfer'){sub='From '+esc(acc.name);amt=money(t.amount,accCur);}
  else{const s=t.type==='withdraw'?-1:1;sub=esc(acc.broker||'');amt=money(s*t.amount,accCur,{sign:true});}
  const ic={buy:'buy',sell:'sell',split:'transfer',dividend:'dividend',deposit:'cash',withdraw:'cash',interest:'cash',balance:'cash',transfer:'transfer'}[t.type];
  const bg={buy:'var(--accent)',sell:'var(--c4)',split:'var(--c5)',dividend:'var(--up)',deposit:'var(--c2)',withdraw:'var(--c4)',interest:'var(--c7)',balance:'var(--muted)',transfer:'var(--c5)'}[t.type];
  return `<button class="item" data-tx="${t.id}"><span class="badge" style="background:${bg}"><span style="width:18px;height:18px;display:block">${ICON[ic]}</span></span><div class="mid"><div class="t1">${esc(txTitle(t))}</div><div class="t2">${sub}</div></div><div class="end"><div class="t1">${amt}</div><div class="t2 muted small">${dateLabel(dn(t.date),true)}</div></div></button>`;}
function viewActivity(v,M,head){
  const txs=M.txs.slice().reverse();const groups=new Map();for(const t of txs){const k=t.date.slice(0,7);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t);}
  let bought=0,sold=0,fees=0;for(const t of M.txs){const a=assetById(t.assetId);if(!a||(t.type!=='buy'&&t.type!=='sell'))continue;const fx=a.currency==='NOK'?1:t.fx;if(t.type==='buy')bought+=t.qty*t.price*fx;else sold+=t.qty*t.price*fx;fees+=t.fee||0;}
  v.innerHTML=`${head}<div class="card sumgrid" style="margin-top:14px"><div><div class="k">Bought for</div><div class="v">${kr(bought)}</div></div><div><div class="k">Sold for</div><div class="v">${kr(sold)}</div></div><div><div class="k">Fees paid</div><div class="v">${kr(fees)}</div></div><div><div class="k">Transactions</div><div class="v">${M.txs.length}</div></div></div>

/* returns for a fixed period, or null if the history doesn't reach back that far.
   MAX = since the portfolio's first day. */
function periodRet(M,Z,code,annual){
  if(code==='MAX'||code==='SINCE'){const bi=M.firstDay-1-M.d0;if(bi>=M.N-1)return null;const r=Z.IDX[M.N-1]/(bi>=0?Z.IDX[bi]:1)-1;
    if(!annual)return r;const days=M.N-1-bi;return days>0?Math.pow(1+r,365/days)-1:null;}
  const base=rangeBase(code,M.today);if(base<M.firstDay-1)return null;const bi=base-M.d0;if(bi<0)return null;
  const r=Z.IDX[M.N-1]/Z.IDX[bi]-1;if(!annual)return r;const days=M.N-1-bi;return days>0?Math.pow(1+r,365/days)-1:null;}
/* index return from the index's OWN price history (not limited to when your portfolio started), in the chosen currency.
   MAX / SINCE = since your portfolio's first day, so it compares like for like with your row. */
function fxNokOn(cur,date){if(cur==='NOK')return 1;const h=C.fx&&C.fx[cur];let v=null;if(h&&h.length){for(const [d,x] of h){if(d<=date)v=x;else break;}if(v==null&&h[0][0]<=date)v=h[0][1];}
  if(v==null&&date>=localToday()&&C.fxLive&&C.fxLive[cur])v=C.fxLive[cur];return v;}
function bmPeriodRet(M,Z,id,code,annual){const h=C.bm[id];if(!h||!h.s||!h.s.length)return null;const b=BENCHMARKS.find(x=>x.id===id)||{};const cur=h.cur||b.cur||'USD';const ccy=Z.ccy||'NOK';
  const s=h.s;const [ed,pe]=s[s.length-1];
  const baseDay=(code==='MAX'||code==='SINCE')?M.firstDay-1:rangeBase(code,M.today);const bd=ds(baseDay);
  if(bd<s[0][0])return null; /* index history doesn't reach back that far */
  let pb=null,bdate=null;for(const [d,p] of s){if(d<=bd){pb=p;bdate=d;}else break;}if(pb==null||bdate>=ed)return null;
  const conv=(p,d)=>{const a=fxNokOn(cur,d),c=fxNokOn(ccy,d);return a&&c?p*a/c:null;};
  const vb=conv(pb,bdate),ve=conv(pe,ed);if(!vb||!ve)return null;const r=ve/vb-1;if(!isFinite(r))return null;if(!annual)return r;
  const days=dn(ed)-dn(bdate);return days>0?Math.pow(1+r,365/days)-1:null;}
function retTable(M,Z,periods,annual){const wide=periods.length>5;const g=annual?null:'cum';
  const baseIdx=c=>{if(c==='MAX'||c==='SINCE')return M.firstDay-1-M.d0;const b=rangeBase(c,M.today);if(b<M.firstDay-1)return null;const bi=b-M.d0;return bi<0?null:bi;};
  const myGain=c=>{const bi=baseIdx(c);if(bi==null||bi>=M.N-1)return null;return statsIdx(M,Z,bi,M.N-1).gain;};
  const bmGain=(id,c)=>{const bi=baseIdx(c);if(bi==null||bi>=M.N-1)return null;const r=bmCompare(M,Z,id,bi,M.N-1);if(!r||r.missing)return null;const st=statsIdx(M,Z,bi,M.N-1);return st.gain-(Z.V[M.N-1]+st.div-r.end);};
  const cell=(v,m)=>v==null?'<td class="na">—</td>':`<td class="${cl(v)}">${g?pmv(g,pctDot(v).replace('%',''),m==null?'—':fmtK(m,{sign:true})):pctDot(v).replace('%','')}</td>`;
  const rows=[`<tr><th>${esc(portfolio().name)}</th>${periods.map(([c])=>cell(periodRet(M,Z,c,annual),g?myGain(c):null)).join('')}</tr>`];
  for(const id of UI.bms){const b=BENCHMARKS.find(x=>x.id===id);if(!b)continue;
    if(!bmSeries(M,id,Z.ccy)){const why=!S.settings.tdKey?'Needs your Twelve Data key (Settings)':NET.blocked?'Loads when opened from your home screen':C.err['bm:'+id]?C.err['bm:'+id]:'Loading index prices…';rows.push(`<tr class="bm"><th><span class="sw" style="background:${BM_COLOR[id]}"></span>${esc(b.name)}</th><td colspan="${periods.length}" class="na why">${esc(why)}</td></tr>`);continue;}
    rows.push(`<tr class="bm"><th><span class="sw" style="background:${BM_COLOR[id]}"></span>${esc(b.name)}</th>${periods.map(([c])=>cell(bmPeriodRet(M,Z,id,c,annual),g?bmGain(id,c):null)).join('')}</tr>`);}
  return `<div class="hm-wrap"><table class="rtab${wide?' wide':''}" style="--tw:${96+periods.length*60}px"><thead><tr><th></th>${periods.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;}
/* performance per asset type, same time-weighted method as the whole portfolio */
const CLS_LINE={all:['All assets','var(--accent)'],stock:['Stocks','#C9A0FF','1 0'],etf:['ETFs & funds','#F2F2F2','2 3'],crypto:['Crypto','#4DE1FF','8 3 2 3']};
function classZ(M,ccy,cls){M._cls=M._cls||{};const key=ccy+'|'+cls;if(M._cls[key])return M._cls[key];
  const N=M.N;const hs=M.holdings.filter(h=>(h.a.cls==='fund'?'etf':h.a.cls)===cls);if(!hs.length)return (M._cls[key]=null);
  const f=i=>ccy==='NOK'?1:M.fxAt(ccy,i);const V=new Float64Array(N),CF=new Float64Array(N),DIV=new Float64Array(N),IDX=new Float64Array(N);let prev=0,idx=1,any=false;
  for(let i=0;i<N;i++){const k=f(i);let v=0,c=0,d=0;for(const h of hs){v+=h.AV[i];c+=h.ACF[i];d+=h.ADIV[i];}V[i]=v/k;CF[i]=c/k;DIV[i]=d/k;if(V[i]>0)any=true;
    const den=prev+Math.max(CF[i],0);let r=den>0?(V[i]+DIV[i]-CF[i]-prev)/den:0;if(!isFinite(r))r=0;idx*=1+r;IDX[i]=idx;prev=V[i];}
  return (M._cls[key]=any?{V,CF,DIV,IDX}:null);}

function chartEvents(M,pts,pad){const lo=pts[pad]?pts[pad].x:Infinity,hi=pts[pts.length-1].x;const out=new Map();
  const find=d=>{let a=pad,b=pts.length-1;if(d>hi)return -1;while(a<b){const m=(a+b)>>1;if(pts[m].x<d)a=m+1;else b=m;}return a;};
  for(const t of M.txs||[]){if(!['buy','sell','deposit','withdraw'].includes(t.type))continue;const d=dn(t.date);if(d<lo-1||d>hi)continue;const i=find(d);if(i<0)continue;
    const a=t.assetId&&assetById(t.assetId);const acc=accById(t.accountId);const when=dateLabel(d,true)+(t.time?' · '+t.time:'');let it;
    if(t.type==='buy'||t.type==='sell'){if(!a)continue;const tot=t.qty*t.price*(t.fx||1)+(t.type==='buy'?1:-1)*(t.fee||0);
      it={trade:true,sym:a.symbol,t:(t.type==='buy'?'Bought ':'Sold ')+a.symbol+' · '+qtyFmt(t.qty)+' × '+money(t.price,a.currency),s:when+' · '+F(conv(M,tot))};}

    return {i,items:items.map(x=>Object.assign(x,{color:x.trade?'var(--accent)':'var(--fg)'})),color:tr.length?'var(--accent)':'var(--fg)',head:dateLabel(pts[i].x,true),label:syms.length?syms[0]+(syms.length>1?'+'+(syms.length-1):''):''};});}

function tblOpt(){return Object.assign({style:'compact',sep:'dot',cur:'once'},UI.tbl||{});}
function sepFix(t){return tblOpt().sep==='comma'?t.replace('.',','):t;}
function groupInt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function fmtK(v,o={}){if(v==null||!isFinite(v))return '—';const T=tblOpt();if(PRIV())return '•••';const a=Math.abs(v);let t;
  if(T.style==='full'){const d=o.small||a<10?2:0;const [ip,fp]=a.toFixed(d).split('.');t=groupInt(ip)+(fp?(T.sep==='comma'?',':'.')+fp:'');}
  else{if(a>=999995||(a>=1e3&&+(a/1e3).toFixed(o.small?2:1)>=1000))t=(a/1e6).toFixed(2)+'M';else if(a>=1e3)t=(a/1e3).toFixed(o.small?2:1)+'K';else t=o.small?a.toFixed(2):Math.round(a).toString();t=sepFix(t);}
  if(/^0([.,]0+)?$/.test(t))t='0';else t=(v<0?'−':(o.sign&&v>0?'+':''))+t;
  if(T.cur==='each'&&o.ccy){const [pre,suf]=symOf(o.ccy);t=t.replace(/^([+−]?)/,'$1'+pre)+(suf?' '+suf:'');}
  return t;}
function pctDot(v){if(v==null||!isFinite(v))return '—';const t=sepFix(Math.abs(v*100).toFixed(2));return (v<-0.00005?'−':v>0.00005?'+':'')+t+'%';}

  const pl=h.AV[ei]-Vb-f+div;const base=Vb+fin;return {pl,pct:base>0?pl/base:0};}

function periodGains(M,Z,per){const map=new Map();for(let i=1;i<M.N;i++){if(M.d0+i<M.firstDay)continue;const d=new Date((M.d0+i)*DAY);const k=per==='quarter'?d.getUTCFullYear()*4+Math.floor(d.getUTCMonth()/3):d.getUTCFullYear()*12+d.getUTCMonth();
  const g=Z.V[i]-Z.V[i-1]-Z.CF[i]+Z.DIV[i];map.set(k,(map.get(k)||0)+g);}return map;}
function periodReturns(M,Z,per){const map=new Map();for(let i=0;i<M.N;i++){const d=new Date((M.d0+i)*DAY);if(M.d0+i<M.firstDay)continue;const k=per==='quarter'?d.getUTCFullYear()*4+Math.floor(d.getUTCMonth()/3):d.getUTCFullYear()*12+d.getUTCMonth();map.set(k,(map.get(k)||1)*(1+Z.R[i]));}return map;}
function returnsBars(map,per){const keys=[...map.keys()].sort((a,b)=>a-b);if(!keys.length)return '<div class="muted">No returns yet.</div>';
  const vals=keys.map(k=>map.get(k)-1);const sortedAbs=vals.map(Math.abs).sort((a,b)=>a-b);const mx=Math.max(0.01,sortedAbs[Math.floor(sortedAbs.length*0.92)]||0.01);const bw=per==='quarter'?22:11,gap=per==='quarter'?6:3;const h=180,mid=h/2,pt=8;const w=keys.length*(bw+gap)+gap;
  const lab=k=>per==='quarter'?`Q${k%4+1} ${Math.floor(k/4)}`:`${MON[k%12]} ${Math.floor(k/12)}`;
  let svg=`<svg width="${w}" height="${h+22}" viewBox="0 0 ${w} ${h+22}" role="img" aria-label="Returns per ${per}"><line x1="0" x2="${w}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>`;
  keys.forEach((k,j)=>{const v=vals[j];const bh=Math.max(1,Math.min(1,Math.abs(v)/mx)*(mid-pt));const x=gap+j*(bw+gap);const y=v>=0?mid-bh:mid;

function valueOfSource(M,src){

    for(const h of M.holdings){if(h.qty>0&&h.byAcc&&h.byAcc[id])v+=h.value*h.byAcc[id]/h.qty;}return v;}

function neededMonthly(cur,target,months,annual){if(months<=0)return target-cur;const r=Math.pow(1+annual,1/12)-1;const g=Math.pow(1+r,months);const rest=target-cur*g;if(rest<=0)return 0;return r>0?rest*r/(g-1):rest/months;}

function ageNow(){const d=new Date();return d.getFullYear()-S.plan.birthYear+d.getMonth()/12;}
function taxMix(M){if(!M)return {rate:TAX.shares,crypto:0,sec:0};let cr=0,sec=0;for(const h of M.holdings){if(!(h.qty>0))continue;if(h.a.cls==='crypto')cr+=h.value;else sec+=h.value;}const inv=cr+sec;return {rate:inv?(cr*TAX.capital+sec*TAX.shares)/inv:TAX.shares,crypto:cr,sec};}
function project(M,o={}){
  const p=S.plan;const a0=ageNow();const r=p.realReturn;const startV=M?M.total:0;const startB=M?Math.max(0,Math.min(M.NET[M.N-1],startV)):0;
  const events=o.noEvents?[]:p.events.filter(e=>e.on!==false);
  const goalEvents=o.noEvents?[]:S.goals.filter(g=>g.spend&&g.date).map(g=>({type:'out',age:S.plan.birthYear?yearOf(dn(g.date))-p.birthYear+new Date(g.date).getMonth()/12:0,amount:+g.target,name:g.name}));
  const lumps=[...events.filter(e=>e.type==='in'||e.type==='out'),...goalEvents];
  const ages=[],vals=[];let V=startV,B=startB,W=null,Vret=null,gs=0;const extra=(o.extra||0)*12;
  const lifeAge=Math.max(p.retireAge+1,p.lifeAge);
  for(let a=Math.floor(a0*2)/2;a<=lifeAge+1e-9;a+=0.5){ // half-year steps
    ages.push(a);vals.push(V);if(a>=lifeAge)break;
    const step=0.5;let save=0;
    if(a<p.retireAge){let monthly=p.monthlySaving;for(const e of events)if(e.type==='saving'&&a+1e-9>=e.age&&a<e.untilAge-1e-9)monthly=+e.amount;save=(monthly*12+extra)*step;}
    let lump=0;for(const e of lumps)if(e.age>=a&&e.age<a+step)lump+=e.type==='out'?-e.amount:+e.amount;
    const g=Math.pow(1+r,step);
    if(a<p.retireAge){V=V*g+save+lump;B=B+save+(lump>0?lump:0);if(lump<0&&V>0)B=B*Math.max(0,V/(V-lump));}
    else{if(W==null){Vret=V;const n=lifeAge-p.retireAge;W=r>0?V*r/(1-Math.pow(1+r,-n)):V/n;gs=V>0?Math.max(0,1-B/V):0;}V=V*g-W*step+lump;}
    if(a+step>=p.retireAge&&W==null&&a+step<=p.retireAge+1e-9){} // computed next loop
  }
  if(W==null){Vret=V;const n=lifeAge-p.retireAge;W=r>0?V*r/(1-Math.pow(1+r,-n)):V/n;gs=V>0?Math.max(0,1-B/V):0;}
  const tm=taxMix(M);const invNet=Math.max(0,W)*(1-gs*tm.rate);const penNet=(p.navYearly+p.otherYearly)*(1-p.pensionTax);
  const income=(invNet+penNet)/12;return {ages,vals,Vret,W,invNet,penNet,income,gap:p.desiredMonthly-income,gs,taxRate:tm.rate,a0};
}

function fxForDate(cur,date){if(cur==='NOK')return 1;const h=C.fx&&C.fx[cur];if(h&&h.length){let v=null;for(const [d,x] of h){if(d<=date)v=x;else break;}if(v)return date>=localToday()&&C.fxLive&&C.fxLive[cur]?C.fxLive[cur]:v;}return S.fx[cur]||1;}
function priceForDate(a,date){const mk=market();const i=dn(date)-mk.d0;const arr=mk.priceCur[a.id];if(!arr||i<0||i>=mk.N)return null;const v=arr[i];return isFinite(v)?v:null;}
function defaultAccFor(cls){const kind=cls==='crypto'?'crypto':cls==='etf'?'ask':'aksje';const P=portfolio();return (S.accounts.find(a=>a.kind===kind&&P.accountIds.includes(a.id))||S.accounts.find(a=>a.kind!=='cash')||S.accounts[0]||{}).id;}

function mapSector(x){if(!x)return null;const t=String(x).toLowerCase();const M_={'technology':'Technology','information technology':'Technology','communication services':'Communication Services','consumer cyclical':'Consumer Discretionary','consumer discretionary':'Consumer Discretionary','consumer defensive':'Consumer Staples','consumer staples':'Consumer Staples','healthcare':'Health Care','health care':'Health Care','financial services':'Financials','financials':'Financials','industrials':'Industrials','energy':'Energy','basic materials':'Materials','materials':'Materials','utilities':'Utilities','real estate':'Real Estate'};return M_[t]||null;}

/* look up a ticker or company name with Twelve Data and fill in the new-holding fields */
async function lookupTicker(q,onDone){
  if(!S.settings.tdKey||NET.blocked||!q)return null;
  try{const j=await td('symbol_search',{symbol:q,outputsize:'12'});const list=(j&&j.data)||[];if(!list.length)return {none:true};
    const Q=q.toUpperCase();const score=x=>(x.symbol.toUpperCase()===Q?100:0)+(x.country==='United States'?20:0)+(['NASDAQ','NYSE'].includes(x.exchange)?10:0)+(/norway/i.test(x.country)?8:0)+(ASSET_CCYS.includes(x.currency)?5:0);
    return list.slice().sort((a,b)=>score(b)-score(a))[0];}catch(e){return {error:String(e.message||e)};}
}
function pruneAssets(){S.assets=S.assets.filter(a=>S.txs.some(t=>t.assetId===a.id));S.prices=S.prices.filter(p=>assetById(p.assetId));}

function lookToText(o){return o?Object.entries(o).map(([k,v])=>`${k}: ${String(v).replace('.',',')}`).join('\n'):'';}
function textToLook(s){const o={};for(const line of String(s).split('\n')){const m=line.match(/^\s*(.+?)\s*[:=]\s*([\d.,]+)\s*%?\s*$/);if(m){const v=parseNum(m[2]);if(v>0)o[m[1]]=v;}}return Object.keys(o).length?o:null;}
function assetSheet(id){

function decodeBuffer(buf){const b=new Uint8Array(buf);
  if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder('utf-16le').decode(b.subarray(2));
  if(b[0]===0xFE&&b[1]===0xFF)return new TextDecoder('utf-16be').decode(b.subarray(2));
  let zeros=0;for(let i=1;i<Math.min(b.length,400);i+=2)if(b[i]===0)zeros++;if(zeros>50)return new TextDecoder('utf-16le').decode(b);
  let t=new TextDecoder('utf-8').decode(b);if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);if(t.includes(String.fromCharCode(0xFFFD)))t=new TextDecoder('windows-1252').decode(b);return t;}
function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||'';const cnt=c=>first.split(c).length;const delim=[['\t',cnt('\t')],[';',cnt(';')],[',',cnt(',')]].sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];f='';}else f+=c;}
  row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);return rows;}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ø/g,'o').replace(/æ/g,'ae').replace(/å/g,'a').replace(/[^a-z0-9]/g,'');
function findCol(headers,names){const H=headers.map(norm);for(const n of names){const i=H.indexOf(norm(n));if(i>=0)return i;}for(const n of names){const i=H.findIndex(h=>h.startsWith(norm(n)));if(i>=0)return i;}return -1;}
function toISODate(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;m=s.match(/^(\d{4})\/(\d{2})\/(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;return null;}
function classifyType(s){const t=norm(s);

  if(/kupongskatt|kallskatt|withholding|utbytteskatt|tax/.test(t))return 'tax';if(/utbytte|utdelning|utdeling|dividend/.test(t))return 'dividend';

const KRAKEN_ASSET={XBT:'BTC',XXBT:'BTC',XETH:'ETH',XXDG:'DOGE',XDG:'DOGE',ZEUR:'EUR',ZUSD:'USD',ZGBP:'GBP',ZCHF:'CHF',XXRP:'XRP',XLTC:'LTC',XXLM:'XLM'};

/* turn rows into normalized records */
function buildRecords(fmt,rows,map){
  const headers=rows[0];const data=rows.slice(1);const out=[];const skipped={};
  const col=(names)=>findCol(headers,names);
  if(fmt==='nordnet'){
    const c={id:col(['Id']),date:col(['Handelsdag','Affärsdag','Bokføringsdag','Bokföringsdag']),type:col(['Transaksjonstype','Transaktionstyp']),sym:col(['Verdipapir','Värdepapper']),isin:col(['ISIN']),
      qty:col(['Antall','Antal']),price:col(['Kurs']),amt:col(['Beløp','Belopp']),fx:col(['Vekslingskurs','Växlingskurs']),pf:col(['Portefølje','Depå','Depot']),text:col(['Transaksjonstekst','Transaktionstext'])};
    const amtCur=c.amt>=0&&norm(headers[c.amt+1])==='valuta'?c.amt+1:-1;
    for(const r of data){const typ=classifyType(r[c.type]);const date=toISODate(r[c.date]);if(!date){continue;}
      if(!typ){const k=String(r[c.type]||'?').trim();skipped[k]=(skipped[k]||0)+1;continue;}
      const amount=parseNum(r[c.amt]);const qty=Math.abs(parseNum(r[c.qty]));const price=parseNum(r[c.price]);let fx=c.fx>=0?parseNum(r[c.fx]):NaN;
      out.push({extId:'nn:'+(r[c.id]||[date,r[c.type],r[c.sym],r[c.qty],r[c.amt]].join('|')),type:typ,date,symbol:(r[c.sym]||'').trim(),isin:(c.isin>=0?r[c.isin]:'').trim(),qty,price,
        amountNok:amount,amountCur:amtCur>=0?(r[amtCur]||'').trim().toUpperCase():'NOK',fx,group:c.pf>=0?String(r[c.pf]||'').trim():'',raw:r[c.type]});}
  }
  else if(fmt==='kraken'){
    const c={id:col(['txid']),pair:col(['pair']),time:col(['time']),type:col(['type']),price:col(['price']),cost:col(['cost']),fee:col(['fee']),vol:col(['vol'])};
    for(const r of data){const [base,quote]=splitPair(r[c.pair]);const date=toISODate(r[c.time]);const typ=classifyType(r[c.type]);if(!date||!typ){skipped[r[c.type]||'?']=(skipped[r[c.type]||'?']||0)+1;continue;}
      out.push({extId:'kr:'+r[c.id],type:typ,date,time:(String(r[c.time]||'').match(/[ T](\d{2}:\d{2})/)||[])[1]||'',symbol:base,qty:Math.abs(parseNum(r[c.vol])),price:parseNum(r[c.price]),feeCur:parseNum(r[c.fee])||0,quote,crypto:true,group:''});}
  }

    for(const r of data){const g=k=>map[k]>=0?r[map[k]]:'';const date=toISODate(g('date'));if(!date)continue;
      let typ=map.type>=0?classifyType(g('type')):'buy';if(!typ){skipped[g('type')||'?']=(skipped[g('type')||'?']||0)+1;continue;}
      const qtyRaw=parseNum(g('qty'));if(map.type<0&&qtyRaw<0)typ='sell';
      out.push({extId:'gen:'+[date,typ,g('symbol'),g('qty'),g('price')].join('|'),type:typ,date,symbol:String(g('symbol')).trim(),qty:Math.abs(qtyRaw),price:parseNum(g('price')),
        currency:String(g('currency')||'').trim().toUpperCase(),fx:parseNum(g('fx')),feeNok:parseNum(g('fee'))||0,amountNok:parseNum(g('total')),group:''});}
  }

}
function guessCurrency(rec,existing){

  const isin=(rec.isin||'').toUpperCase();if(/^(US|CA)/.test(isin))return 'USD';if(/^NO/.test(isin))return 'NOK';
  if(rec.qty>0&&rec.price>0&&Math.abs(rec.amountNok)>0){const f=Math.abs(rec.amountNok)/(rec.qty*rec.price);if(f>0.97&&f<1.03)return 'NOK';}

function doImport(){

  const matched=IMP.matched||[];
  leaveDemo();
  const symList=[...IMP.syms.values()];const assetFor={};
  symList.forEach((s,i)=>{let a=S.assets.find(x=>(s.rec.isin&&x.isin===s.rec.isin)||x.symbol.toUpperCase()===s.rec.symbol.toUpperCase());
    if(!a){const cur=fv('sym_cur_'+i).value,cls=fv('sym_cls_'+i).value;const pre=PRESETS.find(p=>p.symbol===s.rec.symbol.toUpperCase());
      a={id:uid(),symbol:s.rec.symbol.toUpperCase().slice(0,16),name:pre?pre.name:s.rec.symbol,cls,currency:cur,dataSymbol:pre?pre.dataSymbol:s.rec.symbol.toUpperCase(),isin:s.rec.isin||'',
        sector:pre?pre.sector:cls==='crypto'?'Crypto':'Other',region:pre?pre.region:cls==='crypto'?'Global (no country)':/^(US|CA)/.test(s.rec.isin||'')||cur==='USD'?'North America':'Europe (ex-Norway)',look:pre&&pre.look?JSON.parse(JSON.stringify(pre.look)):(cls==='etf'?null:null)};
      S.assets.push(a);}
    assetFor[s.key]=a;});
  let n=0,warn=0;const touched=new Set();
  for(const r of fresh){const accountId=accFor[r.group]||S.accounts[0].id;const acc=accById(accountId);
    if(['deposit','withdraw','interest','fee'].includes(r.type)){if(!withCash)continue;const amt=Math.abs(r.amountNok||0);if(!amt)continue;touched.add(accountId);
      S.txs.push({id:uid(),extId:r.extId,type:r.type==='fee'?'interest':r.type,accountId,date:r.date,amount:r.type==='fee'||((r.type==='interest')&&r.amountNok<0)?-amt:amt});n++;continue;}
    const a=assetFor[(r.isin||r.symbol).toUpperCase()];if(!a)continue;
    if(r.type==='dividend'||r.type==='tax'){let amt=r.amountNok;if(!isFinite(amt))continue;if(r.type==='tax')amt=-Math.abs(amt);S.txs.push({id:uid(),extId:r.extId,type:'dividend',assetId:a.id,accountId,date:r.date,amount:amt});n++;continue;}
    if(!(r.qty>0&&r.price>0)){warn++;continue;}
    let fx,fee=0;const gross=r.qty*r.price;
    if(a.currency==='NOK')fx=1;
    else if(r.crypto){fx=fxForDate(a.currency,r.date);}
    else if(isFinite(r.fx)&&r.fx>0&&(r.fx>0.5||a.currency==='SEK'))fx=r.fx;
    else if(isFinite(r.amountNok)&&Math.abs(r.amountNok)>0)fx=Math.abs(r.amountNok)/gross;
    else fx=fxForDate(a.currency,r.date);
    if(r.crypto)fee=(r.feeCur||0)*fx;
    else if(isFinite(r.feeNok)&&r.feeNok)fee=r.feeNok;
    else if(isFinite(r.amountNok)&&Math.abs(r.amountNok)>0){const tot=Math.abs(r.amountNok);fee=Math.max(0,r.type==='buy'?tot-gross*fx:gross*fx-tot);if(fee>gross*fx*0.05){fee=0;fx=tot/gross;}}
    S.txs.push({id:uid(),extId:r.extId,type:r.type,assetId:a.id,accountId,date:r.date,...(r.time?{time:r.time}:{}),qty:r.qty,price:r.price,fx:+fx.toFixed(6),fee:+fee.toFixed(2)});n++;}
  if(withCash)for(const id of touched){const a=accById(id);if(a)a.tracksCash=true;}
  S.importMap=S.importMap||{};IMP.groups.forEach(g=>{S.importMap[IMP.fmt+':'+g]=accFor[g];});
  for(const [id,ext] of matched){const t=S.txs.find(x=>x.id===id);if(t)t.extId=ext;}
  pruneAssets();Store.save();closeSheet();render();toast(`Imported ${n} transactions${matched.length?` · ${matched.length} matched`:''}${warn?` · ${warn} skipped`:''}`);refresh(false);
}

  if(r.type==='maxPct')return `Max ${nf1.format(r.pct)} % of income`;
  if(r.type==='minPct')return `At least ${nf1.format(r.pct)} % of income`;return '';}
function ruleBroken(c,v,income){const r=c.rule;if(!r||!income)return false;const p=v/income*100;return (r.type==='maxPct'&&p>r.pct+1e-9)||(r.type==='minPct'&&p<r.pct-1e-9);}
function actualsFor(ym){const out={};let unc=0,uncN=0,inc=0;for(const t of B().tx){if(!t.date.startsWith(ym))continue;if(t.cat==='__ignore')continue;
    if(t.amount>0){if(t.cat==='__income')inc+=t.amount;continue;}
    if(!t.cat){unc+=-t.amount;uncN++;continue;}out[t.cat]=(out[t.cat]||0)-t.amount;}return {by:out,unc,uncN,inc};}

    ${x.items.map(({c,v:val})=>{const a=act.by[c.id];const broke=ruleBroken(c,val,r.income);return `<button class="item" data-bcat="${c.id}"><div class="mid"><div class="t1">${esc(c.name)}${c.overrides&&c.overrides[m]!=null&&c.overrides[m]!==''?' <span class="pill flat">this month</span>':''}</div><div class="t2 wrap ${broke?'down':''}">${esc(ruleText(c,val,r.income))||(broke?'Rule broken':'')}${broke&&ruleText(c,val,r.income)?' · broken':''}</div>${hasTx&&x.g.id!=='savings'?`<div class="prog thin"><span style="width:${Math.min(100,(a||0)/(val||1)*100)}%;${(a||0)>val?'background:var(--down)':''}"></span></div>`:''}</div>

function yearTable(ym){const y=ym.slice(0,4);let rows='';let ti=0,ts=0,tl=0;
  for(let m=1;m<=12;m++){const r=budgetMonth(m);ti+=r.income;ts+=r.spent;tl+=r.totalSave;const cur=+ym.slice(5,7)===m;
    rows+=`<tr class="${cur?'cur':''}" data-bjump="${y}-${pad(m)}"><th>${MON[m-1]}</th><td>${fmtK(r.income,{})}</td><td>${fmtK(r.spent,{})}</td><td class="${r.left<0?'down':''}">${fmtK(r.totalSave+(r.left<0?r.left:0),{})}</td></tr>`;}
  return `${''}<div class="hm-wrap"><table class="ytab"><thead><tr><th></th><th>Pay</th><th>Spending</th><th>Saved</th></tr></thead><tbody>${rows}<tr class="tot"><th>${y}</th><td>${fmtK(ti,{})}</td><td>${fmtK(ts,{})}</td><td>${fmtK(tl,{})}</td></tr></tbody></table></div><div class="small muted expl" style="margin:6px 2px">Tap a month to open it. Set June (holiday pay) and December (half tax) under Edit pay.</div>`;}

   <label class="switch"><input type="checkbox" id="bcOn" ${c.on!==false?'checked':''}><span>Include in the plan (turn off to test "what if")</span></label>

    ['bcRule','bcAmt','bcTrips'].forEach(i=>fv(i).addEventListener('input',sync));fv('bcRule').onchange=sync;sync();
    fv('bcForm').onsubmit=e=>{e.preventDefault();const name=fv('bcName').value.trim(),a=parseNum(fv('bcAmt').value);
      if(!name)return showErr(fv('bcErr'),'Give the line a name.');if(!(a>=0))return showErr(fv('bcErr'),'Enter the amount per month.');

      else if(t){const p=parseNum(fv('bcPct').value);if(!(p>0&&p<=100))return showErr(fv('bcErr'),'Enter a percent between 0 and 100.');rule={type:t,pct:p};}

/* ---------- bank import ---------- */
function bankCols(h){return {date:findCol(h,['bokføringsdato','bokforingsdato','dato','transaksjonsdato','date','bookingdate','utført dato']),
  text:findCol(h,['forklaring','tekst','beskrivelse','tittel','text','description','merchant','navn','mottaker']),
  amount:findCol(h,['beløp','belop','amount','beløp i nok','belopnok']),out:findCol(h,['ut fra konto','utfrakonto','ut','uttak','debit','beløp ut']),in:findCol(h,['inn på konto','innpakonto','inn','innskudd','credit','beløp inn'])};}
function merchantKey(t){return String(t||'').toLowerCase().replace(/\d{2}\.\d{2}(\.\d{2,4})?/g,' ').replace(/[*#]/g,' ').replace(/\b(varekjøp|varekjop|visa|vipps|kortkjøp|nettgiro|avtalegiro|overføring|betaling|kurs:?|nok)\b/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' ');}
function autoCat(text){const t=' '+String(text||'').toLowerCase()+' ';for(const r of B().match){if(r.kw&&t.includes(r.kw.toLowerCase()))return r.cat;}return null;}
function bankImportSheet(){
  openSheet('Import from your bank',`<div class="form"><div class="note">In your online bank, open the account your salary goes to, choose a period and export or download the transactions as <b>CSV</b> (sometimes called "Excel/CSV"). DNB, Sbanken, Nordea, SpareBank 1, Bulder and most others can do this.</div>
   <div class="field"><label for="bkFile">CSV file</label><input type="file" id="bkFile" accept=".csv,.txt,text/csv,text/plain"></div><div id="bkStep"></div></div>`,()=>{
    fv('bkFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;let text;try{text=decodeBuffer(await f.arrayBuffer());}catch(x){fv('bkStep').innerHTML='<div class="err">Couldn\'t read that file.</div>';return;}
      const rows=parseCSV(text);if(rows.length<2){fv('bkStep').innerHTML='<div class="err">No rows found in that file.</div>';return;}
      const cols=bankCols(rows[0]);if(cols.date>=0&&cols.text>=0&&(cols.amount>=0||cols.out>=0||cols.in>=0))return bankPreview(rows,cols);bankMapping(rows,cols);};});
}
function bankMapping(rows,g){const h=rows[0];const opt=s=>`<option value="-1">—</option>`+h.map((x,i)=>`<option value="${i}" ${i===s?'selected':''}>${esc(x||'Column '+(i+1))}</option>`).join('');
  fv('bkStep').innerHTML=`<div class="note">Match the columns in your file.</div><div class="grid2">${[['date','Date *'],['text','Description *'],['amount','Amount (− for money out)'],['out','Money out'],['in','Money in']].map(([k,l])=>`<div class="field"><label for="bm_${k}">${l}</label><select id="bm_${k}">${opt(g[k])}</select></div>`).join('')}</div><button class="btn primary sm" id="bmGo">Continue</button><div class="err" id="bmErr"></div>`;
  fv('bmGo').onclick=()=>{const c={};for(const k of ['date','text','amount','out','in'])c[k]=+fv('bm_'+k).value;if(c.date<0||c.text<0||(c.amount<0&&c.out<0&&c.in<0))return showErr(fv('bmErr'),'Pick date, description and an amount column.');bankPreview(rows,c);};}
function bankPreview(rows,c){const b=B();const have=new Set(b.tx.map(t=>t.key));const fresh=[];let skipped=0;
  for(const r of rows.slice(1)){const date=toISODate(r[c.date]);if(!date){skipped++;continue;}const text=String(r[c.text]||'').trim();
    let a=c.amount>=0?parseNum(r[c.amount]):NaN;if(!isFinite(a)){const o=c.out>=0?parseNum(r[c.out]):NaN,i=c.in>=0?parseNum(r[c.in]):NaN;a=(isFinite(i)?Math.abs(i):0)-(isFinite(o)?Math.abs(o):0);}
    if(!isFinite(a)||a===0){skipped++;continue;}const key=date+'|'+text+'|'+a.toFixed(2);if(have.has(key)){skipped++;continue;}have.add(key);
    fresh.push({id:uid(),date,text,amount:a,cat:a<0?autoCat(text):null,key});}
  const out=fresh.filter(t=>t.amount<0);const sorted=out.filter(t=>t.cat).length;const months=[...new Set(fresh.map(t=>t.date.slice(0,7)))].sort();
  fv('bkStep').innerHTML=`<div class="card stack" style="background:var(--surface2)"><div><b>${fresh.length}</b> new payments${months.length?` · ${ymLabel(months[0])}${months.length>1?' – '+ymLabel(months[months.length-1]):''}`:''}${skipped?` · ${skipped} skipped or already imported`:''}</div>
   <div class="small">${out.length} money out · ${sorted} sorted automatically · ${out.length-sorted} to sort by you</div></div>
   <button class="btn primary block" id="bkGo" style="margin-top:12px">Import ${fresh.length} payments</button>`;
  fv('bkGo').onclick=()=>{b.tx.push(...fresh);b.tx.sort((x,y)=>x.date<y.date?1:-1);if(months.length)UI.bym=months[months.length-1];saveUI();bSave();closeSheet();softRender();toast(`Imported ${fresh.length} payments`);};}
function catOptions(sel){const b=B();return b.groups.map(g=>`<optgroup label="${esc(g.name)}">${b.cats.filter(c=>c.group===g.id).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('')+`<option value="__ignore" ${sel==='__ignore'?'selected':''}>Ignore (transfer between own accounts)</option><option value="__income" ${sel==='__income'?'selected':''}>Income</option>`;}
function txCatSheet(id,queue){const b=B();const t=b.tx.find(x=>x.id===id);if(!t)return;const key=merchantKey(t.text);
  openSheet('Sort payment',`<form class="form" id="txcForm"><div class="card"><div class="row-between"><div><div style="font-weight:600">${esc(t.text)}</div><div class="small muted">${dateLabel(dn(t.date),true)}</div></div><div class="num ${t.amount<0?'':'up'}">${bkr(t.amount,{dec:true,sign:true})}</div></div></div>
   <div class="field"><label for="txcCat">Category</label><select id="txcCat"><option value="">Choose…</option>${catOptions(t.cat)}</select></div>
   ${key?`<label class="switch"><input type="checkbox" id="txcAlways" checked><span>Always sort payments with "<b>${esc(key)}</b>" like this</span></label>`:''}
   <button class="btn primary block" type="submit">Save${queue&&queue.length?' and next':''}</button>${queue&&queue.length?`<div class="small muted" style="text-align:center">${queue.length} more to sort</div>`:''}</form>`,()=>{
    fv('txcForm').onsubmit=e=>{e.preventDefault();const cat=fv('txcCat').value||null;t.cat=cat;
      if(cat&&key&&fv('txcAlways')&&fv('txcAlways').checked){b.match=b.match.filter(r=>r.kw!==key);b.match.unshift({id:uid(),kw:key,cat});for(const x of b.tx)if(!x.cat&&x.amount<0&&(' '+x.text.toLowerCase()+' ').includes(key))x.cat=cat;}
      bSave();const next=(queue||[]).filter(qid=>{const x=b.tx.find(y=>y.id===qid);return x&&!x.cat;});if(next.length)txCatSheet(next[0],next.slice(1));else{closeSheet();softRender();toast('Sorted');}};});}

function applyLook(){const L=look();const root=document.documentElement;const st=root.style;
  root.dataset.look=L.mode==='day'?'day':'night';root.dataset.expl=UI.expl==='off'?'off':'on';root.dataset.tables=L.tables==='scroll'?'scroll':'fit';

/* ================= navigation history + edge swipes ================= */
/* Every page/view you visit is remembered (like Safari's back/forward).
   Swipe in from the LEFT edge  = back  (an open window closes first).
   Swipe in from the RIGHT edge = forward. */
const NAV={stack:[],i:-1,moving:false};
const SUBKEY={holdings:'sub',analysis:'asub',plan:'psub',settings:'sset'};
function navState(){const t=UI.tab||'overview';const k=SUBKEY[t];return k?{tab:t,k,v:UI[k]}:{tab:t};}
const navId=s=>s.tab+'|'+(s.v||'');
function recordNav(){if(NAV.moving)return;const s=navState();const cur=NAV.stack[NAV.i];if(cur&&navId(cur)===navId(s))return;
  NAV.stack=NAV.stack.slice(0,NAV.i+1);NAV.stack.push(s);if(NAV.stack.length>60)NAV.stack.shift();NAV.i=NAV.stack.length-1;}
function sheetOpen(){const s=$('#sheet');return s&&!s.hidden;}
function goNav(dir){
  if(dir<0&&sheetOpen()){closeSheet();return true;}
  if(sheetOpen())return false;
  const j=NAV.i+dir;if(j<0||j>=NAV.stack.length)return false;
  const s=NAV.stack[j];NAV.i=j;NAV.moving=true;UI.tab=s.tab;if(s.k)UI[s.k]=s.v;saveUI();
  const v=$('#view');render();window.scrollTo(0,0);NAV.moving=false;
  if(v&&v.animate)v.animate([{opacity:.3,transform:`translateX(${dir<0?-28:28}px)`},{opacity:1,transform:'none'}],{duration:200,easing:'ease-out'});
  return true;}
/* hook into render so every page/view change is recorded */
{const _render=render;render=function(){_render();recordNav();};}

/* edge swipe gesture */
(function(){
  const EDGE=22,GO=70;let st=null;
  const ind=document.createElement('div');ind.className='edge-ind';ind.setAttribute('aria-hidden','true');document.body.appendChild(ind);
  const show=(side,dx,can)=>{const p=Math.min(1,dx/GO);ind.className='edge-ind on '+side+(p>=1?' ready':'')+(can?'':' none');
    ind.innerHTML=side==='l'?'&#8249;':'&#8250;';ind.style.transform=`translateY(-50%) translateX(${side==='l'?(-46+p*62):(46-p*62)}px)`;ind.style.opacity=String(0.25+p*0.75);};
  const hide=()=>{ind.className='edge-ind';ind.style.opacity='0';};
  const canGo=side=>side==='l'?(sheetOpen()||NAV.i>0):(!sheetOpen()&&NAV.i<NAV.stack.length-1);
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){st=null;return;}const t=e.touches[0];const w=window.innerWidth;
    const side=t.clientX<=EDGE?'l':t.clientX>=w-EDGE?'r':null;st=side?{side,x:t.clientX,y:t.clientY,lock:null}:null;},{passive:true});
  document.addEventListener('touchmove',e=>{if(!st)return;const t=e.touches[0];const dx=st.side==='l'?t.clientX-st.x:st.x-t.clientX;const dy=Math.abs(t.clientY-st.y);
    if(st.lock==null){if(Math.abs(dx)<8&&dy<8)return;st.lock=dx>dy?'h':'v';}
    if(st.lock!=='h'){st=null;hide();return;}
    e.preventDefault();st.dx=dx;show(st.side,Math.max(0,dx),canGo(st.side));},{passive:false});
  const end=()=>{if(!st)return;const ok=st.lock==='h'&&st.dx>=GO;const side=st.side;st=null;hide();if(ok)goNav(side==='l'?-1:1);};
  document.addEventListener('touchend',end);document.addEventListener('touchcancel',()=>{st=null;hide();});
  /* keyboard / mouse back-forward buttons on iPad keyboards and computers */
  document.addEventListener('keydown',e=>{if(e.altKey&&!e.target.closest('input,textarea,select')){if(e.key==='ArrowLeft'){if(goNav(-1))e.preventDefault();}else if(e.key==='ArrowRight'){if(goNav(1))e.preventDefault();}}});
})();

/* ================= arrows instead of + and − ================= */
/* Any number shown with a + or − sign loses the sign. Where the value already
   carries a coloured ▲/▼ (class up/down) the sign is simply dropped; elsewhere
   the sign becomes a small ▲ or ▼ so the direction is never lost.
   Typed values in form fields are never touched. */
const SIGN_RE=/(^|[\s(\[·\/:=•])([+−]|^-)(?=[$£€]?\s?\d)/g;
const SKIP_TAGS=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT','NOSCRIPT']);
function hasArrow(el){const a=el&&el.closest&&el.closest('.up,.down');if(!a)return false;return !a.closest('.prog')&&!a.classList.contains('lk');}
function arrowText(node){const txt=node.nodeValue;if(!txt||!/[+−-]/.test(txt))return;
  SIGN_RE.lastIndex=0;if(!SIGN_RE.test(txt))return;SIGN_RE.lastIndex=0;
  const par=node.parentNode;if(!par||SKIP_TAGS.has(par.nodeName)||(par.closest&&par.closest('[data-keepsign],[contenteditable]')))return;
  const strip=hasArrow(par);
  const plain=strip||par.nodeName==='OPTION'||par.namespaceURI==='http://www.w3.org/2000/svg';
  if(plain){node.nodeValue=txt.replace(SIGN_RE,(m,pre,s)=>pre+(strip?'':(s==='+'?'▲':'▼')));return;}
  const frag=document.createDocumentFragment();let last=0;txt.replace(SIGN_RE,(m,pre,s,off)=>{
    frag.appendChild(document.createTextNode(txt.slice(last,off)+pre));
    const sp=document.createElement('span');sp.className='arw';sp.textContent=s==='+'?'▲':'▼';frag.appendChild(sp);
    last=off+m.length;return m;});
  frag.appendChild(document.createTextNode(txt.slice(last)));par.replaceChild(frag,node);}
function arrowize(root){if(!root)return;if(root.nodeType===3){arrowText(root);return;}if(root.nodeType!==1||SKIP_TAGS.has(root.nodeName))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const list=[];let n;while((n=w.nextNode()))list.push(n);list.forEach(arrowText);}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')arrowText(m.target);else m.addedNodes.forEach(arrowize);}})

function borrowCards(pg,ids){const box=document.createElement('div');box.className='offstage';box.setAttribute('aria-hidden','true');document.body.appendChild(box);
  const fn={overview:viewOverview,holdings:viewHoldings,analysis:viewAnalysis}[pg];const s=PAGE_SUB[pg];const keep=s?UI[s[0]]:null;
  const out={};try{if(s)UI[s[0]]=s[1];fn(box);for(const id of ids){const n=box.querySelector(`[data-card="${id}"]`);if(n)out[id]=n;}}catch(e){console.error(e);}finally{if(s)UI[s[0]]=keep;}
  setTimeout(()=>box.remove(),0);return out;}
function applyLayout(v){const pg=UI.tab;const list=layoutOf(pg);
  const own={};v.querySelectorAll('[data-card]').forEach(n=>{own[n.dataset.card]=n;});
  const firstOwn=v.querySelector('[data-card]');
  const bar=document.createElement('div');bar.className='page-bar';bar.innerHTML=`<span class="page-name">${PAGE_NAMES[pg]}</span><button class="gear-btn" data-arrange="${pg}" aria-label="Arrange this page">${iconSm('gear',18)}</button>`;
  if(!firstOwn){v.insertBefore(bar,v.firstChild);return;}
  const foreign={};const need={};for(const c of list){const p=CARD_LIB[c.id].p;if(p!==pg&&!c.hidden)(need[p]=need[p]||[]).push(c.id);}
  for(const p in need)Object.assign(foreign,borrowCards(p,need[p]));
  const mark=document.createComment('cards');firstOwn.parentNode.insertBefore(mark,firstOwn);
  Object.values(own).forEach(n=>n.remove());
  const frag=document.createDocumentFragment();
  for(const c of list){if(c.hidden)continue;const n=own[c.id]||foreign[c.id];if(n){if(foreign[c.id])n.classList.add('borrowed');frag.appendChild(n);}}

/* ---------- 2) data check ---------- */
function lastPriceDate(a){let best=null;const h=C.hist[histKey(a)];if(h&&h.s&&h.s.length)best=h.s[h.s.length-1][0];
  for(const p of S.prices)if(p.assetId===a.id&&(!best||p.date>best))best=p.date;const lv=C.live[a.id];if(lv&&lv.date&&(!best||lv.date>best))best=lv.date;
  for(const t of S.txs)if(t.assetId===a.id&&(t.type==='buy'||t.type==='sell')&&(!best||t.date>best))best=t.date;return best;}
function workdaysSince(d){let n=0;for(let x=dn(d)+1;x<=dn(localToday());x++){const w=new Date(x*DAYMS).getUTCDay();if(w!==0&&w!==6)n++;}return n;}
function dataIssues(){const out=[];const M=compute();if(!M)return out;
  for(const h of M.holdings.filter(h=>h.qty>0)){const d=lastPriceDate(h.a);const lim=h.a.cls==='crypto'?2:4;
    if(!d)out.push({k:'price',a:h.a,t:`${h.a.symbol}: no price at all`,s:'Add a price under Holdings → '+h.a.symbol});
    else if(h.a.cls==='crypto'?(dn(localToday())-dn(d)>lim):workdaysSince(d)>lim)out.push({k:'price',a:h.a,t:`${h.a.symbol}: last price ${dateLabel(dn(d),true)}`,s:C.err[h.a.id]||'Live prices may not be working for this one'});}
  for(const t of S.txs){if(t.type!=='buy'&&t.type!=='sell')continue;const a=assetById(t.assetId);if(!a)continue;
    if(a.currency!=='NOK'&&!(t.fx>0))out.push({k:'fx',t:`${a.symbol} ${t.type} ${dateLabel(dn(t.date),true)}: no exchange rate`,s:'Open the trade and add the NOK rate',tx:t.id});}
  const seen=new Map();for(const t of S.txs){if(t.type!=='buy'&&t.type!=='sell'&&t.type!=='dividend')continue;const k=[t.date,t.type,t.assetId,t.accountId,t.qty,t.price,t.amount].join('|');if(seen.has(k))seen.get(k).push(t);else seen.set(k,[t]);}
  for(const list of seen.values())if(list.length>1){const t=list[0];const a=assetById(t.assetId);out.push({k:'dup',t:`${list.length}× the same ${t.type} of ${a?a.symbol:'?'} on ${dateLabel(dn(t.date),true)}`,s:'Possible duplicate. Open Activity to check',tx:t.id});}
  const q={};for(const t of S.txs.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(TYPE_ORDER[x.type]||0)-(TYPE_ORDER[y.type]||0))){
    if(!t.assetId)continue;const k=t.assetId+'|'+t.accountId;if(t.type==='buy')q[k]=(q[k]||0)+t.qty;else if(t.type==='split'&&t.ratio>0)q[k]=(q[k]||0)*t.ratio;
    else if(t.type==='sell'){q[k]=(q[k]||0)-t.qty;if(q[k]<-1e-6){const a=assetById(t.assetId);out.push({k:'neg',t:`${a?a.symbol:'?'}: sold more than you held on ${dateLabel(dn(t.date),true)}`,s:'A buy may be missing from your imports',tx:t.id});q[k]=0;}}}
  const R=S.recon||{};for(const h of M.holdings.filter(h=>h.qty>0||R[h.a.id]!=null)){const r=R[h.a.id];if(r==null||r==='')continue;if(Math.abs(+r-h.qty)>Math.max(1e-6,h.qty*1e-6))out.push({k:'recon',a:h.a,t:`${h.a.symbol}: Lacag ${qtyFmt(h.qty)}, broker ${qtyFmt(+r)}`,s:'Difference '+qtyFmt(h.qty-r)+'. A trade may be missing or doubled'});}
  return out;}
