<style>
:root{--fs-micro:9.5px;--fs-xs:11px;--fs-s:12.5px;--fs-m:14px;--fs-b:15px;--fs-l:17px;--fs-xl:22px;--fs-xxl:30px;--label:#B4B6BD} /* type scale (8 sizes) · colour roles: amber = actions and selected; --label = labels and section names; --fg = values */
:root[data-look="day"]{--label:#4E5460}
/* Layout: one-column phone app — sticky top bar, scrolling view, fixed bottom tab bar; widens to a centered 720px column on desktop */
:root{
  /* Bloomberg-terminal look, single dark theme. Amber/blue/white for everything; green and red only mean up and down. */
  --bg:#000000; --surface:#0E0F11; --surface2:#1A1B1F; --line:#2B2D33;
  --fg:#F2F2F2; --muted:#A3A3A8; --amber:#FFA028; --accent:#FFA028; --accent-ink:#000000; --badge-ink:#000000;
  --up:#2CC38B; --down:#FF6A5C; --btc:#FFA028;
  --c1:#FFA028; --c2:#4AA3FF; --c3:#FFE08A; --c4:#9CC9FF; --c5:#D9D9DE; --c6:#C77A12; --c7:#2A6FD6; --c8:#8C8C93;
  --f-display:"IBM Plex Sans","Schibsted Grotesk",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-body:"IBM Plex Sans","Schibsted Grotesk",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}/* optional colour-blind up/down from Bloomberg's CVD research: blue for up, red for down */


*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:var(--fs-b);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:var(--fs-s)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid transparent}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:var(--fs-l);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-s);padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.warn .dot{background:var(--btc)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.primary{background:var(--accent);color:var(--accent-ink)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

h2.sec{font-family:var(--f-display);font-weight:700;margin:26px 0 10px;text-wrap:balance}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}

/* hero */
.hero{padding:14px 0 6px}
.eyebrow{font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,10vw,46px);letter-spacing:-.03em;line-height:1.05;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.hero-chg{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:600}
.hero-chg .when{color:var(--muted);font-weight:400;font-size:var(--fs-s)}

.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:var(--fs-s);font-weight:600;color:var(--muted)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.chart{position:relative;height:230px;margin:10px -4px 4px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:var(--fs-m);text-align:center;padding:20px}
.ranges{display:flex;justify-content:space-between;gap:2px;margin:4px 0 4px;overflow-x:auto;scrollbar-width:none}
.ranges::-webkit-scrollbar{display:none}
.ranges button{flex:1 0 auto;border:0;background:none;border-radius:9px;font-weight:700;color:var(--muted);font-family:var(--f-num)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font-size:var(--fs-s);color:var(--muted);line-height:1.3}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}

.banner{background:color-mix(in srgb,var(--amber) 13%,var(--surface));border-radius:var(--r);padding:12px 14px;margin-top:10px;display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-m)}
.banner b{display:block;font-size:var(--fs-m)}
.banner .btn{margin-top:8px}

/* list rows */
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.badge{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:var(--fs-xs);letter-spacing:-.01em;color:var(--badge-ink)}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:var(--fs-s);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;flex:0 0 auto}
.item .end .t1{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.item .end .t2{font-family:var(--f-num)}
.pill{display:inline-block;font-family:var(--f-num);font-size:var(--fs-s);padding:1px 6px;border-radius:6px}
.pill.up{background:color-mix(in srgb,var(--up) 14%,transparent)}
.pill.down{background:color-mix(in srgb,var(--down) 14%,transparent)}
.pill.flat{background:var(--surface2)}
.month-h{font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:18px 2px 6px}

.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.sumgrid .k{font-size:var(--fs-s);color:var(--muted)}
.sumgrid .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:var(--fs-l);margin-top:2px}

/* donut */
.alloc{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:380px){.alloc{grid-template-columns:1fr}}
.alloc svg{width:150px;height:150px;justify-self:center}
.legend{display:flex;flex-direction:column;gap:7px;min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:var(--fs-m);min-width:0}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .pc{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted)}

/* heatmap */
.hm-wrap{overflow-x:auto;margin:0 -4px}
table.hm{border-collapse:separate;border-spacing:3px;font-family:var(--f-num);font-size:var(--fs-xs);font-variant-numeric:tabular-nums;min-width:560px;width:100%}
table.hm th{font-weight:500;color:var(--muted);font-size:var(--fs-xs);padding:2px;text-align:center}
table.hm th.y{text-align:left;color:var(--fg);font-size:var(--fs-s)}
table.hm td{text-align:center;padding:7px 2px;border-radius:5px;background:var(--surface2)}
table.hm td.tot{font-weight:600;outline:1px solid var(--line)}
table.hm td.na{background:transparent;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:var(--fs-s)}
.bar-row .track{height:10px;border-radius:5px;background:var(--surface2)}
.bar-row .fill{height:100%;background:var(--accent)}
.bar-row .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:var(--fs-s);text-align:right;min-width:86px}

.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);margin:10px 0 8px}

/* buttons & forms */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:var(--fs-m);background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:color-mix(in srgb,var(--down) 14%,var(--surface));color:var(--down)}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:var(--fs-s);border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:var(--fs-s);color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;font-size:var(--fs-l);min-width:0}
.field textarea{font-family:var(--f-num);font-size:var(--fs-s);min-height:110px}
.field .hint{font-size:var(--fs-s);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.total-box{background:var(--surface2);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.err{color:var(--down);font-size:var(--fs-s);min-height:1em}
.presets{display:flex;gap:6px;flex-wrap:wrap}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:rgb(5 8 15 / .45)}
.sheet .panel{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;overscroll-behavior:contain}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:20px;max-height:86%}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h3{font-family:var(--f-display);font-size:var(--fs-xl);margin:0;letter-spacing:-.02em}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:var(--fs-m);font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.note{font-size:var(--fs-m);color:var(--muted);line-height:1.5}
.note b{color:var(--fg)}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:var(--fs-m);line-height:1.55}
ol.steps li{margin:3px 0}
code{font-family:var(--f-num);font-size:var(--fs-s);background:var(--surface2);padding:1px 5px;border-radius:5px}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
.empty-state b{display:block;color:var(--fg);font-size:var(--fs-l);margin-bottom:6px;font-family:var(--f-display)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Lacag additions ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pf-btn{border:0;background:var(--surface2);border-radius:11px;padding:6px 8px 6px 11px;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:var(--fs-m);max-width:42vw;min-width:0}
.pf-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-btn svg{width:16px;height:16px;flex:0 0 auto;color:var(--muted)}
.brand{margin-right:0}
.spacer{flex:1}

.legend-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.lk{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--accent);vertical-align:middle}
.lk.solid{background:var(--up)}
.lk.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:var(--fs-s);font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:4px}
.plan-card,.goal{display:block;width:100%;text-align:left;border:0;color:inherit}
.reps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rep{background:var(--surface);border-radius:var(--r);padding:12px 14px;min-width:0}
.rep-h{font-weight:700;font-size:var(--fs-m)}
.rep-v{font-family:var(--f-num);font-size:var(--fs-xl);margin-top:6px}
.rep-g{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:var(--fs-s);margin-top:8px}
.rep-g .num{text-align:right;font-family:var(--f-num)}
.big2{font-family:var(--f-display);font-size:var(--fs-xxl);font-weight:800;letter-spacing:-.02em}
.sw-row{display:flex;align-items:center}
.sw-row input{width:22px;height:22px;accent-color:var(--accent)}
.linkish{border:0;background:none;text-align:left;padding:0;color:inherit}
.switch{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-m)}
.switch input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--accent);margin-top:1px}
.dotk{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.bar-row.wide{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto}
.bar-row .nm{font-size:var(--fs-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5}
.bar-row .track{position:relative;overflow:visible}
.bar-row .fill{border-radius:5px}
.ask-out{white-space:pre-wrap;font-size:var(--fs-m);line-height:1.55}
.ask-out:empty{display:none}
select.mini{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:var(--fs-m)}
.tot-in{width:44%;text-align:right;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);font-size:var(--fs-l)}
table.hm.narrow{min-width:0}
label.item{cursor:pointer}
details summary{cursor:pointer}
.kpi .v{font-size:var(--fs-l)}
@media (max-width:360px){.reps{grid-template-columns:1fr}}
.brand-name{display:none}
@media (min-width:480px){.brand-name{display:inline}}
.item .t1.wrap,.item .t2.wrap{white-space:normal}
.seg button{white-space:nowrap}
.bar-row.wide .val{min-width:118px}

/* ---- terminal styling ---- */
.eyebrow,h2.sec,.kpi .k,.sumgrid .k,.month-h,.field label,.field .lbl,.rep-h{color:var(--label)}
h2.sec{text-transform:uppercase;letter-spacing:.06em;font-size:var(--fs-m)}
.card,.kpi,.list,.rep{border:1px solid var(--line)}
.ranges button[aria-pressed="true"]{background:var(--amber);color:#000}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--amber);box-shadow:inset 0 0 0 1px var(--line)}
.tog[aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
/* up/down never rely on colour alone */
.up::before{content:"\25B2";font-size:.62em;margin-right:.3em;vertical-align:.12em}
.down::before{content:"\25BC";font-size:.62em;margin-right:.3em;vertical-align:.12em}
.lk.solid::before,.prog .up::before{content:none}
/* chart value box */
.chart .ct{display:none}
.ctip{position:absolute;top:0;left:0;z-index:3;pointer-events:none;min-width:150px;max-width:78%;padding:8px 10px;border-radius:10px;border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
  backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(8px) saturate(1.2);box-shadow:0 6px 18px rgb(0 0 0 / .45);font-size:var(--fs-s)}
.ctip .th{color:var(--label);font-weight:600;margin-bottom:4px;font-family:var(--f-num);font-size:var(--fs-xs)}
.ctip .tr{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:6px;align-items:center;line-height:1.5}
.ctip .tr.sub{opacity:.85}
.ctip .sw{width:8px;height:8px;border-radius:2px}
.ctip .tl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctip .tv{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--fg);text-align:right;white-space:nowrap}
.ctip .tv.up{color:var(--up)} .ctip .tv.down{color:var(--down)}

.hero-val{display:flex}
.eye-btn{border:0;background:var(--surface2);color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.eye-btn svg{width:20px;height:20px}
.eye-btn[aria-pressed="true"]{color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}

/* budget */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}
.mn-label{font-family:var(--f-num);font-weight:600;font-size:var(--fs-l);display:flex;gap:8px;align-items:center;color:var(--label)}
.stackbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface2);gap:2px}
.stackbar span{display:block;height:100%;min-width:2px}
.stackbar .left{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 7px);opacity:.6}
.bgroup .bg-h{display:grid;grid-template-columns:10px minmax(0,1fr) auto 58px;gap:8px;align-items:center;padding:11px 14px;background:var(--surface2)}
.bgroup .bg-h .sw{width:10px;height:10px;border-radius:2px}
.bgroup .bg-name{font-weight:700;color:var(--label);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgroup .bg-h .num{font-family:var(--f-num);text-align:right}
.bgroup .bg-p{font-size:var(--fs-s)}
.bgroup .item{border-top:1px solid var(--line)}
.bgroup .item.off .t1,.bgroup .item.off .t2{opacity:.6}
.bgroup .item.add .t2{color:var(--amber)}
.prog.thin{height:4px;margin:6px 0 0}
table.ytab{width:100%;border-collapse:collapse;font-family:var(--f-num);font-size:var(--fs-s);font-variant-numeric:tabular-nums;min-width:320px}
table.ytab th,table.ytab td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.ytab th:first-child{text-align:left;color:var(--label);font-weight:500}
table.ytab thead th{color:var(--muted);font-weight:500;font-size:var(--fs-xs)}
table.ytab tbody tr{cursor:pointer}
table.ytab tr.cur{background:color-mix(in srgb,var(--amber) 12%,transparent)}
table.ytab tr.tot th,table.ytab tr.tot td{font-weight:600;border-bottom:0}
.grid-months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}

/* overview / positions / returns v3 */
.amber-v{color:var(--fg);font-family:var(--f-num)}

.sub-h{font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.07em;color:var(--label);font-weight:600;margin:18px 2px 8px}
table.rtab{width:100%;border-collapse:collapse;font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.rtab th,table.rtab td{text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.rtab thead th{color:var(--muted);font-weight:500;font-size:var(--fs-xs)}
table.rtab tbody th{text-align:left;font-family:var(--f-body);font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
table.rtab tr.bm th{font-weight:500;color:var(--muted)}
table.rtab th .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
table.rtab td.na{color:var(--muted)}
.ptable{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px}
.prow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 22px;gap:6px;align-items:center;padding:11px 8px 11px 12px;border-top:1px solid var(--line);cursor:pointer}
.prow:first-child{border-top:0}
.prow.phead{cursor:default;padding-top:9px;padding-bottom:9px;background:var(--surface2)}
.prow.ptot{cursor:default;background:var(--surface2);font-family:var(--f-num);font-size:var(--fs-s)}
.ph{border:0;background:none;color:var(--muted);font-size:var(--fs-xs);font-weight:600;text-align:right;padding:0;white-space:nowrap}
.ph.pt{text-align:left}.ph.on{color:var(--label)}
.pt{min-width:0}
.pn{font-weight:600;font-size:var(--fs-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:var(--fs-xs);color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.qb{display:inline-block;background:var(--surface2);border-radius:4px;padding:0 4px;font-family:var(--f-num);color:var(--fg);font-size:var(--fs-xs)}
.pv{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:var(--fs-s);min-width:0}
.pv>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pu{color:var(--muted);font-size:var(--fs-xs);margin-top:2px}
.pv .up::before,.pv .down::before{font-size:.55em}
.pm{border:0;background:none;color:var(--muted);font-size:var(--fs-l);line-height:1;padding:4px 0;text-align:center}
.rb-wrap{overflow-x:auto;padding-bottom:4px}
.rb-wrap svg{display:block}
.rb-wrap rect{cursor:pointer}

@media (max-width:400px){.prow{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 18px;gap:4px;padding-left:10px}.pv{font-size:var(--fs-xs)}.pn{font-size:var(--fs-s)}}

table.rtab{min-width:0}
.rep-g .num{white-space:nowrap}
.ps{white-space:normal}

table.rtab td.why{text-align:left;font-family:var(--f-body);font-size:var(--fs-xs)}
table.rtab{font-size:var(--fs-xs)}
table.rtab th,table.rtab td{padding:9px 3px}
table.rtab tbody th{max-width:84px;font-size:var(--fs-s)}

/* ---- appearance settings ---- */
:root{--card-alpha:100}
:root[data-look="day"]{--bg:#F1F2F4;--surface:#FFFFFF;--surface2:#E7E9ED;--line:#D3D7DE;--fg:#111317;--muted:#5D6370;--btc:#C77700;
  --c2:#2F6FD0;--c3:#B58900;--c4:#3A7BD5;--c5:#7A7F8A;--c6:#A05A00;--c7:#1F4E99;--c8:#6B7280;--badge-ink:#FFFFFF;color-scheme:light}
.card,.kpi,.list,.rep,.ptable,.bgroup{background:color-mix(in srgb,var(--surface) calc(var(--card-alpha)*1%),transparent)}
.ctip{background:color-mix(in srgb,var(--surface) 78%,transparent)}
.hero.card{padding:16px 16px 14px;margin-top:12px}
.chart-card{margin-top:12px;padding:14px 12px 10px}
.chart-card .chart{margin:8px -4px 4px}
/* big tables */
:root[data-tables="fit"] table.hm{min-width:0;font-size:var(--fs-micro);border-spacing:2px}

function fxPoints(cur,today){
  const m=new Map();let mode='lin';const h=C.fx&&C.fx[cur];
  if(h&&h.length){mode='step';for(const [d,v] of h)m.set(dn(d),v);}
  else{for(const t of S.txs){if(t.type!=='buy'&&t.type!=='sell')continue;const a=assetById(t.assetId);if(a&&a.currency===cur&&t.fx>0)m.set(dn(t.date),t.fx);}}
  const live=C.fxLive&&C.fxLive.date===localToday()?C.fxLive[cur]:null;
  const fallback=h&&h.length?h[h.length-1][1]:S.fx[cur];
  if(live||fallback)m.set(today,live||fallback);
  return {pts:[...m.entries()].sort((a,b)=>a[0]-b[0]),mode};
}
function dense(points,d0,N,mode){
  const out=new Float64Array(N);if(!points.length){out.fill(NaN);return out;}
  let j=0;
  for(let i=0;i<N;i++){const day=d0+i;
    while(j<points.length-1&&points[j+1][0]<=day)j++;
    if(day<=points[0][0])out[i]=points[0][1];
    else if(j>=points.length-1||mode==='step')out[i]=points[j][1];
    else{const [a,va]=points[j],[b,vb]=points[j+1];out[i]=va+(vb-va)*(day-a)/(b-a);}}
  return out;
}
const histKey=a=>(a.cls==='crypto'?'bin:':'td:')+(a.dataSymbol||a.symbol).toUpperCase();

/* product of split ratios after a date: turns an old per-share price into today's share terms */
function splitAfter(assetId,date){let f=1;for(const t of S.txs)if(t.type==='split'&&t.assetId===assetId&&t.date>date&&t.ratio>0)f*=t.ratio;return f;}

/* the price at 00:00 Norway time from the 15-minute prices, when they reach past that minute */
function priceAtMidnight(a){const it=C.intra&&C.intra[a.id];if(!it||!it.s||!it.s.length)return null;const T0=osloMidnight();

function market(){
  if(MEMO.mkt&&MEMO.mkt.v===VERSION)return MEMO.mkt;
  const today=dn(localToday());
  let first=today;for(const t of S.txs){const d=dn(t.date);if(d<first)first=d;}
  const d0=first;const N=today-d0+1;
  const fxD={};for(const cur of CCYS){if(cur==='NOK')continue;const {pts,mode}=fxPoints(cur,today);fxD[cur]=pts.length?dense(pts,d0,N,mode):null;}
  const fxAt=(cur,i)=>{if(cur==='NOK')return 1;const a=fxD[cur];if(!a)return S.fx[cur]||NaN;return a[Math.max(0,Math.min(N-1,i))];};
  const priceCur={},src={},lastTwo={};
  for(const a of S.assets){
    const m=new Map();let mode='lin';const h=C.hist[histKey(a)];
    const conv=(day,v,q)=>{if(!q||q===a.currency||!CCYS.includes(q))return v;const i=day-d0;return v*fxAt(q,i)/fxAt(a.currency,i);};
    let lastHist=-Infinity;
    if(h&&h.s&&h.s.length){mode='step';for(const [d,v] of h.s){const day=dn(d);m.set(day,conv(day,v,h.q));if(day>lastHist)lastHist=day;}src[a.id]='live';}
    else{for(const t of S.txs)if(t.assetId===a.id&&(t.type==='buy'||t.type==='sell')&&t.price>0)m.set(dn(t.date),t.price/splitAfter(a.id,t.date));src[a.id]='manual';}
    for(const p of S.prices)if(p.assetId===a.id&&dn(p.date)>lastHist)m.set(dn(p.date),p.price/splitAfter(a.id,p.date));
    const lv=C.live[a.id];if(lv&&lv.date===localToday()&&lv.price>0)m.set(today,conv(today,lv.price,lv.q));

    /* the last two days that really had a price (markets are closed at weekends): "today" = last trading day's move, like Nordnet */
    if(mode==='step'&&ent.length>1)lastTwo[a.id]=[ent[ent.length-2][0],ent[ent.length-1][0]];

function compute(){

  const H={};for(const a of S.assets)H[a.id]={qty:0,cost:0,costCur:0,costNoFee:0,realized:0,divs:0,fees:0,invested:0,accs:new Set(),byAcc:{}};
  const cash={};const cashIn={};for(const a of S.accounts){cash[a.id]=0;cashIn[a.id]={dep:0,int:0};}
  const firstDay=dn(txs[0].date);
  let ti=0;let net=0;

    while(ti<txs.length&&dn(txs[ti].date)===day){const t=txs[ti++];const acc=accById(t.accountId);if(!acc)continue;
      const accFx=fxAt(acc.currency,i);

        const a=assetById(t.assetId);const h=H[a.id];const fx=a.currency==='NOK'?1:(t.fx||fxAt(a.currency,i));
        const gross=t.qty*t.price*fx;const fee=t.fee||0;const secIn=inP(t.accountId);
        const src=t.fundAccountId==='__outside'?null:(t.fundAccountId||(acc.tracksCash?acc.id:null));const srcIn=inP(src);

        else if(secIn)CF[i]+=signed;

      else if(t.type==='dividend'){const a=assetById(t.assetId);const secIn=inP(t.accountId);const dest=t.fundAccountId==='__outside'?null:(t.fundAccountId||(acc.tracksCash?acc.id:null));

        if(inP(dest)){const da=accById(dest);cash[dest]+=t.amount/fxAt(da.currency,i);if(!secIn)CF[i]+=t.amount;}

      else if(t.type==='deposit'||t.type==='withdraw'){if(!inP(acc.id))continue;const s=t.type==='deposit'?1:-1;cash[acc.id]+=s*t.amount;CF[i]+=s*t.amount*accFx;cashIn[acc.id].dep+=s*t.amount;}

      else if(t.type==='transfer'){const to=accById(t.toAccountId);const inA=inP(acc.id),inB=to&&inP(to.id);const nok=t.amount*accFx;
        if(inA){cash[acc.id]-=t.amount;cashIn[acc.id].dep-=t.amount;}if(inB){cash[to.id]+=nok/fxAt(to.currency,i);cashIn[to.id].dep+=nok/fxAt(to.currency,i);}

/* re-express the model in a display currency and compute time-weighted returns */
function series(M,ccy){

const RANGES=['1D','1W','1M','6M','YTD','1Y','3Y','5Y','10Y','MAX'];

  switch(key){case '1D':return today-1;case '1W':return today-7;case '1M':return addMonths(today,-1);case '6M':return addMonths(today,-6);
    case 'YTD':return dn((y-1)+'-12-31');case '1Y':return addMonths(today,-12);case '2Y':return addMonths(today,-24);case '3Y':return addMonths(today,-36);case '5Y':return addMonths(today,-60);case '10Y':return addMonths(today,-120);default:return -Infinity;}}

function bmSeries(M,id,ccy){

function freeCacheSpace(level){try{

function portfolioSeries(M,Z,key,st){
  if(key==='1D'){
    /* today from 00:00 Norway time to now: the first point is the value at midnight, then the 15-minute prices, then now */
    const L=M.N-1;const tNow=Date.now();const t0=osloMidnight();const times=new Set();const live=M.holdings.filter(h=>h.qty>0&&(!M.__group||M.__group.ids.has(h.a.id)));
    for(const h of live){const it=C.intra[h.a.id];if(it&&tNow-it.t<6*3600e3)for(const [t] of it.s)if(t>t0&&t<tNow)times.add(t);}
    const k=UI.ccy==='NOK'?1:M.fxAt(UI.ccy,L);
    const at0=live.reduce((s,h)=>{const P=market().priceCur[h.a.id];const p=P&&L>0?P[L-1]:h.priceNow;return s+h.qty*p*(L>0?M.fxAt(h.a.currency,L-1):h.fxNow);},0);
    const now=live.reduce((s,h)=>s+h.qty*h.priceNow*h.fxNow,0);
    const pts=[{x:t0,v:at0/k}];for(const t of [...times].sort((a,b)=>a-b)){let v=0;for(const h of live){const it=C.intra[h.a.id];let p=null;
        if(it&&tNow-it.t<6*3600e3){for(const [tt,pp] of it.s){if(tt<=t)p=pp;else break;}if(p!=null&&it.q&&it.q!==h.a.currency)p=p*M.fxAt(it.q,L)/M.fxAt(h.a.currency,L);}
        if(p==null)p=h.priceNow;v+=h.qty*p*h.fxNow;}pts.push({x:t,v:v/k});}
    pts.push({x:tNow,v:now/k});return {time:true,pts,from:t0};}
  const idxs=[];for(let i=st.startI;i<=st.ei;i++)idxs.push(i);const base=st.bi>=0?Z.IDX[st.bi]:1;
  return {time:false,idx:downsample(idxs)};
}

  const list=by==='sector'?SECTORS:by==='region'?REGIONS:null;const pcol=k=>`var(${PALETTE[Math.max(0,list?list.indexOf(k):0)%PALETTE.length]})`;

    else if(by==='account'){const tot=Object.values(h.byAcc||{}).reduce((s,x)=>s+x,0)||1;for(const [aid,q] of Object.entries(h.byAcc||{})){const acc=accById(aid);if(acc&&q>0)add(aid,acc.name,accColor(acc),h.value*q/tot);}}
    else{const look=a.look&&a.look[by];
      if(look&&Object.keys(look).length){const sum=Object.values(look).reduce((s,x)=>s+(+x||0),0)||1;for(const [k,w] of Object.entries(look))add(k,k,pcol(k),h.value*(+w||0)/sum);}
      else{const k=by==='sector'?(a.sector||(a.cls==='crypto'?'Crypto':'Other')):(a.region||'Other');add(k,k,by==='sector'&&k==='Crypto'?'var(--btc)':pcol(k),h.value);}}}
  for(const c of M.cashRows){if(!(c.value>0))continue;const acc=c.acc;
    if(by==='class')add('cash','Cash',CLASS_COLOR.cash,c.value);
    else if(by==='holding')add('cash:'+acc.id,'Cash · '+acc.name,accColor(acc),c.value);

/* performance per asset type, same time-weighted method as the whole portfolio */
const CLS_LINE={all:['All assets','var(--accent)'],stock:['Stocks','#C9A0FF','1 0'],etf:['ETFs & funds','#F2F2F2','2 3'],crypto:['Crypto','#4DE1FF','8 3 2 3']};

  const g=Z.V[i]-(i>0?Z.V[i-1]:0)-Z.CF[i]+Z.DIV[i];map.set(k,(map.get(k)||0)+g);}return map;}
function periodReturns(M,Z,per){const map=new Map();for(let i=0;i<M.N;i++){const d=new Date((M.d0+i)*DAY);if(M.d0+i<M.firstDay)continue;const k=per==='quarter'?d.getUTCFullYear()*4+Math.floor(d.getUTCMonth()/3):d.getUTCFullYear()*12+d.getUTCMonth();map.set(k,(map.get(k)||1)*(1+Z.R[i]));}return map;}

function valueOfSource(M,src){
  if(!M)return 0;if(!src||src==='portfolio')return M.total;
  if(src.startsWith('acc:')){const id=src.slice(4);let v=0;const c=M.cashRows.find(r=>r.acc.id===id);if(c)v+=c.value;
    for(const h of M.holdings){if(h.qty>0&&h.byAcc&&h.byAcc[id])v+=h.value*h.byAcc[id]/h.qty;}return v;}
  return 0;
}
function goalSaved(M,g){return g.source==='manual'?(+g.saved||0):valueOfSource(M,g.source);}
function monthsBetween(a,b){return Math.max(0,(b-a)/30.4375);}
function neededMonthly(cur,target,months,annual){if(months<=0)return target-cur;const r=Math.pow(1+annual,1/12)-1;const g=Math.pow(1+r,months);const rest=target-cur*g;if(rest<=0)return 0;return r>0?rest*r/(g-1):rest/months;}

function ageNow(){const d=new Date();return d.getFullYear()-S.plan.birthYear+d.getMonth()/12;}
function taxMix(M){if(!M)return {rate:TAX.shares,crypto:0,sec:0};let cr=0,sec=0;for(const h of M.holdings){if(!(h.qty>0))continue;if(h.a.cls==='crypto')cr+=h.value;else sec+=h.value;}const inv=cr+sec;return {rate:inv?(cr*TAX.capital+sec*TAX.shares)/inv:TAX.shares,crypto:cr,sec};}
function project(M,o={}){
  const p=S.plan;const a0=ageNow();const r=p.realReturn;const startV=M?M.total:0;const startB=M?Math.max(0,Math.min(M.NET[M.N-1],startV)):0;
  const events=o.noEvents?[]:p.events.filter(e=>e.on!==false);
  const goalEvents=o.noEvents?[]:S.goals.filter(g=>g.spend&&g.date).map(g=>({type:'out',age:S.plan.birthYear?yearOf(dn(g.date))-p.birthYear+new Date(g.date).getMonth()/12:0,amount:+g.target,name:g.name}));
  const lumps=[...events.filter(e=>e.type==='in'||e.type==='out'),...goalEvents];
  const ages=[],vals=[];let V=startV,B=startB,W=null,Vret=null,gs=0;const extra=(o.extra||0)*12;
  const lifeAge=Math.max(p.retireAge+1,p.lifeAge);
  for(let a=Math.floor(a0*2)/2;a<=lifeAge+1e-9;a+=0.5){ // half-year steps
    ages.push(a);vals.push(V);if(a>=lifeAge)break;
    const step=0.5;let save=0;
    if(a<p.retireAge){let monthly=p.monthlySaving;for(const e of events)if(e.type==='saving'&&a+1e-9>=e.age&&a<e.untilAge-1e-9)monthly=+e.amount;save=(monthly*12+extra)*step;}
    let lump=0;for(const e of lumps)if(e.age>=a&&e.age<a+step)lump+=e.type==='out'?-e.amount:+e.amount;
    const g=Math.pow(1+r,step);
    if(a<p.retireAge){V=V*g+save+lump;B=B+save+(lump>0?lump:0);if(lump<0&&V>0)B=B*Math.max(0,V/(V-lump));}
    else{if(W==null){Vret=V;const n=lifeAge-p.retireAge;W=r>0?V*r/(1-Math.pow(1+r,-n)):V/n;gs=V>0?Math.max(0,1-B/V):0;}V=V*g-W*step+lump;}
    if(a+step>=p.retireAge&&W==null&&a+step<=p.retireAge+1e-9){} // computed next loop
  }
  if(W==null){Vret=V;const n=lifeAge-p.retireAge;W=r>0?V*r/(1-Math.pow(1+r,-n)):V/n;gs=V>0?Math.max(0,1-B/V):0;}
  const tm=taxMix(M);const invNet=Math.max(0,W)*(1-gs*tm.rate);const penNet=(p.navYearly+p.otherYearly)*(1-p.pensionTax);
  const income=(invNet+penNet)/12;return {ages,vals,Vret,W,invNet,penNet,income,gap:p.desiredMonthly-income,gs,taxRate:tm.rate,a0};
}

/* ================= sheets ================= */
function openSheet(title,body,onMount){
  const s=$('#sheet');s.innerHTML=`<div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-h"><h3>${esc(title)}</h3><button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div><div id="sheetBody">${body}</div></div>`;
  const wasOpen=!s.hidden;if(!wasOpen)SHEET_RETURN=document.activeElement;
  s.hidden=false;document.body.style.overflow='hidden';onMount&&onMount(s);
  /* keyboard and screen readers: focus moves into the window (the close button, so no keyboard pops up on phones) */
  const c=s.querySelector('.sheet-h [data-act="close"]');if(c)try{c.focus({preventScroll:true});}catch(e){}}
let SHEET_RETURN=null;
function closeSheet(){const s=$('#sheet');s.hidden=true;s.innerHTML='';document.body.style.overflow='';
  /* and back to where you were when it closes */
  const r=SHEET_RETURN;SHEET_RETURN=null;if(r&&document.body.contains(r))try{r.focus({preventScroll:true});}catch(e){}}
/* Tab stays inside an open window */
document.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const s=$('#sheet');if(!s||s.hidden)return;
  const f=[...s.querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;
  const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.hidden=true,2400);}
const fv=id=>document.getElementById(id);
function armed(btn,label){if(btn.dataset.armed)return true;btn.dataset.armed='1';btn.textContent=label;return false;}
function leaveDemo(){if(S.demo){const bud=S.budget;S=blankState();if(bud)S.budget=bud;VERSION++;}}

function addMenu(){
  openSheet('Add','<div class="list">'+[
    ['trade','buy','Buy or sell','Stocks, ETFs, funds, crypto'],['dividend','dividend','Dividend','Money paid out by a holding'],
    ['cash','cash','Cash','Deposit, withdrawal, balance, interest or transfer'],['import','import','Import CSV','Nordnet, Kraken or another broker']]
    .map(([k,ic,t1,t2])=>`<button class="item" data-act="${k==='trade'?'trade':k==='dividend'?'dividendform':k}"><span class="badge" style="background:var(--accent)"><span style="width:18px;height:18px;display:block">${ICON[ic]}</span></span><div class="mid"><div class="t1">${t1}</div><div class="t2">${t2}</div></div></button>`).join('')+'</div>');}

function fxForDate(cur,date){if(cur==='NOK')return 1;const h=C.fx&&C.fx[cur];if(h&&h.length){let v=null;for(const [d,x] of h){if(d<=date)v=x;else break;}if(v)return date>=localToday()&&C.fxLive&&C.fxLive[cur]?C.fxLive[cur]:v;}return S.fx[cur]||1;}
function priceForDate(a,date){const mk=market();const i=dn(date)-mk.d0;const arr=mk.priceCur[a.id];if(!arr||i<0||i>=mk.N)return null;const v=arr[i];return isFinite(v)?v:null;}
function defaultAccFor(cls){const kind=cls==='crypto'?'crypto':cls==='etf'?'ask':'aksje';const P=portfolio();return (S.accounts.find(a=>a.kind===kind&&P.accountIds.includes(a.id))||S.accounts.find(a=>a.kind!=='cash')||S.accounts[0]||{}).id;}
function accOptions(sel,filter=()=>true){return S.accounts.filter(filter).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}${a.broker?' · '+esc(a.broker):''}</option>`).join('');}

function txSheet(tx,opts={}){
  const isEdit=!!tx;const t=tx||{type:opts.type||'buy',assetId:opts.assetId||'',accountId:'',date:localToday()};
  const assets=S.demo?[]:S.assets.filter(a=>a.cls!=='cash');
  const firstAsset=t.assetId||(assets[0]&&assets[0].id)||'';
  const body=`<form class="form" id="txForm" novalidate>
   ${S.demo&&!isEdit?'<div class="banner" style="margin:0">Saving this clears the example portfolio.</div>':''}
   <div class="seg" role="group" style="align-self:flex-start">${['buy','sell','dividend','split'].map(k=>`<button type="button" data-ttype="${k}" aria-pressed="${t.type===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
   <div class="field"><label for="fAsset">Holding</label><select id="fAsset">${assets.map(a=>`<option value="${a.id}" ${a.id===firstAsset?'selected':''}>${esc(a.symbol)} · ${esc(a.name||'')}</option>`).join('')}<option value="__new" ${!assets.length||!firstAsset?'selected':''}>+ New holding…</option></select></div>
   <div id="newAsset" class="stack" hidden>
     <div class="presets">${PRESETS.map((p,i)=>`<button type="button" class="btn sm" data-preset="${i}">${p.symbol}</button>`).join('')}</div>
     <div class="grid2"><div class="field"><label for="fSym">Ticker or name</label><input id="fSym" autocapitalize="characters" autocomplete="off" placeholder="NFLX, Netflix, AAPL"></div><div class="field"><label for="fName">Name</label><input id="fName" placeholder="Bitcoin"></div></div>
     <div class="grid2"><div class="field"><label for="fCls">Type</label><select id="fCls"><option value="stock">Stock</option><option value="etf">ETF / fund</option><option value="crypto">Crypto</option></select></div><div class="field"><label for="fCur">Trades in</label><select id="fCur">${ASSET_CCYS.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
     <div class="grid2"><div class="field"><label for="fSector">Sector</label><select id="fSector"><option value="Other">Choose sector…</option>${SECTORS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label for="fRegion">Region</label><select id="fRegion">${REGIONS.map(s=>`<option>${s}</option>`).join('')}</select></div></div>
     <div class="field"><label for="fData">Price ticker (for live prices)</label><input id="fData" autocapitalize="characters" placeholder="AAPL · WEBN:XETR · BTC"><div class="hint">Add <code>:EXCHANGE</code> for non-US listings, e.g. <code>WEBN:XETR</code>.</div></div>
   </div>
   <div class="note small" id="lookupNote" hidden></div>
   <div class="field"><label for="fAcc">Account</label><select id="fAcc">${accOptions(t.accountId,a=>a.kind!=='cash')}</select></div>
   <div class="grid2 dtrow"><div class="field"><label for="fDate">Date</label><input id="fDate" type="date" value="${esc(t.date)}" max="${localToday()}"></div><div class="field"><label for="fTime">Time <span class="muted">(optional)</span></label><input id="fTime" type="time" value="${esc(t.time||'')}"></div></div>
     <div class="field"><label for="fNote">Why? <span class="muted">(optional diary note)</span></label><input id="fNote" maxlength="160" placeholder="e.g. Bought the dip after earnings" value="${esc(t.note||'')}"></div>
   <div id="tradeFields" class="stack">
     <div class="grid2"><div class="field"><label for="fQty">Quantity</label><input id="fQty" inputmode="decimal" value="${inputNum(t.qty,8)}" placeholder="0,05"></div><div class="field"><label for="fPrice" id="lPrice">Price per unit</label><input id="fPrice" inputmode="decimal" value="${inputNum(t.price,6)}"></div></div>
     <div class="grid2"><div class="field" id="fxWrap"><label for="fFx" id="lFx">NOK per 1 USD</label><input id="fFx" inputmode="decimal" value="${inputNum(t.fx,4)}"></div><div class="field"><label for="fFee">Fee (NOK)</label><input id="fFee" inputmode="decimal" value="${inputNum(t.fee,2)}" placeholder="0"></div></div>
     <div class="total-box"><div><div class="small muted" id="lTotal">Total paid in NOK</div><div class="small muted">Edit to match your statement</div></div><input id="fTotal" inputmode="decimal" class="num tot-in"></div>
   </div>
   <div id="splitFields" class="stack" hidden><div class="field"><label for="fRatio">New shares for each old share</label><input id="fRatio" inputmode="decimal" value="${inputNum(t.ratio,6)}" placeholder="10"><div class="hint">A 10-for-1 split (like Netflix in Nov 2025) is 10. A 1-for-5 reverse split is 0,2. Use the first trading day after the split.</div></div></div>
   <div id="divFields" class="field" hidden><label for="fAmt">Amount received (NOK, after withholding tax)</label><input id="fAmt" inputmode="decimal" value="${inputNum(t.amount,2)}"></div>
   <div class="field" id="fundWrap"><label for="fFund">Paid from / paid into</label><select id="fFund"><option value="__outside">Outside Lacag (bank, salary)</option>${accOptions(t.fundAccountId||((accById(t.accountId)||{}).tracksCash?t.accountId:'__outside'),a=>a.tracksCash)}</select><div class="hint">Pick a cash account if the money moved from or to cash you track here.</div></div>
   <div class="err" id="fErr"></div>
   <button class="btn primary block" type="submit">${isEdit?'Save changes':'Save'}</button>
   ${isEdit?'<button class="btn danger block" type="button" id="delTx">Delete</button>':''}
  </form>`;
  openSheet(isEdit?'Edit transaction':'Add a transaction',body,()=>{
    let type=t.type;
    const curAsset=()=>{const id=fv('fAsset').value;return id==='__new'?null:assetById(id);};
    const curOf=()=>{const a=curAsset();return a?a.currency:fv('fCur').value;};
    const syncType=()=>{$$('[data-ttype]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ttype===type));fv('tradeFields').hidden=type==='dividend'||type==='split';fv('divFields').hidden=type!=='dividend';fv('splitFields').hidden=type!=='split';fv('fundWrap').hidden=type==='split';fv('lTotal').textContent=type==='sell'?'Total received in NOK':'Total paid in NOK';calc();};
    const syncAsset=fill=>{const a=curAsset();fv('newAsset').hidden=!!a;const cur=curOf();fv('fxWrap').style.visibility=cur==='NOK'?'hidden':'visible';fv('lFx').textContent='NOK per 1 '+cur;fv('lPrice').textContent='Price per unit ('+cur+')';
      if(fill){if(!isEdit){const cls=a?a.cls:fv('fCls').value;const last=a&&S.txs.filter(x=>x.assetId===a.id).slice(-1)[0];fv('fAcc').value=last?last.accountId:defaultAccFor(cls);}
        if(cur!=='NOK')fv('fFx').value=inputNum(fxForDate(cur,fv('fDate').value),4);if(a){const p=priceForDate(a,fv('fDate').value);if(p)fv('fPrice').value=inputNum(p,a.cls==='crypto'?0:2);}}calc();};
    const calc=()=>{const q=parseNum(fv('fQty').value),p=parseNum(fv('fPrice').value),fee=parseNum(fv('fFee').value)||0;const cur=curOf();const fx=cur==='NOK'?1:parseNum(fv('fFx').value);
      fv('fTotal').value=q>0&&p>0&&fx>0?inputNum(type==='sell'?q*p*fx-fee:q*p*fx+fee,2):'';};
    $$('[data-ttype]').forEach(b=>b.onclick=()=>{type=b.dataset.ttype;syncType();});
    fv('fAsset').onchange=()=>syncAsset(true);fv('fCur').onchange=()=>syncAsset(true);fv('fDate').onchange=()=>syncAsset(true);
    ['fQty','fPrice','fFx','fFee'].forEach(id=>fv(id).oninput=calc);
    fv('fTotal').oninput=()=>{const q=parseNum(fv('fQty').value),p=parseNum(fv('fPrice').value),fee=parseNum(fv('fFee').value)||0,tot=parseNum(fv('fTotal').value);if(curOf()!=='NOK'&&q>0&&p>0&&tot>0){const fx=(type==='sell'?tot+fee:tot-fee)/(q*p);if(fx>0)fv('fFx').value=inputNum(fx,4);}};
    $$('[data-preset]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.preset];fv('fSym').value=p.symbol;fv('fName').value=p.name;fv('fCls').value=p.cls;fv('fCur').value=p.currency;fv('fData').value=p.dataSymbol;fv('fSector').value=p.sector;fv('fRegion').value=p.region;fv('fAcc').value=defaultAccFor(p.cls);syncAsset(true);});
    fv('fCls').onchange=()=>{const c=fv('fCls').value;if(c==='crypto'){fv('fCur').value='USD';fv('fSector').value='Crypto';fv('fRegion').value='Global (no country)';}fv('fAcc').value=defaultAccFor(c);syncAsset(true);};
    let lookSeq=0;
    fv('fSym').onchange=async()=>{const q=fv('fSym').value.trim();const note=fv('lookupNote');if(!q||curAsset())return;
      const known=PRESETS.find(p=>p.symbol===q.toUpperCase());if(known)return;
      if(!S.settings.tdKey){note.hidden=false;note.textContent='Tip: add your Twelve Data key in Settings and Lacag fills in the name, currency and today\'s price for you.';return;}
      const my=++lookSeq;note.hidden=false;note.textContent='Looking up '+q+'…';
      const r=await lookupTicker(q);if(my!==lookSeq)return;
      if(!r||r.error){note.textContent='Couldn\'t look it up'+(r&&r.error?': '+r.error:'')+'. Fill in the fields yourself.';return;}
      if(r.none){note.textContent='No match for "'+q+'". Check the ticker, or fill in the fields yourself.';return;}
      const us=r.country==='United States';const cls=/etf|fund/i.test(r.instrument_type||'')?'etf':'stock';
      fv('fSym').value=r.symbol;fv('fName').value=r.instrument_name||r.symbol;fv('fCls').value=cls;if(ASSET_CCYS.includes(r.currency))fv('fCur').value=r.currency;
      fv('fData').value=us?r.symbol:r.symbol+':'+(r.mic_code||r.exchange);fv('fRegion').value=us?'North America':/norway/i.test(r.country||'')?'Norway':/japan/i.test(r.country||'')?'Japan':'Europe (ex-Norway)';
      if(cls==='etf')fv('fSector').value='Other';fv('fAcc').value=defaultAccFor(cls);
      note.textContent=`Found ${r.instrument_name} · ${r.exchange} · ${r.currency}. Check the details below.`;syncAsset(true);
      if(cls==='stock'){try{const pf=await td('profile',tdSym(fv('fData').value));const sec=mapSector(pf&&pf.sector);if(sec&&my===lookSeq){fv('fSector').value=sec;note.textContent+=' Sector: '+sec+'.';}}catch(e){if(my===lookSeq)note.textContent+=' Pick the sector yourself.';}}
      if(fv('fDate').value===localToday()){try{const pr=await td('price',tdSym(fv('fData').value));if(pr&&pr.price&&my===lookSeq&&!fv('fPrice').value){fv('fPrice').value=inputNum(+pr.price,2);calc();}}catch(e){}}
    };
    syncAsset(!isEdit);syncType();
    fv('txForm').onsubmit=e=>{e.preventDefault();const err=fv('fErr');err.textContent='';
      let a=curAsset();let newA=null;
      if(!a){const sym=fv('fSym').value.trim().toUpperCase();if(!sym){return showErr(err,'Enter a ticker, for example BTC or AAPL.');}
        a=(S.demo?[]:S.assets).find(x=>x.symbol.toUpperCase()===sym);
        if(a){a.name=fv('fName').value.trim()||a.name;a.cls=fv('fCls').value;a.sector=fv('fSector').value;a.region=fv('fRegion').value;if(fv('fData').value.trim())a.dataSymbol=fv('fData').value.trim().toUpperCase();}
        if(!a){const pre=PRESETS.find(p=>p.symbol===sym);newA={id:uid(),symbol:sym,name:fv('fName').value.trim()||sym,cls:fv('fCls').value,currency:fv('fCur').value,dataSymbol:(fv('fData').value.trim()||sym).toUpperCase(),sector:fv('fSector').value,region:fv('fRegion').value,look:pre&&pre.look?JSON.parse(JSON.stringify(pre.look)):null};a=newA;}}
      const date=fv('fDate').value;if(!date){return showErr(err,'Pick a date.');}if(date>localToday()){return showErr(err,'The date can\'t be in the future.');}
      const accountId=fv('fAcc').value;if(!accountId){return showErr(err,'Add an account in Settings first.');}
      const fund=fv('fFund').value||'__outside';let rec;
      if(type==='split'){if(newA)return showErr(err,'Pick the holding that was split.');const r=parseNum(fv('fRatio').value);if(!(r>0)||r===1)return showErr(err,'Enter how many new shares you got for each old share, for example 10.');rec={type,assetId:a.id,accountId,date,ratio:r};}

/* ================= CSV import ================= */
function decodeBuffer(buf){const b=new Uint8Array(buf);
  if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder('utf-16le').decode(b.subarray(2));
  if(b[0]===0xFE&&b[1]===0xFF)return new TextDecoder('utf-16be').decode(b.subarray(2));
  let zeros=0;for(let i=1;i<Math.min(b.length,400);i+=2)if(b[i]===0)zeros++;if(zeros>50)return new TextDecoder('utf-16le').decode(b);
  let t=new TextDecoder('utf-8').decode(b);if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);if(t.includes(String.fromCharCode(0xFFFD)))t=new TextDecoder('windows-1252').decode(b);return t;}
function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||'';const cnt=c=>first.split(c).length;const delim=[['\t',cnt('\t')],[';',cnt(';')],[',',cnt(',')]].sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];f='';}else f+=c;}
  row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);return rows;}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ø/g,'o').replace(/æ/g,'ae').replace(/å/g,'a').replace(/[^a-z0-9]/g,'');
function findCol(headers,names){const H=headers.map(norm);for(const n of names){const i=H.indexOf(norm(n));if(i>=0)return i;}for(const n of names){const i=H.findIndex(h=>h.startsWith(norm(n)));if(i>=0)return i;}return -1;}
function toISODate(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;m=s.match(/^(\d{4})\/(\d{2})\/(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;return null;}
function classifyType(s){const t=norm(s);
  if(/kjop|kopt|kop$|buy|bought|purchase/.test(t))return 'buy';if(/salg|solgt|salt|sell|sold/.test(t))return 'sell';
  if(/kupongskatt|kallskatt|withholding|utbytteskatt|tax/.test(t))return 'tax';if(/utbytte|utdelning|utdeling|dividend/.test(t))return 'dividend';
  if(/innskudd|insattning|deposit/.test(t))return 'deposit';if(/uttak|uttag|withdraw/.test(t))return 'withdraw';
  if(/rente|ranta|interest/.test(t))return 'interest';if(/avgift|gebyr|fee/.test(t))return 'fee';return null;}
function detectFormat(headers){const H=headers.map(norm);
  if(H.includes('transaksjonstype')||H.includes('transaktionstyp'))return 'nordnet';
  if(H.includes('pair')&&H.includes('vol'))return 'kraken';if(H.includes('refid')&&H.includes('aclass'))return 'krakenledger';return 'generic';}
const KRAKEN_ASSET={XBT:'BTC',XXBT:'BTC',XETH:'ETH',XXDG:'DOGE',XDG:'DOGE',ZEUR:'EUR',ZUSD:'USD',ZGBP:'GBP',ZCHF:'CHF',XXRP:'XRP',XLTC:'LTC',XXLM:'XLM'};
function splitPair(p){p=String(p).toUpperCase().replace(/[^A-Z/]/g,'');if(p.includes('/')){const [b,q]=p.split('/');return [KRAKEN_ASSET[b]||b,KRAKEN_ASSET[q]||q];}
  for(const q of ['ZEUR','ZUSD','ZGBP','ZCHF','EUR','USD','GBP','CHF','NOK','USDT','USDC']){if(p.endsWith(q)&&p.length>q.length){const b=p.slice(0,-q.length);return [KRAKEN_ASSET[b]||b.replace(/^X(?=[A-Z]{3}$)/,''),KRAKEN_ASSET[q]||q.replace(/^Z/,'')];}}return [p,'USD'];}

/* turn rows into normalized records */
function buildRecords(fmt,rows,map){
  const headers=rows[0];const data=rows.slice(1);const out=[];const skipped={};
  const col=(names)=>findCol(headers,names);
  if(fmt==='nordnet'){
    const c={id:col(['Id']),date:col(['Handelsdag','Affärsdag','Bokføringsdag','Bokföringsdag']),type:col(['Transaksjonstype','Transaktionstyp']),sym:col(['Verdipapir','Värdepapper']),isin:col(['ISIN']),
      qty:col(['Antall','Antal']),price:col(['Kurs']),amt:col(['Beløp','Belopp']),fx:col(['Vekslingskurs','Växlingskurs']),pf:col(['Portefølje','Depå','Depot']),text:col(['Transaksjonstekst','Transaktionstext'])};
    const amtCur=c.amt>=0&&norm(headers[c.amt+1])==='valuta'?c.amt+1:-1;
    for(const r of data){const typ=classifyType(r[c.type]);const date=toISODate(r[c.date]);if(!date){continue;}
      if(!typ){const k=String(r[c.type]||'?').trim();skipped[k]=(skipped[k]||0)+1;continue;}
      const amount=parseNum(r[c.amt]);const qty=Math.abs(parseNum(r[c.qty]));const price=parseNum(r[c.price]);let fx=c.fx>=0?parseNum(r[c.fx]):NaN;
      out.push({extId:'nn:'+(r[c.id]||[date,r[c.type],r[c.sym],r[c.qty],r[c.amt]].join('|')),type:typ,date,symbol:(r[c.sym]||'').trim(),isin:(c.isin>=0?r[c.isin]:'').trim(),qty,price,
        amountNok:amount,amountCur:amtCur>=0?(r[amtCur]||'').trim().toUpperCase():'NOK',fx,group:c.pf>=0?String(r[c.pf]||'').trim():'',raw:r[c.type]});}
  }
  else if(fmt==='kraken'){
    const c={id:col(['txid']),pair:col(['pair']),time:col(['time']),type:col(['type']),price:col(['price']),cost:col(['cost']),fee:col(['fee']),vol:col(['vol'])};
    for(const r of data){const [base,quote]=splitPair(r[c.pair]);const date=toISODate(r[c.time]);const typ=classifyType(r[c.type]);if(!date||!typ){skipped[r[c.type]||'?']=(skipped[r[c.type]||'?']||0)+1;continue;}
      out.push({extId:'kr:'+r[c.id],type:typ,date,time:(String(r[c.time]||'').match(/[ T](\d{2}:\d{2})/)||[])[1]||'',symbol:base,qty:Math.abs(parseNum(r[c.vol])),price:parseNum(r[c.price]),feeCur:parseNum(r[c.fee])||0,quote,crypto:true,group:''});}
  }
  else{ // generic with mapping
    for(const r of data){const g=k=>map[k]>=0?r[map[k]]:'';const date=toISODate(g('date'));if(!date)continue;
      let typ=map.type>=0?classifyType(g('type')):'buy';if(!typ){skipped[g('type')||'?']=(skipped[g('type')||'?']||0)+1;continue;}
      const qtyRaw=parseNum(g('qty'));if(map.type<0&&qtyRaw<0)typ='sell';
      out.push({extId:'gen:'+[date,typ,g('symbol'),g('qty'),g('price')].join('|'),type:typ,date,symbol:String(g('symbol')).trim(),qty:Math.abs(qtyRaw),price:parseNum(g('price')),
        currency:String(g('currency')||'').trim().toUpperCase(),fx:parseNum(g('fx')),feeNok:parseNum(g('fee'))||0,amountNok:parseNum(g('total')),group:''});}
  }
  return {records:out,skipped};
}
function guessCurrency(rec,existing){
  if(existing)return existing.currency;if(rec.quote)return rec.quote;if(rec.currency&&ASSET_CCYS.includes(rec.currency))return rec.currency;
  const isin=(rec.isin||'').toUpperCase();if(/^(US|CA)/.test(isin))return 'USD';if(/^NO/.test(isin))return 'NOK';
  if(rec.qty>0&&rec.price>0&&Math.abs(rec.amountNok)>0){const f=Math.abs(rec.amountNok)/(rec.qty*rec.price);if(f>0.97&&f<1.03)return 'NOK';}
  return 'EUR';}
function guessClass(rec,cur){if(rec.crypto)return 'crypto';const n=(rec.symbol||'')+' '+(rec.isin||'');if(/ETF|UCITS|INDEX|FUND|FOND|TRACKER/i.test(n)||/^(IE|LU)/.test(rec.isin||''))return 'etf';return 'stock';}

const IMP={};
function importSheet(){
  openSheet('Import transactions',`<div class="form">
   <div class="field"><label for="impFile">CSV file</label><input type="file" id="impFile" accept=".csv,.txt,.tsv,text/csv,text/plain"><div class="hint">Nordnet: Transaksjoner og notaer → Eksporter. Kraken: History → Export → Trades.</div></div>
   <details><summary class="small muted">Or paste the file contents</summary><div class="field" style="margin-top:8px"><textarea id="impPaste" placeholder="Paste CSV text"></textarea><button type="button" class="btn sm" id="impUsePaste" style="margin-top:6px">Use pasted text</button></div></details>
   <div id="impStep"></div></div>`,()=>{
    fv('impFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const buf=await f.arrayBuffer();startImport(decodeBuffer(buf),f.name);}catch(x){fv('impStep').innerHTML='<div class="err">Couldn\'t read that file.</div>';}};
    fv('impUsePaste').onclick=()=>startImport(fv('impPaste').value,'pasted text');
  });
}
function startImport(text,name){
  const rows=parseCSV(text||'');const box=fv('impStep');
  if(rows.length<2){box.innerHTML='<div class="err">No rows found. Check that the file is a CSV export.</div>';return;}
  const fmt=detectFormat(rows[0]);IMP.rows=rows;IMP.fmt=fmt;IMP.name=name;
  if(fmt==='krakenledger'){box.innerHTML='<div class="err">This is a Kraken ledger file. Export <b>Trades</b> instead (History → Export → Trades).</div>';return;}
  if(fmt==='generic')return mappingStep(rows);
  previewStep();
}
function mappingStep(rows){
  const h=rows[0];const opt=(sel)=>`<option value="-1">—</option>`+h.map((x,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(x||('Column '+(i+1)))}</option>`).join('');
  const guess={date:findCol(h,['date','dato','tradedate','handelsdag','time']),type:findCol(h,['type','side','action','transaksjonstype']),symbol:findCol(h,['symbol','ticker','instrument','security','verdipapir','name']),qty:findCol(h,['quantity','qty','shares','units','antall','amount']),price:findCol(h,['price','kurs','unitprice']),currency:findCol(h,['currency','valuta','ccy']),fx:findCol(h,['fx','exchangerate','vekslingskurs','rate']),fee:findCol(h,['fee','commission','kurtasje','courtage']),total:findCol(h,['totalnok','total','belop','netamount'])};
  const fields=[['date','Date *'],['type','Buy / sell'],['symbol','Ticker *'],['qty','Quantity *'],['price','Price per unit *'],['currency','Currency'],['fx','NOK per unit of currency'],['fee','Fee (NOK)'],['total','Total in NOK']];
  fv('impStep').innerHTML=`<div class="note">We didn't recognise this broker. Match the columns below.</div><div class="grid2">${fields.map(([k,l])=>`<div class="field"><label for="map_${k}">${l}</label><select id="map_${k}">${opt(guess[k])}</select></div>`).join('')}</div><button class="btn primary sm" id="mapGo">Continue</button><div class="err" id="mapErr"></div>`;
  fv('mapGo').onclick=()=>{const map={};for(const [k] of fields)map[k]=+fv('map_'+k).value;if(map.date<0||map.symbol<0||map.qty<0||map.price<0){fv('mapErr').textContent='Date, ticker, quantity and price are needed.';return;}IMP.map=map;previewStep();};
}
function previewStep(){
  const {records,skipped}=buildRecords(IMP.fmt,IMP.rows,IMP.map||{});IMP.records=records;
  const existingIds=new Set(S.txs.map(t=>t.extId).filter(Boolean));
  /* trades you already added by hand are matched instead of imported twice */
  const manual=S.demo?[]:S.txs.filter(t=>!t.extId&&t.assetId);const used=new Set();IMP.matched=[];
  const assetOf=r=>S.assets.find(a=>(r.isin&&a.isin===r.isin)||(r.symbol&&a.symbol.toUpperCase()===r.symbol.toUpperCase()));
  const manualHit=r=>{const a=assetOf(r);if(!a)return null;const d=dn(r.date);
    return manual.find(t=>!used.has(t.id)&&t.assetId===a.id&&Math.abs(dn(t.date)-d)<=3&&(
      ((r.type==='buy'||r.type==='sell')&&t.type===r.type&&Math.abs((t.qty||0)-r.qty)<=Math.max(1e-6,r.qty*1e-4))||
      ((r.type==='dividend')&&t.type==='dividend'&&Math.abs((t.amount||0)-r.amountNok)<1)));};
  const fresh=[];for(const r of records){if(existingIds.has(r.extId)){if(r.time){const ex=S.txs.find(t=>t.extId===r.extId);if(ex&&!ex.time){ex.time=r.time;IMP.timesAdded=(IMP.timesAdded||0)+1;}}continue;}const hit=manualHit(r);if(hit){used.add(hit.id);IMP.matched.push([hit.id,r.extId]);continue;}fresh.push(r);}IMP.fresh=fresh;
  const groups=[...new Set(fresh.map(r=>r.group))];
  const syms=new Map();for(const r of fresh){if(!['buy','sell','dividend','tax'].includes(r.type)||!r.symbol)continue;const key=(r.isin||r.symbol).toUpperCase();if(syms.has(key))continue;
    const ex=(S.demo?[]:S.assets).find(a=>(r.isin&&a.isin===r.isin)||a.symbol.toUpperCase()===r.symbol.toUpperCase());const cur=guessCurrency(r,ex);
    syms.set(key,{key,rec:r,ex,cur,cls:ex?ex.cls:guessClass(r,cur)});}
  IMP.syms=syms;
  const counts={};for(const r of fresh)counts[r.type]=(counts[r.type]||0)+1;const dup=records.length-fresh.length-IMP.matched.length;
  const label={buy:'buys',sell:'sells',dividend:'dividends',tax:'withholding tax',deposit:'deposits',withdraw:'withdrawals',interest:'interest',fee:'fees'};
  const defAcc=IMP.fmt==='kraken'?(S.accounts.find(a=>a.kind==='crypto')||S.accounts[0]).id:(S.accounts.find(a=>a.kind==='aksje')||S.accounts[0]).id;
  const hasCash=fresh.some(r=>['deposit','withdraw','interest','fee'].includes(r.type));
  fv('impStep').innerHTML=`<div class="card stack" style="background:var(--surface2)"><div><b>${esc(IMP.fmt==='nordnet'?'Nordnet':IMP.fmt==='kraken'?'Kraken trades':'CSV')}</b> · ${esc(IMP.name)}</div>
    <div class="small">${Object.entries(counts).map(([k,n])=>`${n} ${label[k]||k}`).join(' · ')||'Nothing new'}${dup?` · ${dup} already imported`:''}${IMP.matched.length?` · ${IMP.matched.length} matched trades you added by hand`:''}</div>
    ${Object.keys(skipped).length?`<div class="small muted">Skipped (not used): ${Object.entries(skipped).slice(0,8).map(([k,n])=>`${esc(k)} ×${n}`).join(', ')}</div>`:''}</div>
   <h2 class="sec" style="margin-top:14px">Which account?</h2>
   ${groups.map((g,i)=>{const mem=(S.importMap||{})[IMP.fmt+':'+g];return `<div class="field"><label for="grp_${i}">${g?'Nordnet account '+esc(g):'Import into'}${mem?' <span class="muted">· remembered</span>':''}</label><select id="grp_${i}">${accOptions(mem&&accById(mem)?mem:defAcc)}</select></div>`;}).join('')}
   ${hasCash?`<label class="switch" style="margin-top:6px"><input type="checkbox" id="impCash"><span>Also import deposits, withdrawals and interest, and track the cash in these accounts. Only turn on if the file has your full history.</span></label>`:''}
   ${syms.size?`<h2 class="sec">Holdings in this file</h2><div class="small muted expl" style="margin-bottom:6px">Check the currency each one trades in. New ones are added.</div>
   <div class="list">${[...syms.values()].map((s,i)=>`<div class="item" style="flex-wrap:wrap;cursor:default"><div class="mid" style="min-width:120px"><div class="t1">${esc(s.rec.symbol)}</div><div class="t2">${s.ex?'Already in Lacag':'New'}${s.rec.isin?' · '+esc(s.rec.isin):''}</div></div>
     <select id="sym_cur_${i}" ${s.ex?'disabled':''} class="mini">${ASSET_CCYS.map(c=>`<option ${c===s.cur?'selected':''}>${c}</option>`).join('')}</select>
     <select id="sym_cls_${i}" ${s.ex?'disabled':''} class="mini">${['stock','etf','crypto'].map(c=>`<option value="${c}" ${c===s.cls?'selected':''}>${CLASS_LABEL[c]}</option>`).join('')}</select></div>`).join('')}</div>`:''}
   <div class="err" id="impErr"></div><button class="btn primary block" id="impGo" style="margin-top:12px">Import ${fresh.length} transactions</button>`;
  IMP.groups=groups;
  fv('impGo').onclick=doImport;
}
function doImport(){
  const fresh=IMP.fresh;if(!fresh.length&&!(IMP.matched||[]).length){closeSheet();toast('Nothing new to import');return;}
  const withCash=fv('impCash')?fv('impCash').checked:false;
  const accFor={};IMP.groups.forEach((g,i)=>accFor[g]=fv('grp_'+i).value);
  const matched=IMP.matched||[];
  leaveDemo();
  const symList=[...IMP.syms.values()];const assetFor={};
  symList.forEach((s,i)=>{let a=S.assets.find(x=>(s.rec.isin&&x.isin===s.rec.isin)||x.symbol.toUpperCase()===s.rec.symbol.toUpperCase());
    if(!a){const cur=fv('sym_cur_'+i).value,cls=fv('sym_cls_'+i).value;const pre=PRESETS.find(p=>p.symbol===s.rec.symbol.toUpperCase());
      a={id:uid(),symbol:s.rec.symbol.toUpperCase().slice(0,16),name:pre?pre.name:s.rec.symbol,cls,currency:cur,dataSymbol:pre?pre.dataSymbol:s.rec.symbol.toUpperCase(),isin:s.rec.isin||'',
        sector:pre?pre.sector:cls==='crypto'?'Crypto':'Other',region:pre?pre.region:cls==='crypto'?'Global (no country)':/^(US|CA)/.test(s.rec.isin||'')||cur==='USD'?'North America':'Europe (ex-Norway)',look:pre&&pre.look?JSON.parse(JSON.stringify(pre.look)):(cls==='etf'?null:null)};
      S.assets.push(a);}
    assetFor[s.key]=a;});
  let n=0,warn=0;const touched=new Set();
  for(const r of fresh){const accountId=accFor[r.group]||S.accounts[0].id;const acc=accById(accountId);
    if(['deposit','withdraw','interest','fee'].includes(r.type)){if(!withCash)continue;const amt=Math.abs(r.amountNok||0);if(!amt)continue;touched.add(accountId);
      S.txs.push({id:uid(),extId:r.extId,type:r.type==='fee'?'interest':r.type,accountId,date:r.date,amount:r.type==='fee'||((r.type==='interest')&&r.amountNok<0)?-amt:amt});n++;continue;}
    const a=assetFor[(r.isin||r.symbol).toUpperCase()];if(!a)continue;
    if(r.type==='dividend'||r.type==='tax'){let amt=r.amountNok;if(!isFinite(amt))continue;if(r.type==='tax')amt=-Math.abs(amt);S.txs.push({id:uid(),extId:r.extId,type:'dividend',assetId:a.id,accountId,date:r.date,amount:amt});n++;continue;}
    if(!(r.qty>0&&r.price>0)){warn++;continue;}
    let fx,fee=0;const gross=r.qty*r.price;
    if(a.currency==='NOK')fx=1;
    else if(r.crypto){fx=fxForDate(a.currency,r.date);}
    else if(isFinite(r.fx)&&r.fx>0&&(r.fx>0.5||a.currency==='SEK'))fx=r.fx;
    else if(isFinite(r.amountNok)&&Math.abs(r.amountNok)>0)fx=Math.abs(r.amountNok)/gross;
    else fx=fxForDate(a.currency,r.date);
    if(r.crypto)fee=(r.feeCur||0)*fx;
    else if(isFinite(r.feeNok)&&r.feeNok)fee=r.feeNok;
    else if(isFinite(r.amountNok)&&Math.abs(r.amountNok)>0){const tot=Math.abs(r.amountNok);fee=Math.max(0,r.type==='buy'?tot-gross*fx:gross*fx-tot);if(fee>gross*fx*0.05){fee=0;fx=tot/gross;}}
    S.txs.push({id:uid(),extId:r.extId,type:r.type,assetId:a.id,accountId,date:r.date,...(r.time?{time:r.time}:{}),qty:r.qty,price:r.price,fx:+fx.toFixed(6),fee:+fee.toFixed(2)});n++;}
  if(withCash)for(const id of touched){const a=accById(id);if(a)a.tracksCash=true;}
  S.importMap=S.importMap||{};IMP.groups.forEach(g=>{S.importMap[IMP.fmt+':'+g]=accFor[g];});
  for(const [id,ext] of matched){const t=S.txs.find(x=>x.id===id);if(t)t.extId=ext;}
  pruneAssets();Store.save();closeSheet();render();toast(`Imported ${n} transactions${matched.length?` · ${matched.length} matched`:''}${warn?` · ${warn} skipped`:''}`);refresh(false);
}

function targetSheet(){const b=B();openSheet('Savings target',`<form class="form" id="btForm"><div class="field"><label for="btPct">Save at least this % of take-home pay</label><input id="btPct" inputmode="decimal" value="${inputNum(b.savingsTargetPct,1)}" placeholder="20"><div class="hint">Counts savings lines plus what's left over. Leave empty for no target.</div></div><button class="btn primary block" type="submit">Save</button></form>`,()=>{
