/* ---------- 3) + 4) tax (Norway) ---------- */
/* Shares/funds: gains & dividends × 1.72 × 22 % = 37.84 %. Crypto: 22 %. Lots matched FIFO, as the Tax Administration requires.
   Skjermingsrente (published each January): 2023 3.2 %, 2024 3.9 %, 2025 3.6 %. The current year uses last year's rate as an estimate. */
const NOTAX={get share(){return TAX.shares;},get crypto(){return taxRules().crypto;},get skj(){return taxRules().skj;}};
/* a year without a published rate uses the latest known rate (marked as an estimate); years before the table use 0 */
function skjYears(){return Object.keys(NOTAX.skj).map(Number).filter(y=>isFinite(y)).sort((a,b)=>a-b);}
const skjRate=y=>{const t=NOTAX.skj;if(t[y]!=null)return +t[y];const ys=skjYears();if(!ys.length||y<ys[0])return 0;return +t[ys[ys.length-1]];};
const skjEstimate=y=>NOTAX.skj[y]==null&&skjYears().length&&y>skjYears()[0];
function taxKind(t,a){const acc=accById(t.accountId);if(a&&a.cls==='crypto')return 'crypto';if(acc&&acc.kind==='ask')return 'ask';if(acc&&acc.kind==='ips')return 'ips';return 'share';}
function txFx(t,a){if(!a||a.currency==='NOK')return 1;return t.fx>0?t.fx:fxForDate(a.currency,t.date);}
/* one pass through all trades: FIFO lots per asset and tax group, realised gains per sale, yearly skjerming, dividends */
function taxModel(){if(taxModel.v===VERSION&&taxModel.m)return taxModel.m;
  const lots={},sales=[],divs=[],skjLog={};const today=localToday();const ty=+today.slice(0,4);
  const txs=S.txs.filter(t=>t.assetId).slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(TYPE_ORDER[x.type]||0)-(TYPE_ORDER[y.type]||0));
  const firstY=txs.length?+txs[0].date.slice(0,4):ty;let ti=0;
  const yearEnd=y=>{for(const k in lots){if(!k.endsWith('|share'))continue;const r=skjRate(y);if(!r)continue;for(const L of lots[k])if(L.q>1e-12){const add=(L.cost+L.sk)*r;L.sk+=add;skjLog[y]=(skjLog[y]||0)+add;L.skY=L.skY||{};L.skY[y]=(L.skY[y]||0)+add;}}};
  for(let y=firstY;y<=ty;y++){
    for(;ti<txs.length&&+txs[ti].date.slice(0,4)===y;ti++){const t=txs[ti];const a=assetById(t.assetId);if(!a)continue;const g=taxKind(t,a);const key=a.id+'|'+g;const L=lots[key]=lots[key]||[];
      if(t.type==='buy'){const fx=txFx(t,a);L.push({q:t.qty,cost:t.qty*t.price*fx+(t.fee||0),sk:0,date:t.date});}
      else if(t.type==='split'&&t.ratio>0){for(const l of L)l.q*=t.ratio;}
      else if(t.type==='sell'){const fx=txFx(t,a);let left=t.qty,cost=0,sk=0;const proceeds=t.qty*t.price*fx-(t.fee||0);
        while(left>1e-12&&L.length){const l=L[0];const take=Math.min(left,l.q);const part=take/l.q;cost+=l.cost*part;sk+=l.sk*part;l.cost-=l.cost*part;l.sk-=l.sk*part;l.q-=take;left-=take;if(l.q<=1e-12)L.shift();}
        const gain=proceeds-cost;const skUsed=g==='share'&&gain>0?Math.min(gain,sk):0;
        sales.push({y,date:t.date,a,g,qty:t.qty,proceeds,cost,gain,skUsed,short:left>1e-9,acc:accById(t.accountId)});}
      else if(t.type==='dividend'){divs.push({y,date:t.date,a,g,amount:t.amount||0});}}
    if(y<ty)yearEnd(y);}
  /* dividends this year use that year's skjerming on the same holding (first), shown as an estimate */
  const m={lots,sales,divs,skjLog,ty};taxModel.v=VERSION;taxModel.m=m;return m;}
function taxYear(y){const T=taxModel();const by={share:{gain:0,loss:0,sk:0,divGross:0,divWh:0},crypto:{gain:0,loss:0},ask:{gain:0,loss:0}};
  for(const s of T.sales.filter(s=>s.y===y)){const b=by[s.g==='ips'?'ask':s.g];if(!b)continue;if(s.gain>=0)b.gain+=s.gain;else b.loss+=s.gain;if(s.g==='share')b.sk+=s.skUsed;}
  for(const d of T.divs.filter(d=>d.y===y&&d.g==='share')){if(d.amount>=0)by.share.divGross+=d.amount;else by.share.divWh+=-d.amount;}
  const sh=by.share;const skDiv=Math.min(sh.divGross,(T.skjLog[y]||0)*0);/* dividend skjerming kept at 0: needs per-share data from the broker */
  const net=sh.gain+sh.loss-sh.sk;const shareTax=net*NOTAX.share;const divTax=Math.max(0,(sh.divGross-skDiv)*NOTAX.share-sh.divWh);
  const cr=by.crypto;const crNet=cr.gain+cr.loss;
  return {y,share:Object.assign({},sh,{net,tax:shareTax,divTax}),crypto:Object.assign({},cr,{net:crNet,tax:crNet*NOTAX.crypto}),ask:by.ask,sales:T.sales.filter(s=>s.y===y)};}
function askInnskudd(){if(S.askIn!=null&&S.askIn!=='')return {v:+S.askIn,src:'you'};const ids=S.accounts.filter(a=>a.kind==='ask').map(a=>a.id);let v=0;
  const tracks=S.accounts.some(a=>a.kind==='ask'&&a.tracksCash);
  for(const t of S.txs){if(!ids.includes(t.accountId)&&!ids.includes(t.toAccountId))continue;
    if(tracks){if(t.type==='deposit'&&ids.includes(t.accountId))v+=t.amount;else if(t.type==='withdraw'&&ids.includes(t.accountId))v-=t.amount;else if(t.type==='transfer'){if(ids.includes(t.toAccountId)&&!ids.includes(t.accountId))v+=t.amount;if(ids.includes(t.accountId)&&!ids.includes(t.toAccountId))v-=t.amount;}}
    else{const a=assetById(t.assetId);if(!a)continue;const fx=txFx(t,a);if(t.type==='buy')v+=t.qty*t.price*fx+(t.fee||0);}}
  return {v,src:tracks?'cash':'buys'};}
function sellTodayHTML(M){const T=taxModel();const groups={share:{v:0,cost:0,sk:0},crypto:{v:0,cost:0},ask:{v:0,cost:0}};

  const sh=groups.share,cr=groups.crypto,as=groups.ask;

  return `<div class="card stack"><div class="sumgrid"><div><div class="k">Worth now</div><div class="v">${F(conv(M,before))}</div></div><div><div class="k">After tax if sold today</div><div class="v">${F(conv(M,after))}</div></div></div>
   ${row('Aksjekonto · shares',sh.v,shGain,shTax,sh.sk>0?' · skjerming '+F(conv(M,sh.sk)):'')}${row('Crypto',cr.v,crGain,crTax)}
   ${as.v>0?`<div class="tx-row"><div><div class="t1">ASK</div><div class="small muted">Value ${F(conv(M,as.v))} · tax-free to take out <b class="amber-v">${F(conv(M,Math.min(as.v,inn.v)))}</b></div></div><div class="num">${asTax>0?'Tax '+F(conv(M,asTax)):'No tax'}</div></div>`:''}
   ${cash>0?`<div class="tx-row"><div><div class="t1">Cash</div></div><div class="num">${F(conv(M,cash))}</div></div>`:''}
   <div class="hint">ASK: you can take out what you put in (${inn.src==='you'?'your figure':inn.src==='cash'?'from your deposits':'estimated from your buys'}: ${F(conv(M,inn.v))}) without tax. Set the exact figure from Nordnet below.</div>
   <div class="row-between"><input class="fx-in num" style="width:150px" inputmode="decimal" id="askIn" placeholder="ASK innskudd" value="${S.askIn!=null&&S.askIn!==''?inputNum(+S.askIn,0):''}"><button class="btn sm" data-act="saveaskin">Save</button></div></div>`;}

/* average monthly spending and saving from the Budget, and what actually reached the portfolio */
function avgSpend(){let s=0;for(let m=1;m<=12;m++)s+=budgetMonth(m).spent;return s/12;}
function avgPlannedSave(){let s=0;for(let m=1;m<=12;m++)s+=budgetMonth(m).saved;return s/12;}
function avgActualSave(M){const now=localToday().slice(0,7);let s=0;for(let k=1;k<=12;k++){const ym=shiftYM(now,-k);s+=contributions(M,dn(ym+'-01'),dn(shiftYM(ym,1)+'-01'));}return s/12;}
function monthlySaving(M){const a=M?avgActualSave(M):0;return a>0?{v:a,src:'what you actually added the last 12 months'}:{v:avgPlannedSave(),src:'your budget'};}
const realR=()=>{const r=+((S.plan&&S.plan.realReturn)||0.04);return isFinite(r)?r:0.04;};
function monthsTo(start,target,save,r){const rm=Math.pow(1+r,1/12)-1;let v=start;for(let i=0;i<=720;i++){if(v>=target)return i;v=v*(1+rm)+save;}return null;}
function futureValue(start,save,r,years){const rm=Math.pow(1+r,1/12)-1;let v=start;for(let i=0;i<Math.round(years*12);i++)v=v*(1+rm)+save;return v;}
function ageNow(){const by=S.plan&&S.plan.birthYear;return by?(+localToday().slice(0,4))-by:null;}

  const mo=monthsTo(now,target,sv.v,realR());const d=new Date();if(mo!=null)d.setMonth(d.getMonth()+mo);
  return {spend,target,now,p:Math.min(1,now/target),months:now/spend,save:sv,mo,year:mo!=null?d.getFullYear():null,age:mo!=null&&ageNow()!=null?ageNow()+Math.round(mo/12):null};}

  for(const k of ['range','mode','alloc','hsort','sub','asub','psub','brk','krange'])if(d[k]){UI[k]=d[k];saveUI();softRender();return;}
  if(d.cbm){const L=chartBms();const i=L.indexOf(d.cbm);if(i>=0)L.splice(i,1);else L.push(d.cbm);UI.chartBms=L;saveUI();softRender();if(!NET.blocked)fetchBenchmarks();return;}
  if(d.bm){const i=UI.bms.indexOf(d.bm);if(i>=0)UI.bms.splice(i,1);else UI.bms.push(d.bm);saveUI();softRender();if(!NET.blocked)fetchBenchmarks();return;}
  if(d.updown){S.settings.updown=d.updown;applyUpdown();if(S.demo){lsSet('lq_state',S);VERSION++;}else Store.save();softRender();return;}
  if(d.pmenu){posMenu(d.pmenu);return;}
  if(d.prange){UI.prange=d.prange;saveUI();softRender();return;}
  if(d.psort){if(UI.psort===d.psort)UI.pdir=-(UI.pdir||-1);else{UI.psort=d.psort;UI.pdir=d.psort==='title'?1:-1;}saveUI();softRender();return;}
  if(d.rview){UI.rview=d.rview;saveUI();softRender();return;}
  if(d.rper){UI.rper=d.rper;saveUI();softRender();return;}
  if(d.asset){assetSheet(d.asset);return;}
  if(d.tx){const t=S.txs.find(x=>x.id===d.tx);if(S.demo){toast('Example entries can\'t be edited');return;}if(!t)return;if(['buy','sell','dividend','split'].includes(t.type))txSheet(t);else cashSheet(t);return;}
  if(d.cashacc){if(S.demo){toast('Example entries can\'t be edited');return;}cashSheet(null,d.cashacc);return;}
  if(d.editacc){accountSheet(d.editacc);return;}
  if(d.editpf){if(S.demo&&d.editpf==='__new'){toast('Start with your own data first');return;}portfolioSheet(d.editpf);return;}
  if(d.pick){UI.pid=d.pick;saveUI();closeSheet();VERSION++;render();return;}
  if(d.goal){if(S.demo){toast('Example goals can\'t be edited');return;}goalSheet(d.goal);return;}
  if(d.event){if(S.demo){toast('Example events can\'t be edited');return;}eventSheet(d.event);return;}
  const act=d.act;
  switch(act){
    case 'close':closeSheet();return;
    case 'add':addMenu();return;
    case 'trade':txSheet(null);return;
    case 'dividendform':txSheet(null,{type:'dividend'});return;
    case 'cash':cashSheet(null);return;
    case 'import':importSheet();return;
    case 'switch':switchSheet();return;
    case 'goal':if(S.demo){toast('Start with your own data to add goals');return;}goalSheet(null);return;
    case 'event':if(S.demo){toast('Start with your own data to add events');return;}eventSheet(null);return;
    case 'ask':runAsk();return;
    case 'backupfile':backupToFile();return;
    case 'backuplater':UI.backupSnooze=Date.now()+7*DAYMS;saveUI();softRender();return;
    case 'taxcsv':taxCSV();return;
    case 'saveaskin':{const v=$('#askIn').value.trim();S.askIn=v===''?null:parseNum(v);if(S.demo){lsSet('lq_state',S);}else Store.save();softRender();toast('Saved');return;}
    case 'chartcfg':chartCfgSheet();return;
    case 'events':UI.events=!UI.events;saveUI();softRender();return;
    case 'priv':UI.priv=!UI.priv;saveUI();softRender();toast(UI.priv?'Amounts hidden':'Amounts shown');return;
    case 'refresh':refresh(true);return;
    case 'cleardemo':{const bud=S.budget;S=blankState();if(bud)S.budget=bud;}UI.pid='nabad';saveUI();Store.save();render();return;
    case 'loaddemo':if(S.txs.length&&!S.demo&&!armed(el,'This replaces your data. Tap again'))return;{const bud=S.budget;S=demoState();if(bud)S.budget=bud;}UI.pid='nabad';saveUI();VERSION++;lsSet('lq_state',S);render();refresh(false);toast('Example portfolio loaded');return;
    case 'wipe':if(!armed(el,'Tap again to delete everything'))return;S=blankState();UI.pid='nabad';saveUI();Store.save();render();toast('All data deleted');return;
    case 'savekey':S.settings.tdKey=$('#tdKey').value.trim();for(const k in C.err)delete C.err[k];Store.save();toast(S.settings.tdKey?'Key saved':'Key removed');refresh(true);return;
    case 'savehelper':{let u=$('#helperUrl').value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;S.settings.helper=u;if(S.demo){lsSet('lq_state',S);}else Store.save();toast(u?'Helper saved':'Helper removed');if(u)refresh(true);softRender();return;}
    case 'testhelper':{let u=$('#helperUrl').value.trim();if(!u){toast('Paste your helper address first');return;}if(!/^https?:\/\//i.test(u))u='https://'+u;const keep=S.settings.helper;S.settings.helper=u;
      try{const j=await helperGet('WEBN.DE','5d');toast(j.price>0?`Works: WEBN ${money(j.price,j.currency||'EUR')}`:'Connected, but no WEBN price yet');}catch(e){toast('Helper problem: '+String(e.message||e).slice(0,80));}finally{S.settings.helper=keep;}return;}
    case 'savefx':{for(const c of CCYS){if(c==='NOK')continue;const f=$('#fx_'+c);if(!f)continue;const x=parseNum(f.value);if(x>0)S.fx[c]=x;}if(S.demo){lsSet('lq_state',S);VERSION++;}else Store.save();toast('Rates saved');softRender();return;}
    case 'copybackup':{const txt=JSON.stringify({app:'lacag',v:2,data:S});try{await navigator.clipboard.writeText(txt);markBackup();toast('Backup copied');}catch(err){const box=$('#importBox');box.value=txt;box.select();toast('Select all and copy the text');}return;}
    case 'savebackup':markBackup();await saveFile('lacag-backup-'+localToday()+'.json',JSON.stringify({app:'lacag',v:2,data:S},null,1),'application/json');return;
    case 'restore':{const err=$('#importErr');err.textContent='';let j;try{j=JSON.parse($('#importBox').value);}catch(x){err.textContent='That text isn\'t a backup. Copy the whole backup and try again.';return;}
      const data=migrate(j&&j.data?j.data:j);if(!data||!Array.isArray(data.txs)){err.textContent='No transactions found in that backup.';return;}
      if(!armed(el,`Replace with ${data.txs.length} entries? Tap again`))return;S=Object.assign(data,{demo:false});UI.pid=(S.portfolios[0]||{}).id||'nabad';saveUI();Store.save();render();toast('Backup restored');refresh(false);return;}
    case 'dlapp':try{const r=await fetch('lacag.html');if(!r.ok)throw 0;await saveFile('lacag.html',await r.text(),'text/html');}catch(x){toast('Download isn\'t available here');}return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('ccysel')){UI.ccy=t.value;PAGE_CCY[UI.tab]=t.value;saveUI();softRender();return;}
  if(t.dataset&&t.dataset.evtoggle){const ev=S.plan.events.find(x=>x.id===t.dataset.evtoggle);if(ev){ev.on=t.checked;if(S.demo){VERSION++;lsSet('lq_state',S);}else Store.save();softRender();}return;}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='planForm'){e.preventDefault();const p=S.plan;const n=(id,f=1)=>{const v=parseNum(fv(id).value);return isFinite(v)?v*f:null;};
    const by=n('pBirth'),ra=n('pRet'),la=n('pLife');if(by&&by>1900&&by<2020)p.birthYear=Math.round(by);if(ra&&ra>=50&&ra<=80)p.retireAge=ra;if(la&&la>p.retireAge&&la<=110)p.lifeAge=la;
    const w=n('pWant'),nav=n('pNav'),oth=n('pOther'),pt=n('pPTax',0.01),rr=n('pRet2',0.01),sv=n('pSave');
    if(w!=null)p.desiredMonthly=w;if(nav!=null)p.navYearly=nav;if(oth!=null)p.otherYearly=oth;if(pt!=null&&pt>=0&&pt<0.8)p.pensionTax=pt;if(rr!=null&&rr>-0.05&&rr<0.15)p.realReturn=rr;if(sv!=null)p.monthlySaving=sv;
    if(S.demo){VERSION++;lsSet('lq_state',S);}else Store.save();softRender();toast('Plan updated');return;}
  if(e.target.id==='bpForm'){e.preventDefault();const a=parseNum(fv('bpAmt').value);S.buyPlan={freq:fv('bpFreq').value,amount:a>0?a:0};if(S.demo){VERSION++;lsSet('lq_state',S);}else Store.save();softRender();toast('Buying plan saved');return;}
});
async function saveFile(name,txt,type){
  try{if(IN_CLAUDE){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:txt});return;}}}catch(err){if(err&&err.code==='declined')return;}
  try{const url=URL.createObjectURL(new Blob([txt],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}catch(err){toast('Saving files isn\'t available here. Use Copy backup.');}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-NET.lastOk>5*60000)refresh(false);});

/* ================= boot ================= */
function applyUpdown(){if((S.settings&&S.settings.updown)==='cvd')document.documentElement.dataset.updown='cvd';else delete document.documentElement.dataset.updown;}
const FIRST_VIEW={holdings:['sub','positions'],analysis:['asub','performance'],plan:['psub','budget'],settings:['sset','']};
function firstView(tab){const f=FIRST_VIEW[tab];if(f)UI[f[0]]=f[1];}
function boot(){
  $$('[data-icon]').forEach(el=>el.innerHTML=ICON[el.dataset.icon]);
  const local=Store.loadLocal();S=local||demoState();if(!local)lsSet('lq_state',S);
  for(const a of S.assets||[])if(a.symbol==='WEBN'&&(!a.dataSymbol||a.dataSymbol==='WEBN')){a.dataSymbol='WEBN:XETR';if(C.err)delete C.err[a.id];} // WEBN prices come from Xetra
  for(const a of S.accounts||[])if(/^KLP Likviditet$/i.test(a.broker||''))a.broker=''; // that was only an example
  if(UI.pid!=='__all'&&!S.portfolios.some(p=>p.id===UI.pid))UI.pid=(S.portfolios[0]||{}).id;
  if(!CCYS.includes(UI.ccy))UI.ccy='NOK';if(!['class','account','currency'].includes(UI.alloc))UI.alloc='class';if(!['performance','breakdown','tax'].includes(UI.asub))UI.asub='performance';UI.bms=(UI.bms||[]).filter(id=>BENCHMARKS.some(b=>b.id===id));if(!RANGES.includes(UI.prange))UI.prange='MAX';
  if(UI.privStart)UI.priv=true;
  const sp=UI.startPage||'overview';if(sp!=='last'){UI.tab=sp;firstView(sp);}
  applyUpdown();VERSION++;render();
  Store.connect();initAsk();refresh(false);
  setInterval(()=>{if(!document.hidden&&!NET.blocked)refresh(false);},15*60000);
  let lastDay=localToday();setInterval(()=>{if(localToday()!==lastDay){lastDay=localToday();VERSION++;render();}},60000);
}
window.__lacag={taxYear:y=>taxYear(y),dataIssues:()=>dataIssues(),compute:()=>compute(),series:(c)=>series(compute(),c||'NOK'),stats:(k,c)=>{const M=compute();return stats(M,series(M,c||'NOK'),k);},project:()=>project(compute()),get S(){return S;},set S(v){S=v;VERSION++;render();},C,bmCompare,startImport,importSheet};
boot();

})();
</script>
