/* ---------- bank import ---------- */
function bankCols(h){return {date:findCol(h,['bokføringsdato','bokforingsdato','dato','transaksjonsdato','date','bookingdate','utført dato']),
  text:findCol(h,['forklaring','tekst','beskrivelse','tittel','text','description','merchant','navn','mottaker']),
  amount:findCol(h,['beløp','belop','amount','beløp i nok','belopnok']),out:findCol(h,['ut fra konto','utfrakonto','ut','uttak','debit','beløp ut']),in:findCol(h,['inn på konto','innpakonto','inn','innskudd','credit','beløp inn'])};}
function merchantKey(t){return String(t||'').toLowerCase().replace(/\d{2}\.\d{2}(\.\d{2,4})?/g,' ').replace(/[*#]/g,' ').replace(/\b(varekjøp|varekjop|visa|vipps|kortkjøp|nettgiro|avtalegiro|overføring|betaling|kurs:?|nok)\b/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' ');}
function autoCat(text){const t=' '+String(text||'').toLowerCase()+' ';for(const r of B().match){if(r.kw&&t.includes(r.kw.toLowerCase()))return r.cat;}return null;}
function bankImportSheet(){
  openSheet('Import from your bank',`<div class="form"><div class="note">In your online bank, open the account your salary goes to, choose a period and export or download the transactions as <b>CSV</b> (sometimes called "Excel/CSV"). DNB, Sbanken, Nordea, SpareBank 1, Bulder and most others can do this.</div>
   <div class="field"><label for="bkFile">CSV file</label><input type="file" id="bkFile" accept=".csv,.txt,text/csv,text/plain"></div><div id="bkStep"></div></div>`,()=>{
    fv('bkFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;let text;try{text=decodeBuffer(await f.arrayBuffer());}catch(x){fv('bkStep').innerHTML='<div class="err">Couldn\'t read that file.</div>';return;}
      const rows=parseCSV(text);if(rows.length<2){fv('bkStep').innerHTML='<div class="err">No rows found in that file.</div>';return;}
      const cols=bankCols(rows[0]);if(cols.date>=0&&cols.text>=0&&(cols.amount>=0||cols.out>=0||cols.in>=0))return bankPreview(rows,cols);bankMapping(rows,cols);};});
}
function bankMapping(rows,g){const h=rows[0];const opt=s=>`<option value="-1">—</option>`+h.map((x,i)=>`<option value="${i}" ${i===s?'selected':''}>${esc(x||'Column '+(i+1))}</option>`).join('');
  fv('bkStep').innerHTML=`<div class="note">Match the columns in your file.</div><div class="grid2">${[['date','Date *'],['text','Description *'],['amount','Amount (− for money out)'],['out','Money out'],['in','Money in']].map(([k,l])=>`<div class="field"><label for="bm_${k}">${l}</label><select id="bm_${k}">${opt(g[k])}</select></div>`).join('')}</div><button class="btn primary sm" id="bmGo">Continue</button><div class="err" id="bmErr"></div>`;
  fv('bmGo').onclick=()=>{const c={};for(const k of ['date','text','amount','out','in'])c[k]=+fv('bm_'+k).value;if(c.date<0||c.text<0||(c.amount<0&&c.out<0&&c.in<0))return showErr(fv('bmErr'),'Pick date, description and an amount column.');bankPreview(rows,c);};}
function bankPreview(rows,c){const b=B();const have=new Set(b.tx.map(t=>t.key));const fresh=[];let skipped=0;
  for(const r of rows.slice(1)){const date=toISODate(r[c.date]);if(!date){skipped++;continue;}const text=String(r[c.text]||'').trim();
    let a=c.amount>=0?parseNum(r[c.amount]):NaN;if(!isFinite(a)){const o=c.out>=0?parseNum(r[c.out]):NaN,i=c.in>=0?parseNum(r[c.in]):NaN;a=(isFinite(i)?Math.abs(i):0)-(isFinite(o)?Math.abs(o):0);}
    if(!isFinite(a)||a===0){skipped++;continue;}const key=date+'|'+text+'|'+a.toFixed(2);if(have.has(key)){skipped++;continue;}have.add(key);
    fresh.push({id:uid(),date,text,amount:a,cat:a<0?autoCat(text):null,key});}
  const out=fresh.filter(t=>t.amount<0);const sorted=out.filter(t=>t.cat).length;const months=[...new Set(fresh.map(t=>t.date.slice(0,7)))].sort();
  fv('bkStep').innerHTML=`<div class="card stack" style="background:var(--surface2)"><div><b>${fresh.length}</b> new payments${months.length?` · ${ymLabel(months[0])}${months.length>1?' – '+ymLabel(months[months.length-1]):''}`:''}${skipped?` · ${skipped} skipped or already imported`:''}</div>
   <div class="small">${out.length} money out · ${sorted} sorted automatically · ${out.length-sorted} to sort by you</div></div>
   <button class="btn primary block" id="bkGo" style="margin-top:12px">Import ${fresh.length} payments</button>`;
  fv('bkGo').onclick=()=>{b.tx.push(...fresh);b.tx.sort((x,y)=>x.date<y.date?1:-1);if(months.length)UI.bym=months[months.length-1];saveUI();bSave();closeSheet();softRender();toast(`Imported ${fresh.length} payments`);};}
function catOptions(sel){const b=B();return b.groups.map(g=>`<optgroup label="${esc(g.name)}">${b.cats.filter(c=>c.group===g.id).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('')+`<option value="__ignore" ${sel==='__ignore'?'selected':''}>Ignore (transfer between own accounts)</option><option value="__income" ${sel==='__income'?'selected':''}>Income</option>`;}
function txCatSheet(id,queue){const b=B();const t=b.tx.find(x=>x.id===id);if(!t)return;const key=merchantKey(t.text);
  openSheet('Sort payment',`<form class="form" id="txcForm"><div class="card"><div class="row-between"><div><div style="font-weight:600">${esc(t.text)}</div><div class="small muted">${dateLabel(dn(t.date),true)}</div></div><div class="num ${t.amount<0?'':'up'}">${bkr(t.amount,{dec:true,sign:true})}</div></div></div>
   <div class="field"><label for="txcCat">Category</label><select id="txcCat"><option value="">Choose…</option>${catOptions(t.cat)}</select></div>
   ${key?`<label class="switch"><input type="checkbox" id="txcAlways" checked><span>Always sort payments with "<b>${esc(key)}</b>" like this</span></label>`:''}
   <button class="btn primary block" type="submit">Save${queue&&queue.length?' and next':''}</button>${queue&&queue.length?`<div class="small muted" style="text-align:center">${queue.length} more to sort</div>`:''}</form>`,()=>{
    fv('txcForm').onsubmit=e=>{e.preventDefault();const cat=fv('txcCat').value||null;t.cat=cat;
      if(cat&&key&&fv('txcAlways')&&fv('txcAlways').checked){b.match=b.match.filter(r=>r.kw!==key);b.match.unshift({id:uid(),kw:key,cat});for(const x of b.tx)if(!x.cat&&x.amount<0&&(' '+x.text.toLowerCase()+' ').includes(key))x.cat=cat;}
      bSave();const next=(queue||[]).filter(qid=>{const x=b.tx.find(y=>y.id===qid);return x&&!x.cat;});if(next.length)txCatSheet(next[0],next.slice(1));else{closeSheet();softRender();toast('Sorted');}};});}
function txListSheet(onlyUnc){const b=B();const ym=bym();const list=b.tx.filter(t=>t.date.startsWith(ym)&&(!onlyUnc||(!t.cat&&t.amount<0)));
  if(onlyUnc&&list.length){txCatSheet(list[0].id,list.slice(1).map(x=>x.id));return;}
  const catName=id=>id==='__ignore'?'Ignored':id==='__income'?'Income':((b.cats.find(c=>c.id===id)||{}).name||'Not sorted');
  openSheet('Payments · '+ymLabel(ym),list.length?`<div class="list">${list.map(t=>`<button class="item" data-btx="${t.id}"><div class="mid"><div class="t1">${esc(t.text)}</div><div class="t2 ${t.cat?'':'down'}">${esc(catName(t.cat))} · ${dateLabel(dn(t.date))}</div></div><div class="end"><div class="t1">${bkr(t.amount,{dec:true,sign:true})}</div></div></button>`).join('')}</div>
   <button class="btn danger block" id="txDelMonth" style="margin-top:12px">Remove ${ymLabel(ym)} payments</button>`:'<div class="note">No payments imported for this month.</div>',()=>{
    const d=fv('txDelMonth');if(d)d.onclick=()=>{if(!armed(d,'Tap again to remove'))return;b.tx=b.tx.filter(t=>!t.date.startsWith(ym));bSave();closeSheet();softRender();};});}
function matchSheet(){const b=B();const catName=id=>id==='__ignore'?'Ignore':id==='__income'?'Income':((b.cats.find(c=>c.id===id)||{}).name||'?');
  openSheet('Sorting rules',`<div class="note" style="margin-bottom:10px">When a payment's description contains the word on the left, it goes to the category on the right. Rules you make while sorting are added at the top.</div>
   <form class="form" id="mForm"><div class="grid2"><div class="field"><label for="mKw">Description contains</label><input id="mKw" placeholder="rema"></div><div class="field"><label for="mCat">Category</label><select id="mCat">${catOptions('')}</select></div></div><button class="btn sm primary" type="submit">Add rule</button></form>
   <div class="list" style="margin-top:12px">${b.match.map(r=>`<div class="item" style="cursor:default"><div class="mid"><div class="t1">${esc(r.kw)}</div><div class="t2">${esc(catName(r.cat))}</div></div><button class="btn sm" data-bmdel="${r.id}">Remove</button></div>`).join('')}</div>`,()=>{
    fv('mForm').onsubmit=e=>{e.preventDefault();const kw=fv('mKw').value.trim().toLowerCase();if(!kw)return;b.match.unshift({id:uid(),kw,cat:fv('mCat').value});for(const x of b.tx)if(!x.cat&&x.amount<0&&x.text.toLowerCase().includes(kw))x.cat=fv('mCat').value;bSave();matchSheet();};
    $$('[data-bmdel]').forEach(btn=>btn.onclick=()=>{b.match=b.match.filter(r=>r.id!==btn.dataset.bmdel);bSave();matchSheet();});});}

onTap(e=>{
  const el=e.target.closest('[data-bmonth],[data-bjump],[data-bcat],[data-binc],[data-bgroup],[data-bact],[data-btx]');if(!el)return;const d=el.dataset;
  if(d.bmonth){UI.bym=shiftYM(bym(),+d.bmonth);saveUI();softRender();return;}
  if(d.bjump){UI.bym=d.bjump;saveUI();softRender();window.scrollTo({top:0,behavior:'smooth'});return;}
  if(d.bcat){catSheet(d.bcat);return;}if(d.binc){incomeSheet(d.binc);return;}if(d.bgroup){groupSheet(d.bgroup);return;}
  if(d.btx){txCatSheet(d.btx,[]);return;}
  switch(d.bact){case 'import':bankImportSheet();return;case 'uncat':txListSheet(true);return;case 'txlist':txListSheet(false);return;case 'match':matchSheet();return;case 'target':targetSheet();return;}
});

/* fit the labels inside the pay bar: full name + %, else only %, else nothing (the list below always has all) */
function fitStackbar(){document.querySelectorAll('.stackbar.sb-big').forEach(bar=>{
  bar.querySelectorAll('span').forEach(sp=>{const l=sp.querySelector('.sb-l');if(!l)return;
    const bg=getComputedStyle(sp).backgroundColor;const m=bg.match(/\d+(\.\d+)?/g);if(m&&!sp.classList.contains('left')){const [r,g,b]=m.map(Number);const lum=(0.299*r+0.587*g+0.114*b)/255;l.style.color=lum>0.55?'#000':'#fff';}
    l.textContent=l.dataset.long;l.hidden=false;l.style.padding="";if(l.scrollWidth<=sp.clientWidth-8)return;
    l.textContent=l.dataset.short;l.style.padding="0 2px";if(l.scrollWidth<=sp.clientWidth-2)return;l.hidden=true;});
  if(!bar._ro&&window.ResizeObserver){let lw=bar.clientWidth;bar._ro=new ResizeObserver(()=>{if(Math.abs(bar.clientWidth-lw)>2){lw=bar.clientWidth;fitStackbar();}});bar._ro.observe(bar);}});}
afterRender(()=>{if(document.querySelector('.stackbar.sb-big'))requestAnimationFrame(fitStackbar);});

/* ================= appearance: night/day, colours, fonts, card transparency, wide tables (per device) ================= */
const LOOK_DEFAULT={mode:'night',accent:'#FFA028',bg:'',alpha:100,font:'plex',num:'plexmono',tables:'fit'};
const ACCENTS=[['Amber','#FFA028'],['Orange','#FF7A1A'],['Yellow','#FFD23F'],['Blue','#4AA3FF'],['Sky','#7CC4FF'],['White','#E6E6E6']];
const BGS={night:[['Black','#000000'],['Graphite','#14161A'],['Navy','#0A1424']],day:[['White','#FFFFFF'],['Light grey','#F1F2F4'],['Warm','#F6F2EA']]};
const FONTS={plex:['IBM Plex Sans','"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'],schibsted:['Schibsted Grotesk','"Schibsted Grotesk",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'],system:['iPhone system font','-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif'],mono:['Terminal (all mono)','"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace']};
const NUMFONTS={plexmono:['IBM Plex Mono','"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace'],sfmono:['iPhone mono','ui-monospace,"SF Mono",Menlo,Consolas,monospace'],same:['Same as text','var(--f-body)']};
function look(){return Object.assign({},LOOK_DEFAULT,UI.look||{});}
function inkFor(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return '#000';const n=parseInt(m[1],16);const r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;const L=0.2126*r+0.7152*g+0.0722*b;return L>0.5?'#000000':'#FFFFFF';}
function applyLook(){const L=look();const root=document.documentElement;const st=root.style;
  root.dataset.look=L.mode==='day'?'day':'night';root.dataset.expl=UI.expl==='off'?'off':'on';root.dataset.tables=L.tables==='scroll'?'scroll':'fit';
  let acc=L.accent||LOOK_DEFAULT.accent;
  if(L.mode==='day'&&acc.toUpperCase()==='#FFA028')acc='#C77700'; // amber that stays readable on light backgrounds
  st.setProperty('--amber',acc);st.setProperty('--accent',acc);st.setProperty('--accent-ink',inkFor(acc));st.setProperty('--c1',acc);
  if(L.bg)st.setProperty('--bg',L.bg);else st.removeProperty('--bg');
  st.setProperty('--card-alpha',String(Math.max(10,Math.min(100,+L.alpha||100))));
  const f=(FONTS[L.font]||FONTS.plex)[1];st.setProperty('--f-body',f);st.setProperty('--f-display',f);
  st.setProperty('--f-num',(NUMFONTS[L.num]||NUMFONTS.plexmono)[1]);
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',L.bg||(L.mode==='day'?'#F1F2F4':'#000000'));}
function setLook(patch){UI.look=Object.assign(look(),patch);saveUI();applyLook();}
function startSettingsHTML(){const sp=UI.startPage||'overview';const opts=[['overview','Overview'],['holdings','Holdings'],['analysis','Insights'],['plan','Plan'],['settings','Settings'],['last','Where I left off']];
  return `<h2 class="sec">Start</h2><div class="card stack"><div class="field"><label for="startSel">Open the app on</label><select id="startSel">${opts.map(([k,l])=>`<option value="${k}" ${sp===k?'selected':''}>${l}</option>`).join('')}</select><div class="hint">Pages always open on their first view: Holdings on Positions, Insights on Returns, Plan on Budget.</div></div></div>`;}
function tableSettingsHTML(){const L=look();const T=tblOpt();const ex=fmtK(198387.4,{ccy:'NOK'})+'  ·  '+fmtK(-4696.89,{sign:true,ccy:'NOK'})+'  ·  '+fmtK(475.57,{small:true,ccy:'NOK'});
  const segT=(attr,opts,cur)=>`<div class="seg" role="group">${opts.map(([k,l])=>`<button data-${attr}="${k}" aria-pressed="${cur===k}">${l}</button>`).join('')}</div>`;
  return `<h2 class="sec">Tables</h2><div class="card stack">

   <div class="hint">Applies to the Positions table, closed positions, the return tables and the budget's year table. Where the currency is shown is under Currency. Totals and sorting always use the exact values.</div></div>`;}
function lookSettingsHTML(){const L=look();const bgs=BGS[L.mode==='day'?'day':'night'];
  const sw=(attr,list,cur)=>list.map(([n,c])=>`<button class="swatch ${String(cur).toUpperCase()===c.toUpperCase()?'on':''}" data-${attr}="${c}" aria-label="${n}" title="${n}" style="background:${c}"></button>`).join('');
  return `<h2 class="sec">Appearance</h2>
  <div class="card stack">
   <div class="look-row"><span class="lbl2">Mode</span><div class="seg" role="group"><button data-lkmode="night" aria-pressed="${L.mode!=='day'}">Night</button><button data-lkmode="day" aria-pressed="${L.mode==='day'}">Day</button></div></div>
   <div class="look-row col"><span class="lbl2">Accent colour</span><div class="swatches">${sw('lkacc',ACCENTS,L.accent)}<label class="swatch custom" title="Custom"><input type="color" id="lkAccIn" value="${esc(L.accent)}" aria-label="Custom accent colour"><span>+</span></label></div><div class="hint">Used for buttons, labels and your own line on charts. Green and red stay reserved for up and down.</div></div>
   <div class="look-row col"><span class="lbl2">Background</span><div class="swatches"><button class="swatch auto ${!L.bg?'on':''}" data-lkbg="" aria-label="Default" title="Default">A</button>${sw('lkbg',bgs,L.bg)}<label class="swatch custom" title="Custom"><input type="color" id="lkBgIn" value="${esc(L.bg||(L.mode==='day'?'#FFFFFF':'#000000'))}" aria-label="Custom background colour"><span>+</span></label></div></div>
   <div class="look-row col"><label class="lbl2" for="lkAlpha">Card transparency <span class="muted" id="lkAlphaV">${100-L.alpha} %</span></label><input type="range" id="lkAlpha" min="0" max="90" step="5" value="${100-L.alpha}"><div class="hint">0 % is solid. Higher lets the background show through the cards.</div></div>
   <div class="grid2"><div class="field"><label for="lkFont">Text font</label><select id="lkFont">${Object.entries(FONTS).map(([k,[n]])=>`<option value="${k}" ${L.font===k?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="field"><label for="lkNum">Number font</label><select id="lkNum">${Object.entries(NUMFONTS).map(([k,[n]])=>`<option value="${k}" ${L.num===k?'selected':''}>${n}</option>`).join('')}</select></div></div>
   <div><button class="btn sm" data-lkreset="1">Reset appearance</button></div>
  </div>`;}
onTap(e=>{const tb=e.target.closest('[data-tbstyle],[data-tbsep],[data-tbcur]');if(tb){const d=tb.dataset;UI.tbl=Object.assign(tblOpt(),d.tbstyle?{style:d.tbstyle}:d.tbsep?{sep:d.tbsep}:{cur:d.tbcur});saveUI();softRender();return;}

document.addEventListener('input',e=>{const t=e.target;

document.addEventListener('change',e=>{const t=e.target;

/* Every page/view you visit is remembered (like Safari's back/forward).

const NAV={stack:[],i:-1,moving:false};
const SUBKEY={holdings:'sub',analysis:'asub',plan:'psub',settings:'sset'};

function recordNav(){if(NAV.moving)return;const s=navState();const cur=NAV.stack[NAV.i];if(cur&&navId(cur)===navId(s))return;
  NAV.stack=NAV.stack.slice(0,NAV.i+1);NAV.stack.push(s);if(NAV.stack.length>60)NAV.stack.shift();NAV.i=NAV.stack.length-1;}
function sheetOpen(){const s=$('#sheet');return s&&!s.hidden;}
function goNav(dir){
  if(dir<0&&sheetOpen()){closeSheet();return true;}
  if(sheetOpen())return false;

/* edge swipe gesture */
(function(){
  const EDGE=22,GO=70;let st=null;
  const ind=document.createElement('div');ind.className='edge-ind';ind.setAttribute('aria-hidden','true');document.body.appendChild(ind);
  const show=(side,dx,can)=>{const p=Math.min(1,dx/GO);ind.className='edge-ind on '+side+(p>=1?' ready':'')+(can?'':' none');
    ind.innerHTML=side==='l'?'&#8249;':'&#8250;';ind.style.transform=`translateY(-50%) translateX(${side==='l'?(-46+p*62):(46-p*62)}px)`;ind.style.opacity=String(0.25+p*0.75);};
  const hide=()=>{ind.className='edge-ind';ind.style.opacity='0';};
  const canGo=side=>side==='l'?(sheetOpen()||NAV.i>0):(!sheetOpen()&&NAV.i<NAV.stack.length-1);
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){st=null;return;}const t=e.touches[0];const w=window.innerWidth;
    const side=t.clientX<=EDGE?'l':t.clientX>=w-EDGE?'r':null;st=side?{side,x:t.clientX,y:t.clientY,lock:null}:null;},{passive:true});
  document.addEventListener('touchmove',e=>{if(!st)return;const t=e.touches[0];const dx=st.side==='l'?t.clientX-st.x:st.x-t.clientX;const dy=Math.abs(t.clientY-st.y);
    if(st.lock==null){if(Math.abs(dx)<8&&dy<8)return;st.lock=dx>dy?'h':'v';}
    if(st.lock!=='h'){st=null;hide();return;}
    e.preventDefault();st.dx=dx;show(st.side,Math.max(0,dx),canGo(st.side));},{passive:false});
  const end=()=>{if(!st)return;const ok=st.lock==='h'&&st.dx>=GO;const side=st.side;st=null;hide();if(ok)goNav(side==='l'?-1:1);};
  document.addEventListener('touchend',end);document.addEventListener('touchcancel',()=>{st=null;hide();});
  /* keyboard / mouse back-forward buttons on iPad keyboards and computers */
  document.addEventListener('keydown',e=>{if(e.altKey&&!e.target.closest('input,textarea,select')){if(e.key==='ArrowLeft'){if(goNav(-1))e.preventDefault();}else if(e.key==='ArrowRight'){if(goNav(1))e.preventDefault();}}});
})();

/* ================= arrows instead of + and − ================= */
/* Any number shown with a + or − sign loses the sign. Where the value already
   carries a coloured ▲/▼ (class up/down) the sign is simply dropped; elsewhere
   the sign becomes a small ▲ or ▼ so the direction is never lost.
   Typed values in form fields are never touched. */
const SIGN_RE=/(^|[\s(\[·\/:=•])([+−]|^-)(?=[$£€]?\s?\d)/g;
const SKIP_TAGS=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT','NOSCRIPT']);
function hasArrow(el){const a=el&&el.closest&&el.closest('.up,.down');if(!a)return false;return !a.closest('.prog')&&!a.classList.contains('lk');}
/* Settings → Up and down colours → Arrows: Show / Hide */
function arrowsOn(){return !(typeof S!=='undefined'&&S&&S.settings&&S.settings.arrows==='off');}
function applyArrows(){if(arrowsOn())delete document.documentElement.dataset.arrows;else document.documentElement.dataset.arrows='off';}
/* ▲ or ▼ for a value, or nothing when arrows are hidden */
function arw(v,eps=0){return !arrowsOn()?'':v>eps?'▲':v<-eps?'▼':'';}
function arrowText(node){let txt=node.nodeValue;if(!txt)return;
  /* arrows hidden: also take out any ▲ ▼ written straight into a text */
  if(!arrowsOn()&&/[▲▼]/.test(txt)){const par=node.parentNode;if(par&&!(par.closest&&par.closest('[data-keepsign]'))){txt=txt.replace(/[▲▼]\u00a0?\s?/g,'');node.nodeValue=txt;}}
  if(!/[+−-]/.test(txt))return;
  SIGN_RE.lastIndex=0;if(!SIGN_RE.test(txt))return;SIGN_RE.lastIndex=0;
  const par=node.parentNode;if(!par||SKIP_TAGS.has(par.nodeName)||(par.closest&&par.closest('[data-keepsign],[contenteditable]')))return;
  const strip=hasArrow(par);
  const plain=strip||par.nodeName==='OPTION'||par.namespaceURI==='http://www.w3.org/2000/svg';
  if(plain){node.nodeValue=txt.replace(SIGN_RE,(m,pre,s)=>pre+(strip||!arrowsOn()?'':(s==='+'?'▲':'▼')));return;}
  const frag=document.createDocumentFragment();let last=0;txt.replace(SIGN_RE,(m,pre,s,off)=>{
    frag.appendChild(document.createTextNode(txt.slice(last,off)+pre));
    const sp=document.createElement('span');sp.className='arw';sp.textContent=s==='+'?'▲':'▼';frag.appendChild(sp);
    last=off+m.length;return m;});
  frag.appendChild(document.createTextNode(txt.slice(last)));par.replaceChild(frag,node);}
function arrowize(root){if(!root)return;if(root.nodeType===3){arrowText(root);return;}if(root.nodeType!==1||SKIP_TAGS.has(root.nodeName))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const list=[];let n;while((n=w.nextNode()))list.push(n);list.forEach(arrowText);}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')arrowText(m.target);else m.addedNodes.forEach(arrowize);}})
  .observe(document.body,{childList:true,subtree:true,characterData:true});

    const others=Object.keys(CARD_LIB).filter(k=>!present.has(k));
    const size=((UI.csize||{})[pg])==='compact'?'compact':'normal';
    return `<div class="note">Move cards with the arrows, hide the ones you don't need, or add a card from another page.</div>
    <div class="list arr-list">${list.map((c,i)=>{const L=CARD_LIB[c.id];const foreign=L.p!==pg;return `<div class="item arr-row ${c.hidden?'off':''}">
      <div class="mid"><div class="t1">${esc(L.t)}</div><div class="t2">${foreign?'From '+PAGE_NAMES[L.p]:c.hidden?'Hidden':'Shown'}</div></div>
      <button class="icon-btn sm" data-arrmove="${i}:-1" aria-label="Move up" ${i===0?'disabled':''}>${iconSm('up',18)}</button>
      <button class="icon-btn sm" data-arrmove="${i}:1" aria-label="Move down" ${i===list.length-1?'disabled':''}>${iconSm('down',18)}</button>
      ${foreign?`<button class="icon-btn sm" data-arrdel="${i}" aria-label="Remove">${iconSm('close',18)}</button>`:`<button class="icon-btn sm" data-arrhide="${i}" aria-label="${c.hidden?'Show':'Hide'}">${iconSm(c.hidden?'eyeoff':'eye',18)}</button>`}</div>`;}).join('')}</div>
    ${others.length?`<h3 class="h3">Add a card</h3><div class="grid2"><div class="field"><label for="arrAdd">Card</label><select id="arrAdd">${others.map(k=>`<option value="${k}">${esc(CARD_LIB[k].t)} · ${PAGE_NAMES[CARD_LIB[k].p]}</option>`).join('')}</select></div>
     <div class="field"><label for="arrPos">Place it</label><select id="arrPos"><option value="top">At the top</option><option value="mid">In the middle</option><option value="bottom" selected>At the bottom</option></select></div></div>
     <div><button class="btn primary sm" data-arradd="1">${iconSm('plus')} Add card</button></div>`:''}
    <div class="look-row" style="margin-top:14px"><span class="lbl2">Card size</span><div class="seg" role="group"><button data-arrsize="normal" aria-pressed="${size==='normal'}">Normal</button><button data-arrsize="compact" aria-pressed="${size==='compact'}">Compact</button></div></div>
    <div class="btns" style="margin-top:12px"><button class="btn sm" data-arrreset="1">Reset ${PAGE_NAMES[pg]}</button></div>`;};
  openSheet('Arrange '+PAGE_NAMES[pg],`<div id="arrBody">${draw()}</div>`,s=>{
    const body=s.querySelector('#arrBody');
    const redo=()=>{body.innerHTML=draw();softRender();};
    body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;const list=layoutOf(pg);
      if(d.arrmove){const [i,dir]=d.arrmove.split(':').map(Number);const j=i+dir;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];saveLayout(pg,list);redo();return;}
      if(d.arrhide){const i=+d.arrhide;list[i].hidden=!list[i].hidden;saveLayout(pg,list);redo();return;}
      if(d.arrdel){list.splice(+d.arrdel,1);saveLayout(pg,list);redo();return;}
      if(d.arradd){const id=$('#arrAdd').value;const pos=$('#arrPos').value;const at=pos==='top'?0:pos==='mid'?Math.floor(list.length/2):list.length;list.splice(at,0,{id,hidden:false});saveLayout(pg,list);redo();toast(CARD_LIB[id].t+' added');return;}
      if(d.arrsize){UI.csize=Object.assign({},UI.csize||{},{[pg]:d.arrsize});saveUI();redo();return;}
      if(d.arrreset){UI.layout=Object.assign({},UI.layout||{});delete UI.layout[pg];if(UI.csize)delete UI.csize[pg];saveUI();redo();toast(PAGE_NAMES[pg]+' reset');return;}});});}
onTap(e=>{const g=e.target.closest('[data-arrange]');if(g){arrangeSheet(g.dataset.arrange);return;}
  const r=e.target.closest('[data-act="resetlayouts"]');if(r){UI.layout={};UI.csize={};saveUI();softRender();toast('All pages reset');}});

const DAYMS=864e5;
function backupJSON(){return JSON.stringify({app:'lacag',v:2,saved:new Date().toISOString(),data:S},null,1);}
function markBackup(){UI.lastBackup=Date.now();delete UI.backupSnooze;saveUI();}
async function backupToFile(){const name='lacag-backup-'+localToday()+'.json';const txt=backupJSON();
  try{if(navigator.canShare){const f=new File([txt],name,{type:'application/json'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Lacag backup'});markBackup();toast('Backup saved');softRender();return;}}}
  catch(e){if(e&&e.name==='AbortError')return;}
  await saveFile(name,txt,'application/json');markBackup();softRender();}
function backupDue(){if(S.demo||!S.txs.length||UI.backupRemind===false)return false;const now=Date.now();
  if(UI.backupSnooze&&now<UI.backupSnooze)return false;return !UI.lastBackup||now-UI.lastBackup>30*DAYMS;}
function backupBanner(){const last=UI.lastBackup?Math.floor((Date.now()-UI.lastBackup)/DAYMS):null;
  return `<div class="banner keep backup-banner"><div style="flex:1"><b>Time for a backup</b><div class="small">${last==null?'You have never saved a backup.':`Last backup ${last} days ago.`} ${typeof syncCfg==='function'&&syncCfg().on?'Your data is synced between your devices, but a backup file is still your safety copy.':'Your data lives only on '+thisDevice()+'.'}</div>
   <div class="btns" style="margin-top:8px"><button class="btn primary sm" data-act="backupfile">${iconSm('save')} Back up now</button><button class="btn sm" data-act="backuplater">Later</button></div></div></div>`;}
function backupSettingsHTML(){const last=UI.lastBackup?dateLabel(Math.floor(UI.lastBackup/DAYMS),true):'never';

   <div class="field"><textarea id="importBox" placeholder="Paste the backup text here"></textarea></div>
   <div class="btns"><button class="btn sm" data-act="restore">Restore and replace</button><button class="btn sm" data-act="copybackup">Copy backup as text</button></div><div class="err" id="importErr"></div></div>`;}
document.addEventListener('change',e=>{if(e.target.id!=='restoreFile')return;const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{const box=$('#importBox');if(box){box.value=String(rd.result||'');toast('Backup loaded: tap Restore and replace (twice) to finish');box.scrollIntoView({block:'center'});}};rd.readAsText(f);});
onTap(e=>{const b=e.target.closest('[data-bkrem]');if(b){UI.backupRemind=b.dataset.bkrem==='1';saveUI();softRender();}});

/* ---------- 2) data check ---------- */
function lastPriceDate(a){let best=null;const h=C.hist[histKey(a)];if(h&&h.s&&h.s.length)best=h.s[h.s.length-1][0];
  for(const p of S.prices)if(p.assetId===a.id&&(!best||p.date>best))best=p.date;const lv=C.live[a.id];if(lv&&lv.date&&(!best||lv.date>best))best=lv.date;
  for(const t of S.txs)if(t.assetId===a.id&&(t.type==='buy'||t.type==='sell')&&(!best||t.date>best))best=t.date;return best;}
function workdaysSince(d){let n=0;for(let x=dn(d)+1;x<=dn(localToday());x++){const w=new Date(x*DAYMS).getUTCDay();if(w!==0&&w!==6)n++;}return n;}
function dataIssues(){const out=[];const M=compute();if(!M)return out;
  for(const h of M.holdings.filter(h=>h.qty>0)){const d=lastPriceDate(h.a);const lim=h.a.cls==='crypto'?2:4;
    if(!d)out.push({k:'price',a:h.a,t:`${h.a.symbol}: no price at all`,s:'Add a price under Holdings → '+h.a.symbol});
    else if(h.a.cls==='crypto'?(dn(localToday())-dn(d)>lim):workdaysSince(d)>lim)out.push({k:'price',a:h.a,t:`${h.a.symbol}: last price ${dateLabel(dn(d),true)}`,s:C.err[h.a.id]||'Live prices may not be working for this one'});}
  for(const t of S.txs){if(t.type!=='buy'&&t.type!=='sell')continue;const a=assetById(t.assetId);if(!a)continue;
    if(a.currency!=='NOK'&&!(t.fx>0))out.push({k:'fx',t:`${a.symbol} ${t.type} ${dateLabel(dn(t.date),true)}: no exchange rate`,s:'Open the trade and add the NOK rate',tx:t.id});}
  const seen=new Map();for(const t of S.txs){if(t.type!=='buy'&&t.type!=='sell'&&t.type!=='dividend')continue;const k=[t.date,t.type,t.assetId,t.accountId,t.qty,t.price,t.amount].join('|');if(seen.has(k))seen.get(k).push(t);else seen.set(k,[t]);}
  for(const list of seen.values())if(list.length>1){const t=list[0];const a=assetById(t.assetId);out.push({k:'dup',t:`${list.length}× the same ${t.type} of ${a?a.symbol:'?'} on ${dateLabel(dn(t.date),true)}`,s:'Possible duplicate. Open Activity to check',tx:t.id});}
  const q={};for(const t of S.txs.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(TYPE_ORDER[x.type]||0)-(TYPE_ORDER[y.type]||0))){
    if(!t.assetId)continue;const k=t.assetId+'|'+t.accountId;if(t.type==='buy')q[k]=(q[k]||0)+t.qty;else if(t.type==='split'&&t.ratio>0)q[k]=(q[k]||0)*t.ratio;
    else if(t.type==='sell'){q[k]=(q[k]||0)-t.qty;if(q[k]<-1e-6){const a=assetById(t.assetId);out.push({k:'neg',t:`${a?a.symbol:'?'}: sold more than you held on ${dateLabel(dn(t.date),true)}`,s:'A buy may be missing from your imports',tx:t.id});q[k]=0;}}}
  const R=S.recon||{};for(const h of M.holdings.filter(h=>h.qty>0||R[h.a.id]!=null)){const r=R[h.a.id];if(r==null||r==='')continue;if(Math.abs(+r-h.qty)>Math.max(1e-6,h.qty*1e-6))out.push({k:'recon',a:h.a,t:`${h.a.symbol}: Lacag ${qtyFmt(h.qty)}, broker ${qtyFmt(+r)}`,s:'Difference '+qtyFmt(h.qty-r)+'. A trade may be missing or doubled'});}
  return out;}
function checkSettingsHTML(){const M=compute();const iss=dataIssues();const R=S.recon||{};
  const icon={price:'refresh',fx:'cash',dup:'table',neg:'sell',recon:'updown'};
  return `<div class="card stack">${iss.length?`<div class="note keep"><b>${iss.length} thing${iss.length>1?'s':''} to look at</b></div>
   <div class="list" style="background:var(--surface2)">${iss.map(x=>`<${x.tx?`button data-tx="${x.tx}"`:x.a?`button data-asset="${x.a.id}"`:'div'} class="item"><span class="chk-ic warn">${iconSm(icon[x.k]||'eye',16)}</span><div class="mid"><div class="t1 wrap">${esc(x.t)}</div><div class="t2 wrap">${esc(x.s)}</div></div></${x.tx||x.a?'button':'div'}>`).join('')}</div>`
   :`<div class="ok-line"><span class="chk-ic">✓</span> Everything looks right: prices are fresh, trades have exchange rates, no duplicates found.</div>`}</div>
   ${M&&M.holdings.some(h=>h.qty>0)?`<h2 class="sec">Compare with your broker</h2><div class="card stack"><div class="hint">Type how many units Nordnet or Kraken says you hold. Lacag flags any difference.</div>
    ${M.holdings.filter(h=>h.qty>0).map(h=>`<div class="row-between recon-row"><div><div class="t1">${esc(h.a.symbol)}</div><div class="small muted">Lacag: <span class="num">${qtyFmt(h.qty)}</span></div></div><input class="fx-in num" inputmode="decimal" data-recon="${h.a.id}" placeholder="at broker" value="${R[h.a.id]!=null?inputNum(R[h.a.id],6):''}"></div>`).join('')}
    <div><button class="btn sm primary" data-act="saverecon">Check</button></div></div>`:''}`;}
onTap(e=>{if(!e.target.closest('[data-act="saverecon"]'))return;S.recon=S.recon||{};
  $$('[data-recon]').forEach(i=>{const v=parseNum(i.value);if(i.value.trim()===''){delete S.recon[i.dataset.recon];}else if(isFinite(v)&&v>=0)S.recon[i.dataset.recon]=v;});
  if(S.demo){lsSet('lq_state',S);}else Store.save();softRender();toast(dataIssues().some(x=>x.k==='recon')?'Differences found':'All match');});

/* ---------- 3) + 4) tax (Norway) ---------- */
/* Shares/funds: gains & dividends × 1.72 × 22 % = 37.84 %. Crypto: 22 %. Lots matched FIFO, as the Tax Administration requires.
   Skjermingsrente (published each January): 2023 3.2 %, 2024 3.9 %, 2025 3.6 %. The current year uses last year's rate as an estimate. */
const NOTAX={get share(){return TAX.shares;},get crypto(){return taxRules().crypto;},get skj(){return taxRules().skj;}};
/* a year without a published rate uses the latest known rate (marked as an estimate); years before the table use 0 */
function skjYears(){return Object.keys(NOTAX.skj).map(Number).filter(y=>isFinite(y)).sort((a,b)=>a-b);}
/* a year without a published rate uses the closest earlier year's rate and is marked as an estimate */
const skjRate=y=>{const t=NOTAX.skj;if(t[y]!=null)return +t[y];const ys=skjYears().filter(x=>x<y);if(!ys.length)return 0;return +t[ys[ys.length-1]];};
function skjFirstYear(){let f=null;for(const t of S.txs){if(t.type!=='buy')continue;const a=assetById(t.assetId);if(!a||a.cls==='crypto')continue;if(!f||t.date<f)f=t.date;}return f?+f.slice(0,4):null;}
/* years from your first share or fund buy up to y that have no published rate */
function skjMissing(y){const f=skjFirstYear();if(f==null)return [];const out=[];for(let x=f;x<=y;x++)if(NOTAX.skj[x]==null)out.push(x);return out;}
const skjEstimate=y=>skjMissing(y).length>0;
function taxKind(t,a){const acc=accById(t.accountId);if(a&&a.cls==='crypto')return 'crypto';if(acc&&acc.kind==='ask')return 'ask';if(acc&&acc.kind==='ips')return 'ips';return 'share';}
function txFx(t,a){if(!a||a.currency==='NOK')return 1;return t.fx>0?t.fx:fxForDate(a.currency,t.date);}
/* one pass through all trades: FIFO lots per asset and tax group, realised gains per sale, yearly skjerming, dividends */
function taxModel(){if(taxModel.v===VERSION&&taxModel.m)return taxModel.m;
  const lots={},sales=[],divs=[],skjLog={};const today=localToday();const ty=+today.slice(0,4);
  const txs=S.txs.filter(t=>t.assetId).slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(TYPE_ORDER[x.type]||0)-(TYPE_ORDER[y.type]||0));
  const firstY=txs.length?+txs[0].date.slice(0,4):ty;let ti=0;
  const yearEnd=y=>{for(const k in lots){if(!k.endsWith('|share'))continue;const r=skjRate(y);if(!r)continue;for(const L of lots[k])if(L.q>1e-12){const add=(L.cost+L.sk)*r;L.sk+=add;skjLog[y]=(skjLog[y]||0)+add;L.skY=L.skY||{};L.skY[y]=(L.skY[y]||0)+add;}}};
  for(let y=firstY;y<=ty;y++){
    for(;ti<txs.length&&+txs[ti].date.slice(0,4)===y;ti++){const t=txs[ti];const a=assetById(t.assetId);if(!a)continue;const g=taxKind(t,a);const key=a.id+'|'+g;const L=lots[key]=lots[key]||[];
      if(t.type==='buy'){const fx=txFx(t,a);L.push({q:t.qty,cost:t.qty*t.price*fx+(t.fee||0),sk:0,date:t.date});}
      else if(t.type==='split'&&t.ratio>0){for(const l of L)l.q*=t.ratio;}
      else if(t.type==='sell'){const fx=txFx(t,a);let left=t.qty,cost=0,sk=0;const proceeds=t.qty*t.price*fx-(t.fee||0);
        while(left>1e-12&&L.length){const l=L[0];const take=Math.min(left,l.q);const part=take/l.q;cost+=l.cost*part;sk+=l.sk*part;l.cost-=l.cost*part;l.sk-=l.sk*part;l.q-=take;left-=take;if(l.q<=1e-12)L.shift();}
        const gain=proceeds-cost;const skUsed=g==='share'&&gain>0?Math.min(gain,sk):0;
        sales.push({y,date:t.date,a,g,qty:t.qty,proceeds,cost,gain,skUsed,short:left>1e-9,acc:accById(t.accountId)});}
      else if(t.type==='dividend'){divs.push({y,date:t.date,a,g,amount:t.amount||0});}}
    if(y<ty)yearEnd(y);}
  /* dividends this year use that year's skjerming on the same holding (first), shown as an estimate */
  const m={lots,sales,divs,skjLog,ty};taxModel.v=VERSION;taxModel.m=m;return m;}
function taxYear(y){const T=taxModel();const by={share:{gain:0,loss:0,sk:0,divGross:0,divWh:0},crypto:{gain:0,loss:0},ask:{gain:0,loss:0}};
  for(const s of T.sales.filter(s=>s.y===y)){const b=by[s.g==='ips'?'ask':s.g];if(!b)continue;if(s.gain>=0)b.gain+=s.gain;else b.loss+=s.gain;if(s.g==='share')b.sk+=s.skUsed;}
  for(const d of T.divs.filter(d=>d.y===y&&d.g==='share')){if(d.amount>=0)by.share.divGross+=d.amount;else by.share.divWh+=-d.amount;}
  const sh=by.share;const skDiv=Math.min(sh.divGross,(T.skjLog[y]||0)*0);/* dividend skjerming kept at 0: needs per-share data from the broker */
  const net=sh.gain+sh.loss-sh.sk;const shareTax=net*NOTAX.share;const divTax=Math.max(0,(sh.divGross-skDiv)*NOTAX.share-sh.divWh);
  const cr=by.crypto;const crNet=cr.gain+cr.loss;
  return {y,share:Object.assign({},sh,{net,tax:shareTax,divTax}),crypto:Object.assign({},cr,{net:crNet,tax:crNet*NOTAX.crypto}),ask:by.ask,sales:T.sales.filter(s=>s.y===y)};}
function askInnskudd(){if(S.askIn!=null&&S.askIn!=='')return {v:+S.askIn,src:'you'};const ids=S.accounts.filter(a=>a.kind==='ask').map(a=>a.id);let v=0;
  const tracks=S.accounts.some(a=>a.kind==='ask'&&a.tracksCash);
  for(const t of S.txs){if(!ids.includes(t.accountId)&&!ids.includes(t.toAccountId))continue;
    if(tracks){if(t.type==='deposit'&&ids.includes(t.accountId))v+=t.amount;else if(t.type==='withdraw'&&ids.includes(t.accountId))v-=t.amount;else if(t.type==='transfer'){if(ids.includes(t.toAccountId)&&!ids.includes(t.accountId))v+=t.amount;if(ids.includes(t.accountId)&&!ids.includes(t.toAccountId))v-=t.amount;}}
    else{const a=assetById(t.assetId);if(!a)continue;const fx=txFx(t,a);if(t.type==='buy')v+=t.qty*t.price*fx+(t.fee||0);}}
  return {v,src:tracks?'cash':'buys'};}
function sellTodayHTML(M){const T=taxModel();const groups={share:{v:0,cost:0,sk:0},crypto:{v:0,cost:0},ask:{v:0,cost:0}};
  for(const k in T.lots){const [aid,g]=k.split('|');const h=M.holdings.find(x=>x.a.id===aid);if(!h)continue;const gg=g==='ips'?null:groups[g];if(!gg)continue;
    const q=T.lots[k].reduce((s,l)=>s+l.q,0);if(q<=1e-12)continue;const price=h.qty>0?h.value/h.qty:0;gg.v+=q*price;gg.cost+=T.lots[k].reduce((s,l)=>s+l.cost,0);if(g==='share')gg.sk+=T.lots[k].reduce((s,l)=>s+l.sk,0);}
  const sh=groups.share,cr=groups.crypto,as=groups.ask;
  const shGain=sh.v-sh.cost;const shTax=Math.max(0,shGain-sh.sk)*NOTAX.share+(shGain<0?shGain*NOTAX.share:0);
  const crGain=cr.v-cr.cost;const crTax=crGain*NOTAX.crypto;
  const inn=askInnskudd();const asTaxable=Math.max(0,as.v-inn.v);const asTax=asTaxable*NOTAX.share;
  const cash=M.cash;const before=sh.v+cr.v+as.v+cash;const after=before-shTax-crTax-asTax;
  const row=(n,v,g,tax,extra='')=>v>0?`<div class="tx-row"><div><div class="t1">${n}</div><div class="small muted">Value ${F(conv(M,v))} · gain <span class="${cl(g)}">${F(conv(M,g),{sign:true})}</span>${extra}</div></div><div class="num ${tax<0?'':''}">${tax>=0?'Tax '+F(conv(M,tax)):'Tax saved '+F(conv(M,-tax))}</div></div>`:'';
  return `<div class="card stack"><div class="sumgrid"><div><div class="k">Worth now</div><div class="v">${F(conv(M,before))}</div></div><div><div class="k">After tax if sold today</div><div class="v">${F(conv(M,after))}</div></div></div>
   ${row('Aksjekonto · shares',sh.v,shGain,shTax,sh.sk>0?' · skjerming '+F(conv(M,sh.sk)):'')}${row('Crypto',cr.v,crGain,crTax)}
   ${as.v>0?`<div class="tx-row"><div><div class="t1">ASK</div><div class="small muted">Value ${F(conv(M,as.v))} · tax-free to take out <b class="amber-v">${F(conv(M,Math.min(as.v,inn.v)))}</b></div></div><div class="num">${asTax>0?'Tax '+F(conv(M,asTax)):'No tax'}</div></div>`:''}
   ${cash>0?`<div class="tx-row"><div><div class="t1">Cash</div></div><div class="num">${F(conv(M,cash))}</div></div>`:''}
   <div class="hint">ASK: you can take out what you put in (${inn.src==='you'?'your figure':inn.src==='cash'?'from your deposits':'estimated from your buys'}: ${F(conv(M,inn.v))}) without tax. Set the exact figure from Nordnet below.</div>
   <div class="row-between"><input class="fx-in num" style="width:150px" inputmode="decimal" id="askIn" placeholder="ASK innskudd" value="${S.askIn!=null&&S.askIn!==''?inputNum(+S.askIn,0):''}"><button class="btn sm" data-act="saveaskin">Save</button></div></div>`;}

function rebalanceHTML(M){if(!M)return '';const open=M.holdings.filter(h=>h.qty>0);if(!open.length)return '';const tg=S.targets||{};const amount=(S.buyPlan&&S.buyPlan.amount)||0;

async function fetchIntraday(a){const it=C.intra[a.id];if(it&&Date.now()-it.t<15*60000)return;
  if(useHelper(a)){const sym=yahooSym(a);if(!sym)return;const j=await getJSON(helperUrl()+'/?symbol='+encodeURIComponent(sym)+'&range=1d&interval=15m',20000);
    if(j&&Array.isArray(j.points)&&j.points.length)C.intra[a.id]={t:Date.now(),q:j.currency||a.currency,s:j.points};return;}
  if(!S.settings.tdKey)return;const j=await td('time_series',{...tdSym(a.dataSymbol||a.symbol),interval:'15min',outputsize:'40',timezone:'UTC',order:'ASC'});
  const s=(j.values||[]).map(v=>[Date.parse(v.datetime.replace(' ','T')+'Z'),+v.close]).filter(x=>x[1]>0&&isFinite(x[0]));if(s.length)C.intra[a.id]={t:Date.now(),q:(j.meta&&j.meta.currency)||a.currency,s};}
async function loadIntraday(){if(NET.blocked||loadIntraday.busy)return;loadIntraday.busy=true;

    for(const a of act.filter(a=>held.has(a.id))){try{await fetchIntraday(a);}catch(e){}if(UI.range==='1D')softRender();}saveCache();}finally{loadIntraday.busy=false;}}

/* average monthly spending and saving from the Budget, and what actually reached the portfolio */
function avgSpend(){let s=0;for(let m=1;m<=12;m++)s+=budgetMonth(m).spent;return s/12;}
function avgPlannedSave(){let s=0;for(let m=1;m<=12;m++)s+=budgetMonth(m).saved;return s/12;}
function avgActualSave(M){const now=localToday().slice(0,7);let s=0;for(let k=1;k<=12;k++){const ym=shiftYM(now,-k);s+=contributions(M,dn(ym+'-01'),dn(shiftYM(ym,1)+'-01'));}return s/12;}
function monthlySaving(M){const a=M?avgActualSave(M):0;return a>0?{v:a,src:'what you actually added the last 12 months'}:{v:avgPlannedSave(),src:'your budget'};}
const realR=()=>{const r=+((S.plan&&S.plan.realReturn)||0.04);return isFinite(r)?r:0.04;};
function monthsTo(start,target,save,r){const rm=Math.pow(1+r,1/12)-1;let v=start;for(let i=0;i<=720;i++){if(v>=target)return i;v=v*(1+rm)+save;}return null;}
function futureValue(start,save,r,years){const rm=Math.pow(1+r,1/12)-1;let v=start;for(let i=0;i<Math.round(years*12);i++)v=v*(1+rm)+save;return v;}
function ageNow(){const by=S.plan&&S.plan.birthYear;return by?(+localToday().slice(0,4))-by:null;}

/* ---------- 1) freedom number ---------- */
function freedomData(M){const spend=avgSpend();if(!(spend>0)||!M)return null;const target=spend*12*25;const now=M.total;const sv=monthlySaving(M);

function kfWindow(M,p,last){const t=M.today;const dow=(new Date(t*DAY).getUTCDay()+6)%7;const ws=t-dow;
  if(p==='w')return last?[ws-8,ws-1,'Last week']:[ws-1,t,'This week'];
  if(p==='m'){const ms=dn(ds(t).slice(0,7)+'-01');if(!last)return [ms-1,t,'This month'];const pm=addMonths(ms,-1);return [pm-1,ms-1,'Last month'];}
  if(p==='q'){const qs=periodStart(t,'quarter');if(!last)return [qs-1,t,'This quarter'];const pq=addMonths(qs,-3);return [pq-1,qs-1,'Last quarter'];}
  if(p==='y'){const y0=dn(yearOf(t)+'-01-01');if(!last)return [y0-1,t,'Year to date'];return [dn((yearOf(t)-1)+'-01-01')-1,y0-1,'Last year'];}

/* ---------- data quality: coarse history, gaps, your trade price far from the market price ---------- */
function histQuality(a,M){const h=C.hist[histKey(a)];if(!h||!h.s||h.s.length<2)return [];const out=[];const s=h.s;const today=dn(localToday());
  const crypto=a.cls==='crypto';
  /* prices in the past year (or since the first price, when shorter) */
  const y0=today-365;const first=dn(s[0][0]);const from=Math.max(y0,first);const n=s.filter(x=>dn(x[0])>=from).length;const span=today-from;
  const expected=crypto?span:span*250/365;
  if(span>=60&&n<expected*0.5){out.push({k:'coarse',a,t:`${a.symbol}: only ${n} prices in the past ${span>=360?'year':Math.round(span/30.4)+' months'}`,s:`Expected about ${Math.round(expected)}. Charts and returns between the prices are less exact. Refresh prices, or check the symbol.`});return out;}
  /* the longest gap while you held it, in the past 3 years */
  const held=S.txs.filter(t=>t.assetId===a.id&&t.type==='buy').map(t=>dn(t.date));if(!held.length)return out;
  const g0=Math.max(Math.min(...held),today-3*365);let worst=0,wAt=null;
  for(let i=1;i<s.length;i++){const p=dn(s[i-1][0]),q=dn(s[i][0]);if(q<g0)continue;const gap=q-Math.max(p,g0);if(gap>worst){worst=gap;wAt=[p,q];}}
  if(worst>(crypto?3:7))out.push({k:'gap',a,t:`${a.symbol}: no prices for ${worst} days`,s:`Between ${dateLabel(wAt[0],true)} and ${dateLabel(wAt[1],true)}. The value is held flat over the gap.`});
  return out;}
function tradePriceCheck(a){const h=C.hist[histKey(a)];if(!h||!h.s||!h.s.length)return [];if(h.q&&a.currency&&h.q!==a.currency)return [];
  const s=h.s;const splits=S.txs.filter(t=>t.assetId===a.id&&t.type==='split'&&t.ratio>0);const far=[];
  for(const t of S.txs){if(t.assetId!==a.id||(t.type!=='buy'&&t.type!=='sell')||!(t.price>0))continue;
    /* the market close on the trade day, or the last one before it (at most 5 days) */
    let lo=0,hi=s.length-1,j=-1;while(lo<=hi){const m=(lo+hi)>>1;if(s[m][0]<=t.date){j=m;lo=m+1;}else hi=m-1;}
    if(j<0||dn(t.date)-dn(s[j][0])>5)continue;
    /* market history is split-adjusted, so adjust your price for splits after the trade */
    let k=1;for(const sp of splits)if(sp.date>t.date)k*=sp.ratio;const mine=t.price/k,mkt=s[j][1];
    const d=mine/mkt-1;if(Math.abs(d)>0.15)far.push({t,mine,mkt,d});}

  return [{k:'tprice',a,tx:x.t.id,t:`${a.symbol}: ${far.length} trade${far.length>1?'s':''} far from the market price`,
    s:`E.g. ${x.t.type} ${dateLabel(dn(x.t.date),true)}: you ${nf2.format(x.mine)}, market ${nf2.format(x.mkt)} ${a.currency} (${fmtPct(Math.abs(x.d),{dec:0,sign:false})} ${x.d>0?'above':'below'}). Check the price, the currency or a missing split.`}];}

/* ================= sync between your devices (your own Cloudflare Worker, end-to-end encrypted) ================= */
/* The portfolio (everything you entered: trades, accounts, plans, settings) is encrypted on this device with your
   sync password (PBKDF2 → AES-GCM) and stored as one scrambled record in your Worker's KV storage.
   The vault name and write key are one-way hashes of the password; the password itself never leaves the device.
   Page choices (open tab, chart period, layout) stay per device. */
const SYNC_KEY='lq_sync';
function syncCfg(){try{return JSON.parse(localStorage.getItem(SYNC_KEY)||'null')||{};}catch(e){return {};}}
function syncSave(c){try{localStorage.setItem(SYNC_KEY,JSON.stringify(c));}catch(e){}}
const SYNC={busy:false,timer:null,status:'',err:'',keys:{}};

const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s);};
const unb64=s=>{const r=atob(s);const a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
async function sha(s){return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));}
async function syncIds(pass){return {id:await sha('lacag-vault-v1:'+pass),auth:await sha('lacag-write-v1:'+pass)};}
async function syncKey(pass,salt){const k=salt+'|'+pass.length;if(SYNC.keys[k]&&SYNC.keys[k].p===pass)return SYNC.keys[k].key;
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

async function gz(bytes,dir){const s=new Blob([bytes]).stream().pipeThrough(dir==='in'?new CompressionStream('gzip'):new DecompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer());}
async function sealState(pass,salt){let bytes=new TextEncoder().encode(JSON.stringify(S));let tag='p';
  if(typeof CompressionStream==='function'){try{bytes=await gz(bytes,'in');tag='g';}catch(e){}}
  const iv=crypto.getRandomValues(new Uint8Array(12));const key=await syncKey(pass,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {iv:b64(iv),data:tag+':'+b64(ct)};}
async function openState(pass,rec){const key=await syncKey(pass,rec.salt);const [tag,body]=[rec.data.slice(0,1),rec.data.slice(2)];

  if(tag==='g')bytes=await gz(bytes,'out');return migrate(JSON.parse(new TextDecoder().decode(bytes)));}

/* send this device's portfolio; if the other device saved in the meantime, the newer one wins */
async function syncPush(force){const c=syncCfg();if(!c.on||!c.pass||S.demo||SYNC.busy)return;SYNC.busy=true;
  try{const sealed=await sealState(c.pass,c.salt);let res=await syncReq(c,'PUT',{baseRev:c.rev,updated:S.updated||Date.now(),device:deviceName(),salt:c.salt,...sealed});
    if(res.status===409){const rec=res.j;if(!force&&(rec.updated||0)>(S.updated||0)){const remote=await openState(c.pass,rec);applyRemote(remote,rec,c);toast('Newer changes from your '+(rec.device||'other device')+' were loaded');return;}
      c.rev=rec.rev;res=await syncReq(c,'PUT',{baseRev:c.rev,updated:S.updated||Date.now(),device:deviceName(),salt:c.salt,...sealed});}

/* ================= Gain per holding: three views (Bars · Split · Columns), any period ================= */
/* For one holding over a period (day before start → last day):
     gain = value at the end − value at the start − money put in (buys − sales, fees included) + dividends
   which is exactly how the whole portfolio's gain is counted, so the holdings add up to the investments' gain.
   Split (B): currency part = each day's value in the asset's own currency × that day's change in the krone rate;
              dividends = dividends received; price part = the rest. The three always add up to the gain. */
const GL_PERIODS=[['1W','1W'],['1M','1M'],['YTD','YTD'],['1Y','1Y'],['3Y','3Y'],['MAX','All time']];
function glOpt(){return Object.assign({view:'bars',unit:'kr',per:'MAX',sold:true,sort:'gain',top:10},UI.glOpt||{});}
function glSet(k,v){UI.glOpt=Object.assign({},glOpt(),{[k]:v});saveUI();softRender();}
function glRows(M,o){const bi=o.per==='MAX'?-1:Math.max(-1,rangeBase(o.per,M.today)-M.d0),ei=M.N-1;const out=[];
  for(const h of M.holdings){if(h.kind!=='asset'||!h.AV)continue;const cur=h.a.currency;
    let cf=0,dv=0,buys=0,fx=0;for(let i=bi+1;i<=ei;i++){cf+=h.ACF[i];dv+=h.ADIV[i];if(h.ACF[i]>0)buys+=h.ACF[i];
      if(cur!=='NOK'&&i>0){const prev=h.AV[i-1];if(prev){const f0=M.fxAt(cur,i-1),f1=M.fxAt(cur,i);if(f0>0&&f1>0)fx+=prev/f0*(f1-f0);}}}
    const v0=bi>=0?h.AV[bi]:0,v1=h.AV[ei];const gain=v1-v0-cf+dv;const held=v0>0||buys>0||v1>0;
    if(!held&&Math.abs(gain)<0.5)continue;if(!o.sold&&!(h.qty>0))continue;
    const base=v0+buys;out.push({h,sym:h.a.symbol,name:h.a.name||h.a.symbol,sold:!(h.qty>0),gain,pct:base>0?gain/base:null,fx,div:dv,price:gain-fx-dv});}
  const key=o.unit==='%'&&o.view!=='split'?(r=>r.pct==null?-Infinity:r.pct):(r=>r.gain);
  out.sort(o.sort==='name'?((a,b)=>a.sym.localeCompare(b.sym)):((a,b)=>key(b)-key(a)));
  return {rows:out,total:out.reduce((s,r)=>s+r.gain,0),bi,ei};}
const glK=(M,v)=>conv(M,v);

   ${o.view==='split'?`<div class="gl-leg small muted"><span><i style="background:var(--c1)"></i>Price</span><span><i style="background:var(--c2)"></i>Currency</span><span><i style="background:var(--c3)"></i>Dividends</span><span><i class="gl-stripe"></i>a loss part</span></div>`:''}

function glBars(M,rows,o){const split=o.view==='split';const pctMode=o.unit==='%'&&!split;

      ${open||split?`<div class="gl-det small">${split?'':esc(r.name)+' · '}<span>Price ${F(glK(M,r.price),{sign:true})}</span> · <span>Currency ${F(glK(M,r.fx),{sign:true})}</span> · <span>Dividends ${F(glK(M,r.div))}</span>${!split&&r.pct!=null?` · <span>${pct(r.pct)}</span>`:''}</div>`:''}</div>`;}).join('')}</div>`;}
function glColumns(M,rows,o){const pctMode=o.unit==='%';const v=r=>pctMode?(r.pct||0):r.gain;
  const colW=58,base=pcDrawW()>420?pcDrawW():320,scroll=rows.length*colW>base,W=scroll?rows.length*colW:base,H=210,pt=18,pb=38;const vals=rows.map(v);let hi=Math.max(0,...vals),lo=Math.min(0,...vals);if(hi-lo<1e-9){hi+=1;lo-=1;}

  return `<div class="gl-cols">${s}</svg></div>`;}
function glCfgSheet(){const draw=()=>{const o=glOpt();return `<div class="look-row"><span class="lbl2">View</span><div class="seg" role="group">${[['bars','Bars'],['split','Split'],['columns','Columns']].map(([k,l])=>`<button data-glo="view:${k}" aria-pressed="${o.view===k}">${l}</button>`).join('')}</div></div>

/* ================= Budget: where your pay goes — Ring (default), Flow (Sankey) and Map (treemap); Plan or Spent; several incomes ================= */
function bvOpt(){return Object.assign({view:'ring',mode:'plan'},UI.bvOpt||{});}
function bvSet(k,v){UI.bvOpt=Object.assign({},bvOpt(),{[k]:v});saveUI();softRender();}
/* drawing width: the real width of the card's inside, so text is never stretched */
function bvW(){const v=document.querySelector('#view');const w=v?v.clientWidth-30:330;return Math.max(280,Math.min(900,Math.round(w)));}
/* the numbers to draw: groups with their categories (plan amounts, or what was really spent this month) */
function bvData(r,b,act,mode){const groups=b.groups.map(g=>{const cats=r.cats.filter(x=>x.c.group===g.id).map(x=>({id:x.c.id,name:x.c.name,v:mode==='spent'?Math.max(0,act.by[x.c.id]||0):x.v})).filter(c=>c.v>0.5);
    return {id:g.id,name:g.name,col:groupColor(g.id),cats,v:cats.reduce((s,c)=>s+c.v,0)};}).filter(g=>g.v>0.5);
  if(mode==='spent'&&act.unc>0.5)groups.push({id:'__unc',name:'Not sorted yet',col:'var(--c8)',cats:[{id:'__unc',name:'Not sorted yet',v:act.unc}],v:act.unc});
  const out=groups.reduce((s,g)=>s+g.v,0);const left=r.income-out;return {groups,out,left,income:r.income};}
const bvPc=(v,inc)=>fmtPct(inc>0?v/inc:0,{dec:1,sign:false});
/* ---- C: ring with Left over in the middle + every category with its own bar ---- */
function bvRing(D){const inc=D.income||1;const R=62,C=2*Math.PI*R;let off=0,arcs='';
  for(const g of D.groups){const l=Math.min(1,g.v/Math.max(inc,D.out))*C;if(l>0.5)arcs+=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${g.col}" stroke-width="22" stroke-dasharray="${Math.max(0.5,l-2).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)"/>`;off+=l;}
  const maxCat=Math.max(1,...D.groups.flatMap(g=>g.cats.map(c=>c.v)));
  return `<div class="bv-ring"><svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="Your pay split into groups"><circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--surface2)" stroke-width="22"/>${arcs}
     <text x="80" y="74" text-anchor="middle" font-size="11" fill="var(--muted)">${D.left>=0?'Left over':'Short by'}</text><text x="80" y="95" text-anchor="middle" font-size="17" font-weight="700" class="num" fill="${D.left>=0?'var(--fg)':'var(--down)'}">${esc(bkr(Math.abs(D.left)))}</text></svg>
   <div class="bv-sum">${D.groups.map(g=>`<div class="bv-sr"><span class="bv-sw" style="background:${g.col}"></span><span class="bv-sn">${esc(g.name)}</span><span class="num">${bvPc(g.v,inc)}</span></div>`).join('')}
     <div class="bv-sr"><span class="bv-sw bv-left"></span><span class="bv-sn">${D.left>=0?'Left over':'Short by'}</span><span class="num">${bvPc(Math.abs(D.left),inc)}</span></div></div></div>
  <div class="bv-list">${D.groups.map(g=>`<div class="bv-g"><div class="bv-gh"><span class="bv-sw" style="background:${g.col}"></span><span class="bv-gn">${esc(g.name)}</span><span class="num">${esc(bkr(g.v))}</span><span class="num muted bv-gp">${bvPc(g.v,inc)}</span></div>
     ${g.cats.slice().sort((a,b)=>b.v-a.v).map(c=>`<div class="bv-c"><span class="bv-cn">${esc(c.name)}</span><span class="bv-tr"><span style="width:${(c.v/maxCat*100).toFixed(1)}%;background:${g.col}"></span></span><span class="num bv-ca">${esc(bkr(c.v))}</span></div>`).join('')}</div>`).join('')}</div>`;}
/* ---- A: flow from your pay to the groups and on to every category ---- */
function bvFlow(D){const inc=D.income||1;const W=bvW();const lab=Math.min(170,Math.max(118,W*0.42));const x0=0,w0=10,x1=Math.round((W-lab)*0.42),w1=10,x2=Math.round(W-lab-10),w2=8;
  const nCats=D.groups.reduce((s,g)=>s+g.cats.length,0);const gapG=8,gapC=3;const minH=13;
  const total=Math.max(inc,D.out);const avail=Math.max(260,nCats*minH*1.6);const sc=avail/total;
  /* each category gets at least room for its label; the streams keep their true thickness */
  let s='';let y0=0,yg=0,yc=0;const parts=D.groups.concat(D.left>0.5?[{name:'Left over',col:'var(--muted)',v:D.left,cats:[],left:true}]:[]);
  for(const g of parts){const h=g.v*sc;const mid=(x0+w0+x1)/2;
    s+=`<path d="M${x0+w0} ${y0.toFixed(1)} C${mid} ${y0.toFixed(1)},${mid} ${yg.toFixed(1)},${x1} ${yg.toFixed(1)} L${x1} ${(yg+h).toFixed(1)} C${mid} ${(yg+h).toFixed(1)},${mid} ${(y0+h).toFixed(1)},${x0+w0} ${(y0+h).toFixed(1)}Z" fill="${g.col}" fill-opacity=".28"/>`;
    s+=`<rect x="${x1}" y="${yg.toFixed(1)}" width="${w1}" height="${Math.max(2,h).toFixed(1)}" rx="2" fill="${g.col}"/>`;
    s+=`<text x="${x1-5}" y="${(yg+Math.max(h,10)/2+4).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="${g.col}">${bvPc(g.v,inc)}</text>`;
    let cy=yg;const m2=(x1+w1+x2)/2;
    if(g.left)s+=`<text x="${x1+w1+6}" y="${(yg+Math.max(h,10)/2+4).toFixed(1)}" font-size="10.5" fill="var(--muted)">Left over ${esc(bkr(g.v))}</text>`;
    for(const c of g.cats){const ch=c.v*sc;const slot=Math.max(ch,minH);
      s+=`<path d="M${x1+w1} ${cy.toFixed(1)} C${m2} ${cy.toFixed(1)},${m2} ${yc.toFixed(1)},${x2} ${yc.toFixed(1)} L${x2} ${(yc+ch).toFixed(1)} C${m2} ${(yc+ch).toFixed(1)},${m2} ${(cy+ch).toFixed(1)},${x1+w1} ${(cy+ch).toFixed(1)}Z" fill="${g.col}" fill-opacity=".22"/>`;
      s+=`<rect x="${x2}" y="${yc.toFixed(1)}" width="${w2}" height="${Math.max(1.5,ch).toFixed(1)}" rx="2" fill="${g.col}"/>`;
      s+=`<text x="${x2+w2+5}" y="${(yc+Math.min(slot,Math.max(ch,10))/2+4).toFixed(1)}" font-size="10.5" fill="var(--fg)">${esc(c.name.length>18?c.name.slice(0,17)+'…':c.name)} <tspan fill="var(--muted)" class="num">${esc(bkr(c.v))}</tspan></text>`;
      cy+=ch;yc+=slot+gapC;}
    y0+=h;yg+=Math.max(h,g.left?14:h)+gapG;yc=Math.max(yc,yg);if(g.cats.length)yc+=gapG-gapC;}
  const H=Math.ceil(Math.max(yg,yc)+4);
  s=`<rect x="${x0}" y="0" width="${w0}" height="${(inc*sc).toFixed(1)}" rx="2" fill="var(--fg)"/>`+s;
  return `<div class="bv-flow"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMinYMin meet" role="img" aria-label="Your pay flowing to groups and categories">${s}</svg></div>`;}
/* ---- B: a map of your pay: one box per category, sized by amount, grouped by colour (squarified treemap) ---- */
function bvSquarify(items,x,y,w,h){const out=[];let rest=items.filter(i=>i.v>0).slice().sort((a,b)=>b.v-a.v);let tot=rest.reduce((s,i)=>s+i.v,0);
  while(rest.length){const short=Math.min(w,h);const area=w*h;let row=[],best=Infinity;
    for(let k=0;k<rest.length;k++){const cand=rest.slice(0,k+1);const s=cand.reduce((a,i)=>a+i.v,0)/tot*area;const side=s/short;
      const worst=Math.max(...cand.map(i=>{const a=i.v/tot*area;const o=a/side;return Math.max(side/o,o/side);}));if(worst<=best){best=worst;row=cand;}else break;}
    const rs=row.reduce((a,i)=>a+i.v,0);const rArea=rs/tot*area;
    if(w>=h){const rw=rArea/h;let cy=y;for(const i of row){const ih=i.v/rs*h;out.push({i,x,y:cy,w:rw,h:ih});cy+=ih;}x+=rw;w-=rw;}
    else{const rh=rArea/w;let cx=x;for(const i of row){const iw=i.v/rs*w;out.push({i,x:cx,y,w:iw,h:rh});cx+=iw;}y+=rh;h-=rh;}
    rest=rest.slice(row.length);tot-=rs;}
  return out;}
function bvMap(D){const inc=D.income||1;const W=bvW();const H=Math.round(Math.min(420,Math.max(240,W*0.85)));
  const top=D.groups.map(g=>({v:g.v,g})).concat(D.left>0.5?[{v:D.left,left:true}]:[]);let s='';
  for(const t of bvSquarify(top,0,0,W,H)){
    if(t.i.left){s+=`<rect x="${t.x+1}" y="${t.y+1}" width="${Math.max(0,t.w-2)}" height="${Math.max(0,t.h-2)}" rx="5" fill="var(--surface2)" stroke="var(--line)"/>`;if(t.w>60&&t.h>30)s+=`<text x="${t.x+8}" y="${t.y+17}" font-size="11" fill="var(--muted)">Left over</text><text x="${t.x+8}" y="${t.y+31}" font-size="10.5" class="num" fill="var(--muted)">${esc(bkr(D.left))}</text>`;continue;}
    const g=t.i.g;for(const c of bvSquarify(g.cats.map(c=>({v:c.v,c})),t.x,t.y,t.w,t.h)){const k=c.i.c;const f=k.v/g.v;
      s+=`<g data-bvtip="${esc(k.name+' · '+bkr(k.v)+' · '+bvPc(k.v,inc))}"><rect x="${(c.x+1).toFixed(1)}" y="${(c.y+1).toFixed(1)}" width="${Math.max(0,c.w-2).toFixed(1)}" height="${Math.max(0,c.h-2).toFixed(1)}" rx="5" fill="${g.col}" fill-opacity="${(0.6+0.4*f).toFixed(2)}"/>`;
      const nm=k.name;if(c.w>64&&c.h>34)s+=`<text x="${c.x+8}" y="${c.y+17}" font-size="11.5" font-weight="700" class="bv-ink">${esc(nm.length*6.4>c.w-12?nm.slice(0,Math.max(3,Math.floor((c.w-16)/6.4)))+'…':nm)}</text><text x="${c.x+8}" y="${c.y+31}" font-size="10.5" class="num bv-ink">${esc(c.w>118?bkr(k.v)+' · '+bvPc(k.v,inc):bkr(k.v))}</text>`;
      else if(c.w>34&&c.h>18)s+=`<text x="${c.x+5}" y="${c.y+14}" font-size="9.5" font-weight="700" class="bv-ink">${esc(nm.slice(0,Math.max(2,Math.floor((c.w-8)/6))))}</text>`;s+='</g>';}
    s+=`<rect x="${t.x+1}" y="${t.y+1}" width="${Math.max(0,t.w-2)}" height="${Math.max(0,t.h-2)}" rx="5" fill="none" stroke="var(--surface)" stroke-width="2.5"/>`;}
  return `<div class="bv-map"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMinYMin meet" role="img" aria-label="Map of your pay">${s}</svg><div class="bv-tip small" id="bvTip" hidden></div></div>
   <div class="bv-leg small">${D.groups.map(g=>`<span><i style="background:${g.col}"></i>${esc(g.name)} <b class="num">${bvPc(g.v,inc)}</b></span>`).join('')}${D.left>0.5?`<span class="muted"><i class="bv-left"></i>Left over ${esc(bkr(D.left))}</span>`:''}</div>`;}
/* the whole visual part of the pay card */
function budgetVizHTML(r,b,ym,act,hasTx){const o=bvOpt();const mode=o.mode==='spent'&&hasTx?'spent':'plan';const D=bvData(r,b,act,mode);

  return `<div class="bv-head"><span class="sub-h" style="margin:0">Where your pay goes</span><span class="pc-tools"><span class="seg" role="group"><button data-bvo="mode:plan" aria-pressed="${mode==='plan'}">Plan</button><button data-bvo="mode:spent" aria-pressed="${mode==='spent'}" ${hasTx?'':'disabled title="Import your bank transactions to see what you spent"'}>Spent</button></span><button class="gear-btn" data-act="bvcfg" aria-label="Chart settings">${iconSm('gear',18)}</button></span></div>
   ${mode==='spent'?`<div class="small muted">What really left your accounts in ${esc(ymLabel(ym))}, from your bank transactions.</div>`:''}${body}`;}
function bvCfgSheet(){const draw=()=>{const o=bvOpt();return `<div class="look-row"><span class="lbl2">View</span><div class="seg" role="group">${[['ring','Ring'],['flow','Flow'],['map','Map']].map(([k,l])=>`<button data-bvo="view:${k}" aria-pressed="${o.view===k}">${l}</button>`).join('')}</div></div>
   <div class="hint">Ring: groups in a ring and every category with its own bar. Flow: your pay streaming into groups and categories. Map: one box per category, sized by its share of your pay.</div>`;};
  openSheet('Where your pay goes',`<div id="bvoBody">${draw()}</div>`,sh=>{const body=sh.querySelector('#bvoBody');body.addEventListener('click',()=>setTimeout(()=>{body.innerHTML=draw();},0));});}
/* incomes: every income on its own line, each one editable; add as many as you like */
function incomesHTML(r,b,m){const list=b.incomes;const n=list.length;
  return `<div class="bv-inc">${list.map(x=>`<button class="bv-ir ${x.on===false?'off':''}" data-binc="${esc(x.id)}"><span class="bv-in">${esc(x.name||'Income')}${x.on===false?' <span class="pill flat">off</span>':''}${x.overrides&&x.overrides[m]!=null&&x.overrides[m]!==''?' <span class="pill flat">this month</span>':''}</span><span class="num">${esc(bkr(x.on===false?0:amt(x,m),{dec:true}))}</span><span class="set-chev">›</span></button>`).join('')}
   <button class="bv-ir add" data-binc="__new"><span class="bv-in">+ Add income</span></button></div>`;}
onTap(e=>{const b=e.target.closest('[data-bvo]');if(b&&!b.disabled){const [k,v]=b.dataset.bvo.split(':');bvSet(k,v);return;}if(e.target.closest('[data-act="bvcfg"]'))bvCfgSheet();});
/* tap a box in the Map to see its name and amount */
onTap(e=>{const t=e.target.closest('[data-bvtip]');const tip=document.getElementById('bvTip');if(!tip)return;if(!t){tip.hidden=true;return;}tip.textContent=t.dataset.bvtip;tip.hidden=false;});

/* ================= events ================= */
onTap(async e=>{
  const el=e.target.closest('[data-tab],[data-range],[data-mode],[data-alloc],[data-hsort],[data-sub],[data-asub],[data-psub],[data-brk],[data-bm],[data-asset],[data-tx],[data-cashacc],[data-editacc],[data-editpf],[data-pick],[data-goal],[data-event],[data-updown],[data-pmenu],[data-prange],[data-psort],[data-rview],[data-rper],[data-krange],[data-cbm],[data-act]');if(!el||el===document.documentElement||el===document.body)return; /* page-level marks are not buttons */
  const d=el.dataset;
  if(d.tab){UI.tab=d.tab;firstView(d.tab);if(d.psub)UI.psub=d.psub;saveUI();closeSheet();render();window.scrollTo(0,0);return;}
  for(const k of ['range','mode','alloc','hsort','sub','asub','psub','brk','krange'])if(d[k]){UI[k]=d[k];saveUI();softRender();return;}
  if(d.cbm){const L=chartBms();const i=L.indexOf(d.cbm);if(i>=0)L.splice(i,1);else L.push(d.cbm);UI.chartBms=L;saveUI();softRender();if(!NET.blocked)fetchBenchmarks();return;}
  if(d.bm){const i=UI.bms.indexOf(d.bm);if(i>=0)UI.bms.splice(i,1);else UI.bms.push(d.bm);saveUI();softRender();if(!NET.blocked)fetchBenchmarks();return;}
  if(d.updown){S.settings.updown=d.updown;applyUpdown();if(S.demo){lsSet('lq_state',S);VERSION++;}else Store.save();softRender();return;}
  if(d.pmenu){posMenu(d.pmenu);return;}
  if(d.prange){UI.prange=d.prange;saveUI();softRender();return;}
  if(d.psort){if(UI.psort===d.psort)UI.pdir=-(UI.pdir||-1);else{UI.psort=d.psort;UI.pdir=d.psort==='title'?1:-1;}saveUI();softRender();return;}
  if(d.rview){UI.rview=d.rview;saveUI();softRender();return;}
  if(d.rper){UI.rper=d.rper;saveUI();softRender();return;}
  if(d.asset){assetSheet(d.asset);return;}
  if(d.tx){const t=S.txs.find(x=>x.id===d.tx);if(S.demo){toast('Example entries can\'t be edited');return;}if(!t)return;if(['buy','sell','dividend','split'].includes(t.type))txSheet(t);else cashSheet(t);return;}
  if(d.cashacc){if(S.demo){toast('Example entries can\'t be edited');return;}cashSheet(null,d.cashacc);return;}
  if(d.editacc){accountSheet(d.editacc);return;}
  if(d.editpf){if(S.demo&&d.editpf==='__new'){toast('Start with your own data first');return;}portfolioSheet(d.editpf);return;}
  if(d.pick){UI.pid=d.pick;saveUI();closeSheet();VERSION++;render();return;}
  if(d.goal){if(S.demo){toast('Example goals can\'t be edited');return;}goalSheet(d.goal);return;}
  if(d.event){if(S.demo){toast('Example events can\'t be edited');return;}eventSheet(d.event);return;}
  const act=d.act;
  switch(act){
    case 'close':closeSheet();return;
    case 'add':addMenu();return;
    case 'trade':txSheet(null);return;
    case 'dividendform':txSheet(null,{type:'dividend'});return;
    case 'cash':cashSheet(null);return;
    case 'import':importSheet();return;
    case 'switch':switchSheet();return;
    case 'goal':if(S.demo){toast('Start with your own data to add goals');return;}goalSheet(null);return;
    case 'event':if(S.demo){toast('Start with your own data to add events');return;}eventSheet(null);return;
    case 'ask':runAsk();return;
    case 'backupfile':backupToFile();return;
    case 'backuplater':UI.backupSnooze=Date.now()+7*DAYMS;saveUI();softRender();return;
    case 'taxcsv':taxCSV();return;
    case 'saveaskin':{const v=$('#askIn').value.trim();S.askIn=v===''?null:parseNum(v);if(S.demo){lsSet('lq_state',S);}else Store.save();softRender();toast('Saved');return;}
    case 'chartcfg':chartCfgSheet();return;
    case 'events':UI.events=!UI.events;saveUI();softRender();return;
    case 'priv':UI.priv=!UI.priv;saveUI();softRender();toast(UI.priv?'Amounts hidden':'Amounts shown');return;
    case 'refresh':refresh(true);return;
    case 'cleardemo':{const bud=S.budget;S=blankState();if(bud)S.budget=bud;}UI.pid='nabad';saveUI();Store.save();render();return;
    case 'loaddemo':if(S.txs.length&&!S.demo&&!armed(el,'This replaces your data. Tap again'))return;{const bud=S.budget;S=demoState();if(bud)S.budget=bud;}UI.pid='nabad';saveUI();VERSION++;lsSet('lq_state',S);render();refresh(false);toast('Example portfolio loaded');return;
    case 'wipe':if(!armed(el,'Tap again to delete everything'))return;S=blankState();UI.pid='nabad';saveUI();Store.save();render();toast('All data deleted');return;
    case 'savekey':S.settings.tdKey=$('#tdKey').value.trim();for(const k in C.err)delete C.err[k];Store.save();toast(S.settings.tdKey?'Key saved':'Key removed');refresh(true);return;
    case 'savehelper':{let u=$('#helperUrl').value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;S.settings.helper=u;if(S.demo){lsSet('lq_state',S);}else Store.save();toast(u?'Helper saved':'Helper removed');if(u)refresh(true);softRender();return;}
    case 'testhelper':{let u=$('#helperUrl').value.trim();if(!u){toast('Paste your helper address first');return;}if(!/^https?:\/\//i.test(u))u='https://'+u;const keep=S.settings.helper;S.settings.helper=u;
      try{const j=await helperGet('WEBN.DE','5d');toast(j.price>0?`Works: WEBN ${money(j.price,j.currency||'EUR')}`:'Connected, but no WEBN price yet');}catch(e){toast('Helper problem: '+String(e.message||e).slice(0,80));}finally{S.settings.helper=keep;}return;}
    case 'savefx':{for(const c of CCYS){if(c==='NOK')continue;const f=$('#fx_'+c);if(!f)continue;const x=parseNum(f.value);if(x>0)S.fx[c]=x;}if(S.demo){lsSet('lq_state',S);VERSION++;}else Store.save();toast('Rates saved');softRender();return;}
    case 'copybackup':{const txt=JSON.stringify({app:'lacag',v:2,data:S});try{await navigator.clipboard.writeText(txt);markBackup();toast('Backup copied');}catch(err){const box=$('#importBox');box.value=txt;box.select();toast('Select all and copy the text');}return;}
    case 'savebackup':markBackup();await saveFile('lacag-backup-'+localToday()+'.json',JSON.stringify({app:'lacag',v:2,data:S},null,1),'application/json');return;
    case 'restore':{const err=$('#importErr');err.textContent='';let j;try{j=JSON.parse($('#importBox').value);}catch(x){err.textContent='That text isn\'t a backup. Copy the whole backup and try again.';return;}
      const data=migrate(j&&j.data?j.data:j);if(!data||!Array.isArray(data.txs)){err.textContent='No transactions found in that backup.';return;}
      if(!armed(el,`Replace with ${data.txs.length} entries? Tap again`))return;{const keep=S&&S.settings&&S.settings.tdKey;S=Object.assign(data,{demo:false});S.settings=S.settings||{};if(!S.settings.tdKey&&keep)S.settings.tdKey=keep;}UI.pid=(S.portfolios[0]||{}).id||'nabad';saveUI();Store.save();render();toast('Backup restored');refresh(false);return;}
    case 'dlapp':try{const r=await fetch('lacag.html');if(!r.ok)throw 0;await saveFile('lacag.html',await r.text(),'text/html');}catch(x){toast('Download isn\'t available here');}return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('ccysel')){UI.ccy=t.value;PAGE_CCY[UI.tab]=t.value;saveUI();softRender();return;}
  if(t.dataset&&t.dataset.evtoggle){const ev=S.plan.events.find(x=>x.id===t.dataset.evtoggle);if(ev){ev.on=t.checked;if(S.demo){VERSION++;lsSet('lq_state',S);}else Store.save();softRender();}return;}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='planForm'){e.preventDefault();const p=S.plan;const n=(id,f=1)=>{const v=parseNum(fv(id).value);return isFinite(v)?v*f:null;};
    const by=n('pBirth'),ra=n('pRet'),la=n('pLife');if(by&&by>1900&&by<2020)p.birthYear=Math.round(by);if(ra&&ra>=50&&ra<=80)p.retireAge=ra;if(la&&la>p.retireAge&&la<=110)p.lifeAge=la;
    const w=n('pWant'),nav=n('pNav'),oth=n('pOther'),pt=n('pPTax',0.01),rr=n('pRet2',0.01),sv=n('pSave');
    if(w!=null)p.desiredMonthly=w;if(nav!=null)p.navYearly=nav;if(oth!=null)p.otherYearly=oth;if(pt!=null&&pt>=0&&pt<0.8)p.pensionTax=pt;if(rr!=null&&rr>-0.05&&rr<0.15)p.realReturn=rr;if(sv!=null)p.monthlySaving=sv;
    if(S.demo){VERSION++;lsSet('lq_state',S);}else Store.save();softRender();toast('Plan updated');return;}
  if(e.target.id==='bpForm'){e.preventDefault();const a=parseNum(fv('bpAmt').value);S.buyPlan={freq:fv('bpFreq').value,amount:a>0?a:0};if(S.demo){VERSION++;lsSet('lq_state',S);}else Store.save();softRender();toast('Buying plan saved');return;}
});
async function saveFile(name,txt,type){
  try{if(IN_CLAUDE){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:txt});return;}}}catch(err){if(err&&err.code==='declined')return;}
  try{const url=URL.createObjectURL(new Blob([txt],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}catch(err){toast('Saving files isn\'t available here. Use Copy backup.');}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-NET.lastOk>5*60000)refresh(false);});

/* ================= boot ================= */
function applyUpdown(){if((S.settings&&S.settings.updown)==='cvd')document.documentElement.dataset.updown='cvd';else delete document.documentElement.dataset.updown;}
const FIRST_VIEW={holdings:['sub','positions'],analysis:['asub','performance'],plan:['psub','budget'],settings:['sset','']};
function firstView(tab){const f=FIRST_VIEW[tab];if(f)UI[f[0]]=f[1];}
function boot(){
  $$('[data-icon]').forEach(el=>el.innerHTML=ICON[el.dataset.icon]);
  const local=Store.loadLocal();S=local||demoState();if(!local&&!STORE_RECOVERED)lsSet('lq_state',S); /* a damaged save is never overwritten by the example */
  for(const a of S.assets||[])if(a.symbol==='WEBN'&&(!a.dataSymbol||a.dataSymbol==='WEBN')){a.dataSymbol='WEBN:XETR';if(C.err)delete C.err[a.id];} // WEBN prices come from Xetra
  for(const a of S.accounts||[])if(/^KLP Likviditet$/i.test(a.broker||''))a.broker=''; // that was only an example
  if(UI.pid!=='__all'&&!S.portfolios.some(p=>p.id===UI.pid))UI.pid=(S.portfolios[0]||{}).id;
  if(!CCYS.includes(UI.ccy))UI.ccy='NOK';if(!['class','account','currency'].includes(UI.alloc))UI.alloc='class';if(!['performance','breakdown','tax'].includes(UI.asub))UI.asub='performance';UI.bms=(UI.bms||[]).filter(id=>BENCHMARKS.some(b=>b.id===id));if(!RANGES.includes(UI.prange))UI.prange='MAX';
  if(UI.privStart)UI.priv=true;
  const sp=UI.startPage||'overview';if(sp!=='last'){UI.tab=sp;firstView(sp);}
  applyUpdown();VERSION++;render();
  Store.connect();initAsk();refresh(false);
  setInterval(()=>{if(!document.hidden&&!NET.blocked)refresh(false);},15*60000);
  let lastDay=localToday();setInterval(()=>{if(localToday()!==lastDay){lastDay=localToday();VERSION++;render();}},60000);
}
window.__lacag={taxYear:y=>taxYear(y),dataIssues:()=>dataIssues(),compute:()=>compute(),series:(c)=>series(compute(),c||'NOK'),stats:(k,c)=>{const M=compute();return stats(M,series(M,c||'NOK'),k);},project:()=>project(compute()),get S(){return S;},set S(v){S=v;VERSION++;render();},C,bmCompare,startImport,importSheet};
boot();

})();
